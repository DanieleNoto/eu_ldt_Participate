apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jitsi-subpath-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "3000"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3000"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3000"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/websocket-services: "jitsi-web"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header Host $host;
      
spec:
  ingressClassName: nginx
  rules:
  - host: jitsi-part-int.ldttoolbox.app
    http:
      paths:
      - path: /xmpp-websocket
        pathType: Prefix
        backend:
          service:
            name: jitsi-prosody
            port:
              number: 5280
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jitsi-web
            port:
              number: 8000
