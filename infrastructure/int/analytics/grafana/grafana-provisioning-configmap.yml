apiVersion: v1
kind: ConfigMap
metadata:
    name: grafana-provisioning-datasources
data:
    # Provisioning datasources for Grafana
    # Passwords come from GF_DATABASE_PASSWORD env var (from grafana-secrets)
    decidim.yml: |
        apiVersion: 1
        datasources:
            - name: Decidim PostgreSQL
              type: postgres
              access: proxy
              url: _%GF-DATABASE-HOST%_:5432
              database: _%GF-DATABASE-NAME%_
              user: _%GF-DATABASE-USER%_
              secureJsonData:
                  password: ${GF_DATABASE_PASSWORD}
              jsonData:
                  sslmode: disable
                  searchPath: _%GF-DATABASE-NAME%_
                  postgresVersion: 1600
                  timescaledb: false
                  maxOpenConns: 100
                  maxIdleConns: 100
                  maxIdleConnsAuto: true
                  connMaxLifetime: 14400
              isDefault: true
              uid: decidim_postgres
              editable: true
