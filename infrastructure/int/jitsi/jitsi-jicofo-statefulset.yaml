apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: jitsi-jicofo
spec:
    serviceName: 'jitsi-jicofo'
    replicas: 1
    selector:
        matchLabels:
            app: jitsi-jicofo
    template:
        metadata:
            labels:
                app: jitsi-jicofo
        spec:
            automountServiceAccountToken: false
            containers:
                - name: jitsi-jicofo
                  image: jitsi/jicofo:stable-8960
                  imagePullPolicy: IfNotPresent
                  resources:
                      requests:
                          memory: '128Mi'
                          cpu: '100m'
                          ephemeral-storage: '512Mi'
                      limits:
                          memory: '512Mi'
                          cpu: '250m'
                          ephemeral-storage: '1Gi'
                  envFrom:
                      - configMapRef:
                            name: jitsi-config
                      - secretRef:
                            name: jitsi-secret
                  volumeMounts:
                      - mountPath: /config
                        name: jitsi-jicofo-storage
    volumeClaimTemplates:
        - metadata:
              name: jitsi-jicofo-storage
          spec:
              accessModes: ['ReadWriteOnce']
              resources:
                  requests:
                      storage: 100Mi
