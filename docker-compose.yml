services:
    decidim:
        #image: decidim/decidim-dev:0.30.1
        build: ./decidim/decidim_application/
        ports:
            - '3000:3000'
        env_file:
            - .env
        environment:
            - DATABASE_HOST=${DATABASE_HOST}
            - DATABASE_USERNAME=${DATABASE_USERNAME}
            - DATABASE_PASSWORD=${DATABASE_PASSWORD}
            - DATABASE_NAME=${DATABASE_NAME}
            - REDIS_URL=${REDIS_URL}
            - SECRET_KEY_BASE=${SECRET_KEY_BASE}
            - DECIDIM_FORCE_SSL=${DECIDIM_FORCE_SSL}
            - RAILS_ENV=${RAILS_ENV}
            - NODE_ENV=${NODE_ENV}
            - DECIDIM_MAILER_SENDER=${DECIDIM_MAILER_SENDER}
            - QUEUE_ADAPTER=${QUEUE_ADAPTER}
            - SHAKAPACKER_DEV_SERVER_HOST=0.0.0.0
            - SHAKAPACKER_DEV_SERVER_PORT=3035
            - SHAKAPACKER_DEV_SERVER_ENABLED=true
            # CSP Configuration for development
            - RAILS_CSP_DEVELOPMENT=true
            # Database reset and setup flags (controlled by make commands)
            - FORCE_DB_RESET=${FORCE_DB_RESET:-false}
            - FORCE_DATA_SETUP=${FORCE_DATA_SETUP:-false}
            # SMTP configuration
            - SMTP_ADDRESS=${SMTP_ADDRESS}
            - SMTP_PORT=${SMTP_PORT}
            - SMTP_USER_NAME=${SMTP_USER_NAME}
            - SMTP_PASSWORD=${SMTP_PASSWORD}
            - SMTP_DOMAIN=${SMTP_DOMAIN}
            - SMTP_AUTHENTICATION=${SMTP_AUTHENTICATION}
            - SMTP_ENABLE_STARTTLS_AUTO=${SMTP_ENABLE_STARTTLS_AUTO}
            - SMTP_OPENSSL_VERIFY_MODE=${SMTP_OPENSSL_VERIFY_MODE}
        volumes:
            - ./decidim/decidim_application:/code
            - bundle_cache:/usr/local/bundle
            - vendor_bundle:/app/vendor/bundle
            - node_modules:/code/node_modules
        command: bash /code/docker-entrypoint.sh
        networks:
            - private
        depends_on:
            redis:
                condition: service_started
            db:
                condition: service_started
        healthcheck:
            test: ['CMD', 'test', '-d', 'node_modules']
            interval: 10s
            timeout: 5s
            retries: 30
    db:
        image: postgres:16
        env_file:
            - .env
        environment:
            - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
            - POSTGRES_USER=${DATABASE_USERNAME}
            - POSTGRES_DATABASE=${DATABASE_NAME}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - private
        ports:
            - '5432:5432'
    redis:
        image: redis:7
        volumes:
            - redis_data:/data
        networks:
            - private
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 5
    shakapacker:
        build: ./decidim/decidim_application/
        command: bash -c "cd /code && bundle install && yarn install && bundle exec bin/shakapacker-dev-server"
        volumes:
            - ./decidim/decidim_application:/code
            - bundle_cache:/usr/local/bundle
            - vendor_bundle:/app/vendor/bundle
            - node_modules:/code/node_modules
        depends_on:
            - db
            - redis
        networks:
            - private
        ports:
            - '3035:3035'
        env_file:
            - .env
        environment:
            - RAILS_ENV=${RAILS_ENV}
            - NODE_ENV=${NODE_ENV}
            - SHAKAPACKER_DEV_SERVER_HOST=0.0.0.0
            - SHAKAPACKER_DEV_SERVER_PORT=3035
            - SHAKAPACKER_DEV_SERVER_PUBLIC=0.0.0.0:3035
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:3035']
            interval: 15s
            timeout: 10s
            retries: 20
            start_period: 30s

    grafana:
        image: grafana/grafana:11.0.0
        ports:
            - '3001:3000'
        env_file:
            - .env
        environment:
            - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
            - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
            - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
            - GF_SECURITY_ALLOW_EMBEDDING=true
            - DATABASE_HOST=${DATABASE_HOST}
            - DATABASE_NAME=${DATABASE_NAME}
            - DATABASE_USERNAME=${DATABASE_USERNAME}
            - DATABASE_PASSWORD=${DATABASE_PASSWORD}
        volumes:
            - grafana_data:/var/lib/grafana
            - ./analytics/grafana/provisioning:/etc/grafana/provisioning
            - ./analytics/grafana/dashboards:/etc/grafana/provisioning/dashboards
        networks:
            - private
        depends_on:
            - db

    matomo:
        image: matomo:5
        ports:
            - '8081:80'
        env_file:
            - .env
        environment:
            - MATOMO_DATABASE_HOST=${MATOMO_DATABASE_HOST}
            - MATOMO_DATABASE_ADAPTER=${MATOMO_DATABASE_ADAPTER}
            - MATOMO_DATABASE_TABLES_PREFIX=${MATOMO_DATABASE_TABLES_PREFIX}
            - MATOMO_DATABASE_USERNAME=${MATOMO_DATABASE_USERNAME}
            - MATOMO_DATABASE_PASSWORD=${MATOMO_DATABASE_PASSWORD}
            - MATOMO_DATABASE_DBNAME=${MATOMO_DATABASE_DBNAME}
        volumes:
            - matomo_data:/var/www/html
        depends_on:
            - matomo-db
        networks:
            - private

    matomo-db:
        image: mariadb:11
        env_file:
            - .env
        environment:
            - MYSQL_ROOT_PASSWORD=${MATOMO_DATABASE_PASSWORD}
            - MYSQL_DATABASE=${MATOMO_DATABASE_DBNAME}
            - MYSQL_USER=${MATOMO_DATABASE_USERNAME}
            - MYSQL_PASSWORD=${MATOMO_DATABASE_PASSWORD}
        volumes:
            - matomo_db_data:/var/lib/mysql
        networks:
            - private

    jitsi-web:
        image: jitsi/web:stable-8960
        restart: ${RESTART_POLICY:-unless-stopped}
        ports:
            - '${JITSI_HTTP_PORT:-8000}:80'
            - '${JITSI_HTTPS_PORT:-8443}:443'
        volumes:
            - ${CONFIG:-./jitsi-meet-cfg}/web:/config:Z
        environment:
            - ENABLE_AUTH
            - ENABLE_GUESTS
            - PUBLIC_URL
            - XMPP_DOMAIN
            - XMPP_AUTH_DOMAIN
            - XMPP_BOSH_URL_BASE
            - XMPP_GUEST_DOMAIN
            - XMPP_MUC_DOMAIN
            - XMPP_RECORDER_DOMAIN
            - TZ
        networks:
            - private
        depends_on:
            - jitsi-prosody

    jitsi-prosody:
        image: jitsi/prosody:stable-8960
        restart: ${RESTART_POLICY:-unless-stopped}
        expose:
            - '5222'
            - '5347'
            - '5280'
        volumes:
            - ${CONFIG:-./jitsi-meet-cfg}/prosody/config:/config:Z
            - ${CONFIG:-./jitsi-meet-cfg}/prosody/prosody-plugins-custom:/prosody-plugins-custom:Z
        environment:
            - AUTH_TYPE
            - ENABLE_AUTH
            - ENABLE_GUESTS
            - XMPP_DOMAIN
            - XMPP_AUTH_DOMAIN
            - XMPP_GUEST_DOMAIN
            - XMPP_MUC_DOMAIN
            - XMPP_INTERNAL_MUC_DOMAIN
            - XMPP_MODULES
            - XMPP_RECORDER_DOMAIN
            - JICOFO_AUTH_USER
            - JICOFO_AUTH_PASSWORD
            - JVB_AUTH_USER
            - JVB_AUTH_PASSWORD
            - TZ
        networks:
            - private

    jitsi-jicofo:
        image: jitsi/jicofo:stable-8960
        restart: ${RESTART_POLICY:-unless-stopped}
        volumes:
            - ${CONFIG:-./jitsi-meet-cfg}/jicofo:/config:Z
        environment:
            - ENABLE_AUTH
            - XMPP_DOMAIN
            - XMPP_AUTH_DOMAIN
            - XMPP_SERVER
            - XMPP_INTERNAL_MUC_DOMAIN
            - JICOFO_AUTH_USER
            - JICOFO_AUTH_PASSWORD
            - JVB_BREWERY_MUC
            - TZ
        depends_on:
            - jitsi-prosody
        networks:
            - private

    jitsi-jvb:
        image: jitsi/jvb:stable-8960
        restart: ${RESTART_POLICY:-unless-stopped}
        ports:
            - '${JVB_PORT:-10000}:${JVB_PORT:-10000}/udp'
        volumes:
            - ${CONFIG:-./jitsi-meet-cfg}/jvb:/config:Z
        environment:
            - DOCKER_HOST_ADDRESS
            - XMPP_AUTH_DOMAIN
            - XMPP_INTERNAL_MUC_DOMAIN
            - XMPP_SERVER
            - JVB_AUTH_USER
            - JVB_AUTH_PASSWORD
            - JVB_BREWERY_MUC
            - JVB_PORT
            - JVB_STUN_SERVERS
            - JVB_ENABLE_APIS
            - TZ
        networks:
            - private
        depends_on:
            - jitsi-prosody

volumes:
    decidim_public:
    redis_data:
    postgres_data:
    bundle_cache:
    vendor_bundle:
    node_modules:
    grafana_data:
    matomo_data:
    matomo_db_data:
    jitsi_web:
    jitsi_prosody:
    jitsi_jicofo:
    jitsi_jvb:
networks:
    private:
