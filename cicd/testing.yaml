name: Tool3-Testing-DEV-$(date:yyyyMMdd)$(rev:.r)
pool:
    vmImage: 'ubuntu-latest'

trigger:
    - main

variables:
    - group: 'TOOL3 - PT'
    - group: 'TOOL3 - PT - KV'
    - name: isMain
      value: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]

jobs:
    - job: PlaywrightAxeFrontend
      displayName: 'Install and Run Playwright / Axe (Frontend) & Publish Results'
      steps:
          - task: replacetokens@5
            displayName: 'Replace tokens Playwright'
            inputs:
                rootDirectory: tests/acceptance/e2e
                targetFiles: .env.ci
                tokenPattern: custom
                tokenPrefix: _%
                tokenSuffix: '%_'
                writeBOM: false
                verbosity: detailed
                actionOnNoFiles: warn
          - task: NodeTool@0
            inputs:
                versionSource: 'fromFile'
                versionFilePath: '.nvmrc'
          - task: Cache@2
            inputs:
                key: 'npm-pw | "$(Agent.OS)" | tests/acceptance/e2e/package-lock.json'
                restoreKeys: |
                    npm-pw | "$(Agent.OS)"
                path: tests/acceptance/e2e/node_modules
            displayName: 'Cache npm modules (Playwright)'
          - script: |
                cd tests/acceptance/e2e
                npm ci
                npx playwright install --with-deps
                npm install @axe-core/playwright axe-sarif-converter
            displayName: 'Install Playwright / Axe (Frontend)'
          - script: |
                cd tests/acceptance/e2e
                rm -rf a11y-reports
                echo "Old accessibility reports removed"
            displayName: 'Clean previous accessibility reports'
          - script: |
                cd tests/acceptance/e2e
                npm run test:ci
            env:
                CI: 'true'
            continueOnError: true
            displayName: 'Run Playwright / Axe (Frontend) - All tests except Keycloak'
          - script: |
                cd tests/acceptance/e2e
                npm run test:keycloak
            env:
                CI: 'true'
            continueOnError: true
            displayName: 'Run Playwright / Axe (Frontend) - Keycloak tests only'

          # Publish JUnit results (pass/fail)
          - task: PublishTestResults@2
            displayName: 'Publish Playwright / Axe Test Results (Frontend)'
            inputs:
                testResultsFormat: 'JUnit'
                testResultsFiles: '**/*junit.xml'
                testRunTitle: 'Playwright + Axe'

          # Publish WCAG reports (JSON + SARIF)
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Accessibility Reports (WCAG Compliance)'
            inputs:
                PathtoPublish: 'tests/acceptance/e2e/a11y-reports'
                ArtifactName: 'WCAG-AccessibilityReports'
                publishLocation: 'Container'
            condition: succeededOrFailed()

          - script: |
                echo "Publishing Playwright / Axe Test Results (Frontend)"
                python3 azure_test_plan/automated_test_publisher.py
            env:
                AUTO_TEST_DEVOPS_PAT: $(AUTO_TEST_DEVOPS_PAT)
            displayName: 'Publish Acceptance Results to Azure Test Plans'

    - job: Pact_Test
      dependsOn: PlaywrightAxeFrontend
      displayName: 'Run Pact'
      variables:
          tag: '$(Build.BuildId)'
          GIT_BRANCH: '$(Build.SourceBranchName)'
      pool:
          vmImage: ubuntu-latest
      steps:
          - task: UsePythonVersion@0
            inputs:
                versionSpec: '3.12'
                addToPath: true
                architecture: 'x64'
            displayName: 'Install Python'

          - script: |
                pip install -r ./tests/requirements-dev.txt
            displayName: 'Install tool dependencies'

          - task: UseNode@1
            inputs:
                version: '22.14'
            displayName: 'Install Node.js'

          - script: |
                npm install
            displayName: 'Install tool dependencies'

          - script: |
                curl -fsSL https://raw.githubusercontent.com/pact-foundation/pact-ruby-standalone/master/install.sh | PACT_CLI_VERSION=v2.4.24 bash
                PATH=~/pact/bin/:${PATH}
            displayName: 'Install pact cli'

          - script: |
                cd tests/contract
                npm i
                npm run test:contract
                npm run test:provider
                npx pact-broker publish pacts --broker-base-url $(PACT_SERVER) --consumer-app-version=$(tag) --branch $(GIT_BRANCH)
            displayName: 'Run and publish Pact test'

    - job: PerformanceTests
      dependsOn: Pact_Test
      displayName: Service Load Test
      steps:
          - task: replacetokens@5
            displayName: 'Replace tokens Locust'
            inputs:
                rootDirectory: tests/performance/
                targetFiles: locust.conf
                tokenPattern: custom
                tokenPrefix: _%
                tokenSuffix: '%_'
                writeBOM: false
                verbosity: detailed
                actionOnNoFiles: warn
          - task: UsePythonVersion@0
            inputs:
                versionSpec: '3.12'
                addToPath: true
                architecture: 'x64'
            displayName: 'Install Python'

          - script: |
                pip install -r ./tests/requirements-dev.txt
                pip install locust==2.33.0
            displayName: 'Install locust dependencies'

          - script: |
                locust --headless -u 100 --run-time 10m --config tests/performance/locust.conf
            displayName: 'Run load test'

          - task: PublishPipelineArtifact@1
            inputs:
                targetPath: 'locust_results_file.html'
                artifactName: 'LocustResults'
            condition: succeededOrFailed()
            displayName: 'Save results'
