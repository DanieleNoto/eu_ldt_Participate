apiVersion: v1
kind: Service
metadata:
    name: part-backend
    namespace: participate
spec:
    type: ClusterIP
    selector:
        app: part-webapp
    ports:
        - port: 3000
          targetPort: 3000
          protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
    name: part-pg
    namespace: participate
spec:
    type: ClusterIP
    selector:
        app: part-webapp
    ports:
        - name: pgsql
          protocol: TCP
          port: 5432
          targetPort: 5432
