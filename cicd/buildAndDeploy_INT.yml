- job: deployment
  dependsOn: buildAndPushDockerfile
  displayName: Kubectl Tool3 deployment
  steps:
    - task: replacetokens@5
      displayName: "Replace tokens Tools"
      inputs:
        rootDirectory: infrastructure/int
        tokenPattern: custom
        tokenPrefix: _%
        tokenSuffix: '%_'
        writeBOM: false
        verbosity: detailed
        actionOnNoFiles: warn

    - task: KubectlInstaller@0
      displayName: "Kubectl Install"
      inputs:
        kubectlVersion: 'latest'

    - task: Kubernetes@1
      displayName: "Apply Namespaces (Tool3)"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/namespace.yml'

    # Shared Storage Secret  
    - task: Kubernetes@1
      displayName: "Delete existing storage-secret if it exists"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'        
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'delete'
        arguments: secret storage-secret --ignore-not-found=true

    - task: Kubernetes@1
      displayName: "Create Shared Storage Secret (Tool3)"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'        
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'create'
        arguments: secret generic storage-secret --from-literal=azurestorageaccountname=euldtsharedtfstateint --from-literal=azurestorageaccountkey=$(STORAGE-ACCOUNT-KEY)
        secretType: 'generic'

    # Database StatefulSet
    - task: Kubernetes@1
      displayName: "DB - Apply Services"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'        
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/decidim/db/db-service.yaml'


    - task: Kubernetes@1
      displayName: "DB - Apply Statefulset"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'        
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/decidim/db/db-statefulset.yaml'

    # Redis StatefulSet

    - task: Kubernetes@1
      displayName: "REDIS - Apply Statefulset"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'        
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/decidim/redis/redis-statefulset.yaml'

    # Jitsi Configuration
    - task: Kubernetes@1
      displayName: "JITSI - Apply ConfigMaps and Secrets"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'        
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/jitsi/jitsi-configmap.yml -f infrastructure/int/jitsi/jitsi-secrets.yml'

    # Jitsi StatefulSets
    - task: Kubernetes@1
      displayName: "JITSI-JICOFO - Delete existing StatefulSet if it exists"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'        
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'delete'
        arguments: 'statefulset jitsi-jicofo --ignore-not-found=true'

    - task: Kubernetes@1
      displayName: "JITSI-JICOFO - Apply Statefulset"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'        
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/jitsi/jitsi-jicofo-statefulset.yaml'

    - task: Kubernetes@1
      displayName: "JITSI-JVB - Delete existing StatefulSet if it exists"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'        
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'delete'
        arguments: 'statefulset jitsi-jvb --ignore-not-found=true'

    - task: Kubernetes@1
      displayName: "JITSI-JVB - Apply Statefulset"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'        
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/jitsi/jitsi-jvb-statefulset.yaml'

    - task: Kubernetes@1
      displayName: "JITSI-PROSODY - Delete existing StatefulSet if it exists"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'        
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'delete'
        arguments: 'statefulset jitsi-prosody --ignore-not-found=true'

    - task: Kubernetes@1
      displayName: "JITSI-PROSODY - Apply Statefulset"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'        
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/jitsi/jitsi-prosody-statefulset.yaml'

    # Jitsi Web Component (for routing)
    - task: Kubernetes@1
      displayName: "JITSI-WEB - Apply Deployment"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'        
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/jitsi/jitsi-web-deployment.yml'

    - task: Kubernetes@1
      displayName: "JITSI-WEB - Apply Service"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'        
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/jitsi/jitsi-web-service.yml'

    - task: Kubernetes@1
      displayName: "JITSI - Apply Additional Services"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'        
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/jitsi/jitsi-jvb-service.yml -f infrastructure/int/jitsi/jitsi-prosody-service.yml'

    # Matomo StatefulSets  
    - task: Kubernetes@1
      displayName: "MATOMO DB - Delete existing StatefulSet if it exists"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'        
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'delete'
        arguments: 'statefulset matomo-db --ignore-not-found=true'

    - task: Kubernetes@1
      displayName: "MATOMO DB - Apply Statefulset"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'        
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/analytics/matomo/matomo-db-deployment.yml'

    - task: Kubernetes@1
      displayName: "MATOMO - Apply Deployment"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'        
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/analytics/matomo/matomo-deployment.yml'

    - task: Kubernetes@1
      displayName: "MATOMO - Apply Service"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'        
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/analytics/matomo/matomo-service.yml'

    # Analytics Components
    - task: Kubernetes@1
      displayName: "GRAFANA - Apply Deployment"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'        
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/analytics/grafana/grafana-deployment.yml'

    - task: Kubernetes@1
      displayName: "GRAFANA - Apply Service"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'        
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/analytics/grafana/grafana-service.yml'

    - task: Kubernetes@1
      displayName: "ANALYTICS - Apply ConfigMaps and Secrets"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'        
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/analytics/grafana/grafana-configmap.yml -f infrastructure/int/analytics/grafana/grafana-secret.yml -f infrastructure/int/analytics/matomo/matomo-configmap.yml -f infrastructure/int/analytics/matomo/matomo-secret.yml'

    # Decidim Configuration
    - task: Kubernetes@1
      displayName: "Decidim - Apply ConfigMap"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'        
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/decidim/ConfigMap.yml'

    - task: Kubernetes@1
      displayName: "Decidim - Delete existing StatefulSet if it exists"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'        
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'delete'
        arguments: 'statefulset decidim --ignore-not-found=true'

    - task: Kubernetes@1
      displayName: "Decidim - Apply Statefulset"
      inputs:
          connectionType: 'Azure Resource Manager'
          azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
          azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'        
          kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
          namespace: 'participate'              
          command: 'apply'
          arguments: '-f infrastructure/int/decidim/decidim-statefulset.yaml'

    - task: Kubernetes@1
      displayName: "Decidim - Apply Services"
      inputs:
          connectionType: 'Azure Resource Manager'
          azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
          azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'        
          kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
          namespace: 'participate'              
          command: 'apply'
          arguments: '-f infrastructure/int/decidim/decidim-service.yaml'

