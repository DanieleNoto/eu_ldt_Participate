apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-configmap
  namespace: participate
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        5
        Daemon       Off
        Log_Level    info
        Parsers_File parsers.conf

    [INPUT]
        Name        tail
        Path        /code/log/*.log
        Path_Key    filename
        Tag         app.log
        DB          /code/log/flb_kube.db
        Buffer_Chunk_Size 512k
        Buffer_Max_Size   10M
        Skip_Long_Lines   On
        Refresh_Interval 5
        Parser      json

    [FILTER]
        Name        modify
        Match       *
        Add         source "fluent-bit"
        
    [OUTPUT]
        Name        loki
        Match       *
        Host        _%ALLOY_EXTERNAL_IP%_
        Port        9999
        URI         /loki/api/v1/push
        Labels      job="app"
        Line_Format  json

  parsers.conf: |
    [PARSER]
        Name        json
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%LZ
