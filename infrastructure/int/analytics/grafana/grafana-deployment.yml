apiVersion: apps/v1
kind: Deployment
metadata:
    name: grafana
spec:
    replicas: 1
    selector:
        matchLabels:
            app: grafana
    template:
        metadata:
            labels:
                app: grafana
        spec:
            # Disable automatic mounting of the service account token for improved security
            automountServiceAccountToken: false
            containers:
                - name: grafana
                  image: grafana/grafana:11.0.0
                  ports:
                      - containerPort: 3000
                  envFrom:
                      - configMapRef:
                            name: grafana-config
                      - secretRef:
                            name: grafana-secrets
                  resources:
                    requests:
                      memory: "256Mi"
                      cpu: "250m"
                      ephemeral-storage: "1Gi"
                    limits:
                      memory: "512Mi"
                      cpu: "500m"
                      ephemeral-storage: "2Gi"
                  volumeMounts:
                      - name: grafana-data
                        mountPath: /var/lib/grafana
            volumes:
                - name: grafana-data
                  persistentVolumeClaim:
                      claimName: grafana-pvc
