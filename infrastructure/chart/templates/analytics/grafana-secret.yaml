apiVersion: v1
kind: Secret
metadata:
    name: grafana-secrets
    namespace: {{ include "eu-ldt-participate.namespace" . }}
type: Opaque
stringData:
    GF_SECURITY_ADMIN_PASSWORD: {{ .Values.grafana.admin.password }}
    GF_AUTH_GENERIC_OAUTH_CLIENT_ID: {{ .Values.grafana.oauth.clientId }}
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: {{ .Values.grafana.oauth.clientSecret }}
    GF_DATABASE_PASSWORD: {{ .Values.grafana.db.password }}
