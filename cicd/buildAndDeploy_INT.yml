name: Tool3-BuildAndDeploy-INT-$(date:yyyyMMdd)$(rev:.r)

#resources:
#  pipelines:
#    - pipeline: QualityCheck
#      source: 'EU LDT Participate - Quality Checks'
#      trigger: true
#
#
trigger: none

pool:
    vmImage: 'ubuntu-latest'

variables:
    - group: 'Tool 3 - Tool parameters - INT'
    - group: 'Tool 3 - Resources Configuration - INT'
    - group: 'Toolbox Shared Infrastructure - INTEGRATION'
    - group: 'TOOL3 - PT'
    - group: 'TOOL3 - PT - KV'

jobs:
    - job: buildAndPushDockerfile
      displayName: 'Build Tool Images; Push to ACR; Deploy Tool - INTEGRATION'
      variables:
          tag: '$(Build.BuildId)'
      steps:
          - task: Docker@2
            displayName: Build decidim
            inputs:
                command: build
                repository: eu-ldt-part-int
                dockerfile: decidim/decidim_application/Dockerfile
                containerRegistry: EU-LDT-Toolbox-ACR-Shared-INT
                buildContext: decidim/decidim_application
                addPipelineData: false
                addBaseImageData: false
                arguments: --build-arg RAILS_ENV=production --build-arg NODE_ENV=production
                tags: |
                    $(tag)

          - task: Docker@2
            displayName: Push decidim
            inputs:
                command: push
                repository: eu-ldt-part-int
                dockerfile: decidim/decidim_application/Dockerfile
                containerRegistry: EU-LDT-Toolbox-ACR-Shared-INT
                buildContext: decidim/decidim_application
                addPipelineData: false
                addBaseImageData: false
                tags: |
                    $(tag)

          - task: Docker@2
            displayName: Build Grafana custom image
            inputs:
                command: build
                repository: grafana-custom
                dockerfile: analytics/grafana/Dockerfile
                containerRegistry: EU-LDT-Toolbox-ACR-Shared-INT
                buildContext: analytics/grafana
                addPipelineData: false
                addBaseImageData: false
                tags: |
                    $(tag)

          - task: Docker@2
            displayName: Push Grafana custom image
            inputs:
                command: push
                repository: grafana-custom
                containerRegistry: EU-LDT-Toolbox-ACR-Shared-INT
                addPipelineData: false
                addBaseImageData: false
                tags: |
                    $(tag)

          - task: Docker@2
            displayName: Build Matomo custom image
            inputs:
                command: build
                repository: matomo-custom
                dockerfile: analytics/matomo/Dockerfile
                containerRegistry: EU-LDT-Toolbox-ACR-Shared-INT
                buildContext: analytics/matomo
                addPipelineData: false
                addBaseImageData: false
                tags: |
                    $(tag)

          - task: Docker@2
            displayName: Push Matomo custom image
            inputs:
                command: push
                repository: matomo-custom
                containerRegistry: EU-LDT-Toolbox-ACR-Shared-INT
                addPipelineData: false
                addBaseImageData: false
                tags: |
                    $(tag)

          - task: Docker@2
            displayName: Build Chatbot backend custom image
            inputs:
                command: buildAndPush
                repository: eu-ldt-chatbot-be-int
                dockerfile: backend/Dockerfile
                containerRegistry: EU-LDT-Toolbox-ACR-Shared-INT
                tags: |
                    $(tag)

          - task: Docker@2
            displayName: Build Chatbot frontend custom image
            inputs:
                command: buildAndPush
                repository: eu-ldt-chatbot-fe-int
                dockerfile: frontend/Dockerfile
                containerRegistry: EU-LDT-Toolbox-ACR-Shared-INT
                tags: |
                    $(tag)

    - job: deployment
      dependsOn: buildAndPushDockerfile
      displayName: Kubectl Tool3 deployment
      steps:
          - task: replacetokens@5
            displayName: 'Replace tokens decidim'
            inputs:
                rootDirectory: infrastructure/int/decidim
                targetFiles: 'decidim-statefulset.yaml,decidim-configmap.yml,decidim-secret.yml'
                tokenPattern: custom
                tokenPrefix: _%
                tokenSuffix: '%_'
                writeBOM: false
                verbosity: detailed
                actionOnNoFiles: warn

          - task: replacetokens@5
            displayName: 'Replace tokens decidim db'
            inputs:
                rootDirectory: infrastructure/int/decidim/db
                targetFiles: 'db-configmap.yml,db-secret.yml'
                tokenPattern: custom
                tokenPrefix: _%
                tokenSuffix: '%_'
                writeBOM: false
                verbosity: detailed
                actionOnNoFiles: warn

          - task: replacetokens@5
            displayName: 'Replace tokens chatbot BE'
            inputs:
                rootDirectory: infrastructure/int/backend
                targetFiles: 'chatbot-be-configmap.yml,chatbot-be-secrets.yml,chatbot-db-configmap.yml,chatbot-db-secrets.yml'
                tokenPattern: custom
                tokenPrefix: _%
                tokenSuffix: '%_'
                writeBOM: false
                verbosity: detailed
                actionOnNoFiles: warn

          - task: replacetokens@5
            displayName: 'Replace tokens chatbot FE'
            inputs:
                rootDirectory: infrastructure/int/frontend
                targetFiles: 'chatbot-fe-configmap.yml'
                tokenPattern: custom
                tokenPrefix: _%
                tokenSuffix: '%_'
                writeBOM: false
                verbosity: detailed
                actionOnNoFiles: warn

          - task: replacetokens@5
            displayName: 'Replace tokens jitsi'
            inputs:
                rootDirectory: infrastructure/int/jitsi
                targetFiles: 'jitsi-configmap.yml, jitsi-secret.yml'
                tokenPattern: custom
                tokenPrefix: _%
                tokenSuffix: '%_'
                writeBOM: false
                verbosity: detailed
                actionOnNoFiles: warn

          - task: replacetokens@5
            displayName: 'Replace tokens Chatbot webapp'
            inputs:
                rootDirectory: infrastructure/int/webapp
                targetFiles: 'chatbot-statefulset.yml'
                tokenPattern: custom
                tokenPrefix: _%
                tokenSuffix: '%_'
                writeBOM: false
                verbosity: detailed
                actionOnNoFiles: warn

          - task: replacetokens@5
            displayName: 'Replace tokens GRAFANA'
            inputs:
                rootDirectory: infrastructure/int/analytics/grafana
                targetFiles: 'grafana-statefulset.yaml,grafana-configmap.yml,grafana-secret.yml'
                tokenPattern: custom
                tokenPrefix: _%
                tokenSuffix: '%_'
                writeBOM: false
                verbosity: detailed
                actionOnNoFiles: warn

          - task: replacetokens@5
            displayName: 'Replace tokens MATOMO'
            inputs:
                rootDirectory: infrastructure/int/analytics/matomo
                targetFiles: 'matomo-statefulset.yaml,matomo-configmap.yml,matomo-secret.yml'
                tokenPattern: custom
                tokenPrefix: _%
                tokenSuffix: '%_'
                writeBOM: false
                verbosity: detailed
                actionOnNoFiles: warn

          - task: KubectlInstaller@0
            displayName: 'Kubectl Install'
            inputs:
                kubectlVersion: 'latest'

          - task: Kubernetes@1
            displayName: 'Apply Namespaces (Tool3)'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'apply'
                arguments: '-f infrastructure/int/namespace.yml'
          # ASR: Añadimos la eliminacion del ACR Pull Secret para volver a generarlo
          - task: Kubernetes@1
            displayName: 'Delete ACR Pull Secret if exists (Tool3)'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'delete'
                arguments: secret acr-secret --ignore-not-found=true
          #-------------------------------------------------------------------------------
          - task: Kubernetes@1
            displayName: 'Set ACR Pull Secret (Tool3)'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'create'
                arguments: secret docker-registry acr-secret --docker-server=euldtshared.azurecr.io --docker-username=f703f14b-9128-4eb8-b78b-a819d3e66d32 --docker-password=y_LusONCFAN7Az6SI7lHCq4S0YwqZzV3t-
                secretType: 'dockerRegistry'
                containerRegistryType: 'Azure Container Registry'

          #
          #
          #
          #ASR: Añadimos la eliminacion del Shared Storage Secret para volver a generarlo
