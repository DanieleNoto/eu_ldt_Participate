# File written by Decidim generator
# Note: You must restart bin/webpack-dev-server for changes to take effect

default: &default
    source_path: app/packs
    source_entry_path: entrypoints
    nested_entries: true
    css_extract_ignore_order_warnings: false

    public_root_path: public
    public_output_path: decidim-packs
    cache_path: tmp/shakapacker
    webpack_compile_output: false
    extract_css: true
    shakapacker_precompile: false

    additional_paths:
        - node_modules
        - app/packs

    # Reload manifest.json on all requests so we reload latest compiled packs
    cache_manifest: false

    # Select loader to use, available options are 'babel' (default), 'swc' or 'esbuild'
    webpack_loader: 'esbuild'

    # Set to true to enable check for matching versions of shakapacker gem and NPM package - will raise an error if there is a mismatch or wildcard versioning is used
    ensure_consistent_versioning: true

    # Select whether the compiler will use SHA digest ('digest' option) or most recent modified timestamp ('mtime') to determine freshness
    compiler_strategy: digest

    # Select whether the compiler will always use a content hash and not just in production
    # Do not use contentHash except for production for performance
    # https://webpack.js.org/guides/build-performance/#avoid-production-specific-tooling
    useContentHash: false

    # Workbox configuration to handle large precache files
    # Increase the maximum file size that can be precached (default: 2.5MB)
    workbox:
        maximumFileSizeToCacheInBytes: 5242880 # 5 MB

development:
    <<: *default
    compile: false
    compiler_strategy: mtime

    # Reference: https://webpack.js.org/configuration/dev-server/
    dev_server:
        https: false
        host: localhost
        port: 3035
        public: localhost:3035
        # Disable host header checking for development
        disableHostCheck: true
        # Hot Module Replacement disabled for stability
        hmr: false
        # CSS is extracted inline for faster feedback
        inline_css: true
        # Allowed hosts for WebSocket connections
        host_whitelist:
            - .sock$
            - localhost
            - localhost:3035
            - 127.0.0.1
            - 127.0.0.1:3035
            - shakapacker
            - shakapacker:3035
            - host.docker.internal
            - decidim
        client:
            # Disable full-screen overlay for cleaner development experience
            overlay: false
            # Configure WebSocket URL for browser to connect to localhost
            # The browser cannot resolve 'shakapacker' hostname, so use localhost
            webSocketURL:
                hostname: localhost
                pathname: /ws
                port: 3035
        # Enable gzip compression for faster transfers
        compress: true
        # Allow all hosts to prevent DNS rebinding issues
        allowed_hosts: all
        pretty: true
        headers:
            'Access-Control-Allow-Origin': '*'
            'Access-Control-Allow-Methods': 'GET, POST, PUT, DELETE, PATCH, OPTIONS'
            'Access-Control-Allow-Headers': 'Content-Type, Authorization'
        # Watch configuration for file changes
        static:
            watch:
                ignored:
                    - '**/node_modules/**'
                    - '**/tmp/**'
                    - '**/log/**'
                    - '**/public/assets/**'
                    - '**/public/decidim-packs/**'
                    - '**/storage/**'
                # Polling for change detection
                poll: 1000
                aggregateTimeout: 300

test:
    <<: *default
    compile: true
    public_output_path: packs-test

production:
    <<: *default

    # Production depends on precompilation of packs prior to booting for performance.
    compile: false

    # Use content hash for naming assets. Cannot be overridden by for production.
    useContentHash: true

    # Cache manifest.json for performance
    cache_manifest: true
