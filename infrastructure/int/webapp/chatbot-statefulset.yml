apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: chatbot-webapp
    namespace: participate
spec:
    selector:
        matchLabels:
            app: chatbot-webapp
    serviceName: chatbot-webapp
    replicas: 1
    minReadySeconds: 10
    template:
        metadata:
            labels:
                app: chatbot-webapp
        spec:
            terminationGracePeriodSeconds: 10
            hostname: chatbot-webapp
            imagePullSecrets:
                - name: acr-secret
            #----------ADD ASR-------------------------------------
            serviceAccountName: default
            automountServiceAccountToken: false
            #------------------------------------------------------
            initContainers:
                - name: init-postgres-data
                  image: busybox
                  command: ['sh', '-c', 'mkdir -p /var/lib/postgresql/data/pgdata && chown -R 999:999 /var/lib/postgresql/data/pgdata']
                  volumeMounts:
                      - name: chatbot-pg-storage
                        mountPath: /var/lib/postgresql/data
            containers:
                - name: chatbot-backend
                  image: euldtshared.azurecr.io/eu-ldt-chatbot-be-int:_%CONTAINER_IMAGE_TOOL_TAG%_
                  imagePullPolicy: Always
                  command:
                      - /bin/sh
                      - -c
                      - |
                        echo "Waiting for PostgreSQL to be ready..."
                        DB_HOST=${DB_HOST:-127.0.0.1}
                        DB_PORT=${DB_PORT:-5432}
                        
                        echo "Environment variables:"
                        echo "  DB_HOST: $DB_HOST"
                        echo "  DB_PORT: $DB_PORT"
                        echo "  DB_NAME: $DB_NAME"
                        echo "  DB_USER: $DB_USER"
                        
                        echo "Checking connection to PostgreSQL at $DB_HOST:$DB_PORT"
                        max_attempts=30
                        attempt=0
                        while [ $attempt -lt $max_attempts ]; do
                          if timeout 5 bash -c "</dev/tcp/$DB_HOST/$DB_PORT" 2>/dev/null; then
                            echo "PostgreSQL is ready!"
                            break
                          fi
                          attempt=$((attempt + 1))
                          echo "PostgreSQL unavailable (attempt $attempt/$max_attempts) - waiting..."
                          sleep 2
                        done
                        
                        if [ $attempt -eq $max_attempts ]; then
                          echo "ERROR: PostgreSQL connection timeout after $max_attempts attempts"
                          exit 1
                        fi
                        
                        echo "Starting backend..."
                        echo "Current directory: $(pwd)"
                        echo "Files in directory: $(ls -la)"
                        echo "Node version: $(node --version 2>/dev/null || echo 'Node not found')"
                        echo "Checking if dist/server.js exists..."
                        if [ -f "dist/server.js" ]; then
                          echo "dist/server.js found, starting application..."
                          exec node dist/server.js
                        else
                          echo "ERROR: dist/server.js not found!"
                          ls -la dist/ 2>/dev/null || echo "dist directory not found"
                          exit 1
                        fi
                  resources:
                      requests:
                          cpu: '100m'
                          memory: '128Mi'
                          ephemeral-storage: '1Gi'
                      limits:
                          cpu: '250m'
                          memory: '256Mi'
                          ephemeral-storage: '2Gi'
                  ports:
                      - containerPort: 3002
                        name: http-web
                  volumeMounts:
                      - name: chatbot-backend-storage
                        mountPath: /mnt/shared
                        readOnly: false
                  startupProbe:
                      httpGet:
                          path: /health
                          port: 3002
                      initialDelaySeconds: 30
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 30
                  livenessProbe:
                      httpGet:
                          path: /health
                          port: 3002
                      initialDelaySeconds: 60
                      periodSeconds: 30
                      timeoutSeconds: 5
                      failureThreshold: 3
                  readinessProbe:
                      httpGet:
                          path: /health
                          port: 3002
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3
                  envFrom:
                      - secretRef:
                            name: chatbot-backend-secret
                      - configMapRef:
                            name: chatbot-backend-config
                      - secretRef:
                            name: chatbot-backend-db-secret
                      - configMapRef:
                            name: chatbot-backend-db-config
                - name: chatbot-pg
                  image: docker.io/library/postgres:17.3
                  imagePullPolicy: IfNotPresent
                  resources:
                      requests:
                          cpu: '100m'
                          memory: '128Mi'
                          ephemeral-storage: '1Gi'
                      limits:
                          cpu: '250m'
                          memory: '256Mi'
                          ephemeral-storage: '1Gi'
                  ports:
                      - containerPort: 5432
                        name: postgres
                  envFrom:
                    - secretRef:
                        name: chatbot-backend-db-secret
                    - configMapRef:
                        name: chatbot-backend-db-config
                  volumeMounts:
                      - name: chatbot-pg-storage
                        mountPath: /var/lib/postgresql/data
                - name: chatbot-frontend
                  image: euldtshared.azurecr.io/eu-ldt-chatbot-fe-int:_%CONTAINER_IMAGE_TOOL_TAG%_
                  imagePullPolicy: Always
                  resources:
                      requests:
                          cpu: '100m'
                          memory: '128Mi'
                          ephemeral-storage: '128Mi'
                      limits:
                          cpu: '250m'
                          memory: '256Mi'
                          ephemeral-storage: '256Mi'
                  ports:
                      - containerPort: 5001
                        name: http
                  volumeMounts:
                      - name: chatbot-frontend-storage
                        mountPath: /mnt/shared
                        readOnly: false
                  startupProbe:
                      httpGet:
                          path: /
                          port: 5001
                      initialDelaySeconds: 30
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 30
                  livenessProbe:
                      httpGet:
                          path: /
                          port: 5001
                      initialDelaySeconds: 60
                      periodSeconds: 30
                      timeoutSeconds: 5
                      failureThreshold: 3
                  readinessProbe:
                      httpGet:
                          path: /
                          port: 5001
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3
                  envFrom:
                      - configMapRef:
                            name: chatbot-frontend-config
    volumeClaimTemplates:
      - metadata:
          name: chatbot-pg-storage
        spec:
          accessModes: [ 'ReadWriteOnce' ]
          resources:
            requests:
              storage: 100Mi
      - metadata:
          name: chatbot-frontend-storage
        spec:
          accessModes: [ 'ReadWriteOnce' ]
          resources:
            requests:
              storage: 100Mi
      - metadata:
          name: chatbot-backend-storage
        spec:
          accessModes: [ 'ReadWriteOnce' ]
          resources:
            requests:
              storage: 100Mi
