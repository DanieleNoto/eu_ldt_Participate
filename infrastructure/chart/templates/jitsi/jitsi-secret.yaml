{{- if .Values.jitsi.enabled }}
apiVersion: v1
kind: Secret
metadata:
    name: jitsi-secret
    namespace: {{ include "eu-ldt-participate.namespace" . }}
type: Opaque
stringData:
    JICOFO_AUTH_PASSWORD: {{ .Values.jitsi.jicofoAuthPassword | quote }}
    JVB_AUTH_PASSWORD: {{ .Values.jitsi.jvbAuthPassword | quote }}
    JWT_APP_SECRET: {{ .Values.jitsi.jwtAppSecret | quote }}
{{- end }}
