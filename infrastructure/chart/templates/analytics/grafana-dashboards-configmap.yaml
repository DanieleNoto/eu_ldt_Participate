        					"format": "table",
        					"rawQuery": true,
        					"rawSql": "WITH newsletter_performance AS (\n  SELECT \n    n.id,\n    COALESCE(n.subject->>'en', n.subject->>'it', n.subject->>'fr', n.subject->>'de', n.subject->>'es', n.subject::text) as subject,\n    n.sent_at,\n    u_author.name as author_name,\n    COUNT(DISTINCT u_recipient.id) as total_recipients,\n    COUNT(DISTINCT CASE WHEN u_recipient.last_sign_in_at >= n.sent_at AND u_recipient.last_sign_in_at <= n.sent_at + INTERVAL '24 hours' THEN u_recipient.id END) as day1_responses,\n    COUNT(DISTINCT CASE WHEN u_recipient.last_sign_in_at >= n.sent_at AND u_recipient.last_sign_in_at <= n.sent_at + INTERVAL '7 days' THEN u_recipient.id END) as week1_responses,\n    ROUND(\n      (COUNT(DISTINCT CASE WHEN u_recipient.last_sign_in_at >= n.sent_at AND u_recipient.last_sign_in_at <= n.sent_at + INTERVAL '7 days' THEN u_recipient.id END) * 100.0 / \n       NULLIF(COUNT(DISTINCT u_recipient.id), 0)), 2\n    ) as response_rate\n  FROM decidim_newsletters n\n  LEFT JOIN decidim_users u_author ON n.author_id = u_author.id\n  CROSS JOIN decidim_users u_recipient\n  WHERE n.sent_at >= NOW() - INTERVAL '$time_range days'\n    AND n.sent_at IS NOT NULL\n    AND u_recipient.deleted_at IS NULL \n    AND u_recipient.type = 'Decidim::User' \n    AND u_recipient.confirmed_at IS NOT NULL\n    AND u_recipient.newsletter_notifications_at IS NOT NULL\n  GROUP BY n.id, n.subject, n.sent_at, u_author.name\n)\nSELECT \n  subject,\n  author_name,\n  sent_at,\n  total_recipients,\n  day1_responses,\n  week1_responses,\n  response_rate\nFROM newsletter_performance\nWHERE total_recipients > 0\nORDER BY sent_at DESC;",
