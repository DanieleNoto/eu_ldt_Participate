apiVersion: v1
kind: ConfigMap
metadata:
  name: tool3-config
data:
  sample_key : samplevalue
  postgres_user: admin
  pg_jdbc_url: jdbc:postgresql://${TOOL3_PG_SERVICE_HOST}:5432/default
  DB_DIALECT : postgres
  DB_HOST : tool3-0
  DB_USERNAME : _%TOOL3-APP-PG-USER%_
  DB_PORT : "5432"
  DB_NAME : participate
  USE_SWAGGER: "true"
  AUTH_PROVIDER: 'TOOL5'
  OAUTH2_REALM: 'LDT'
  OAUTH2_CLIENT_ID: 'tool3'
  OAUTH2_BASE_URL: '_%OAUTH2_BASE_URL%_'
  OAUTH2_CALLBACK_URL: '_%OAUTH2_CALLBACK_URL%_'
  FRONTEND_URL: '_%FRONTEND_URL%_'
  setup.json: |
    {
      "apiBaseUrl": "_%TOOL3_API_BASE_URL%_/api"
    }