apiVersion: v1
kind: ConfigMap
metadata:
    name: chatbot-backend-config
    namespace: participate
data:
    PORT: '3002'
    NODE_ENV: 'production'
    CONTEXT_URL: '/api/v1'
    # CORS
    CORS_ORIGINS: https://chatbot-frontend-svc:80,https://part-int.ldttoolbox.app/
    SWAGGER_GEN_DOC_FILE: 'false'
    # Security
    DISABLE_HELMET: 'false'
    JWT_ENABLE_CHECK: 'false'
    DATABASE_SYNC: 'false'
    LOGGER_LEVEL: 'info'
    RATE_LIMIT_TIME_WINDOW: '1 minute'
    RATE_LIMIT_MAX: '100'
    EVENT_LOOP_DELAY: '900000'
    MAX_HEAP_USED_BYTES: '90000000000'
    MAX_RSS_BYTES: '90000000000'
    MAX_EVENT_LOOP_USE: '0.98'
    # Chatbot Configuration
    CHATBOT_SUPPORT_EMAIL: 'ldt.test.smtp@gmail.com'
    CHATBOT_FROM_EMAIL: 'ldt.test.smtp@gmail.com'
    # Database
    DB_NAME: chatbot_db
    DB_HOST: 127.0.0.1
    DB_PORT: '5432'
    DB_DIALECT: postgres
    DB_MAX_POOL: '100'
    DB_MIN_POOL: '2'
    DB_IDLE_POOL: '1000'
    DB_SCHEMA: public
    #Sequelize
    SEQUELIZE_SEEDER_STORAGE: sequelize
    SEQUELIZE_SEEDER_STORAGE_TABLE_NAME: SequelizeData
    SEQUELIZE_MIGRATION_STORAGE: sequelize
    SEQUELIZE_MIGRATION_STORAGE_TABLE_NAME: SequelizeData
    # SMTP/Email Configuration
    SMTP_ADDRESS: smtp.gmail.com
    SMTP_PORT: '587'
    SMTP_DOMAIN: part-int.ldttoolbox.app
    SMTP_AUTHENTICATION: plain
    SMTP_ENABLE_STARTTLS_AUTO: 'true'
    SMTP_USER_NAME: ldt.test.smtp@gmail.com
    # Service URLs
    GRAFANA_URL: https://grafana
    DECIDIM_URL: https://decidim
    MATOMO_URL: https://matomo
    JITSI_WEB_URL: https://jitsi-web
    DECIDIM_PRIMARY_COLOR: '#004494'
    DECIDIM_ORGANIZATION_NAME: 'EU LDT Participate Tool'
    DECIDIM_LOGO_URL: 'https://part-int.ldttoolbox.app/rails/active_storage/blobs/redirect/eyJfcmFpbHMiOnsibWVzc2FnZSI6IkJBaHBVQT09IiwiZXhwIjpudWxsLCJwdXIiOiJibG9iX2lkIn19--b7d0d089d19110c050f1898625f25f369aac73d6/image.png'
