apiVersion: v1
kind: Secret
metadata:
    name: chatbot-backend-db-secret
    namespace: participate
type: Opaque
stringData:
    ## INFRA please move on KV
    POSTGRES_PASSWORD: _%DB-PASSWORD-CHATBOT%_
    POSTGRES_USER: _%DB-USERNAME-CHATBOT%_
    POSTGRES_DB: _%DB-NAME-CHATBOT%_
    ## DATABASE_URL will be constructed as: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)
    ## For now, set it manually or use an init container to construct it
    DATABASE_URL: _%DATABASE-URL-CHATBOT%_
    DB_USERNAME: _%DB-USERNAME-CHATBOT%_
    DB_PASSWORD: _%DB-PASSWORD-CHATBOT%_
