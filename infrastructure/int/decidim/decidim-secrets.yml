apiVersion: v1
kind: Secret
apiVersion: v1
kind: Secret
metadata:
    name: decidim-secrets
type: Opaque
stringData:
    # Database credentials (sensitive)
    DATABASE_PASSWORD: '_%TOOL3_DECIDIM_DATABASE_PASSWORD%_'

    # Full database URL for production environment. Using the same DB user/password
    # and host defined in the ConfigMap (decidim-postgres service).
    DATABASE_URL: '_%TOOL3_DECIDIM_DATABASE_URL%_'

    # Rails secret
    SECRET_KEY_BASE: '_%TOOL3_DECIDIM_SECRET_KEY_BASE%_'

    # Omniauth / Keycloak secret
    OMNIAUTH_KEYCLOAK_CLIENT_SECRET: '_%TOOL3_DECIDIM_OMNIAUTH_KEYCLOAK_CLIENT_SECRET%_'

    # SMTP credentials
    SMTP_USER_NAME: '_%TOOL3_DECIDIM_SMTP_USER_NAME%_'
    SMTP_PASSWORD: '_%TOOL3_DECIDIM_SMTP_PASSWORD%_'
