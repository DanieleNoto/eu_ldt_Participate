# Ingress entries for platform components (Decidim, Grafana, Matomo, Jitsi)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
  - host: part-int.ldttoolbox.app
    http:
      paths:
      # Decidim at root
      - path: /(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: decidim
            port:
              number: 80
      # Jitsi under /jitsi -> forward to jitsi-web
      - path: /jitsi(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: jitsi-web
            port:
              number: 80
      # Grafana under /analytics/grafana -> rewrite to /$2 (grafana root)
      - path: /analytics/grafana(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: grafana
            port:
              number: 3000
      # Matomo under /analytics/matomo -> rewrite to /$2 (matomo root)
      - path: /analytics/matomo(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: matomo
            port:
              number: 8081

---
