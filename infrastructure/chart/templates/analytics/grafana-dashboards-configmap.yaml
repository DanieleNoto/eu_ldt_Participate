        					"rawQuery": true,
        					"rawSql": "WITH weekly_response AS (\n  SELECT \n    DATE_TRUNC('week', n.sent_at) as time,\n    COUNT(DISTINCT CASE WHEN u.last_sign_in_at >= n.sent_at AND u.last_sign_in_at <= n.sent_at + INTERVAL '1 day' THEN u.id END) as \"Day 1 Response\",\n    COUNT(DISTINCT CASE WHEN u.last_sign_in_at >= n.sent_at AND u.last_sign_in_at <= n.sent_at + INTERVAL '3 days' THEN u.id END) as \"Day 3 Response\",\n    COUNT(DISTINCT CASE WHEN u.last_sign_in_at >= n.sent_at AND u.last_sign_in_at <= n.sent_at + INTERVAL '7 days' THEN u.id END) as \"Day 7 Response\"\n  FROM decidim_newsletters n\n  CROSS JOIN decidim_users u\n  WHERE n.sent_at >= NOW() - INTERVAL '$time_range days'\n    AND u.deleted_at IS NULL \n    AND u.type = 'Decidim::User' \n    AND u.confirmed_at IS NOT NULL\n    AND u.newsletter_notifications_at IS NOT NULL\n  GROUP BY DATE_TRUNC('week', n.sent_at)\n)\nSELECT \n  time,\n  'Day 1 Response' as metric,\n  \"Day 1 Response\" as value\nFROM weekly_response\nUNION ALL\nSELECT \n  time,\n  'Day 3 Response' as metric,\n  \"Day 3 Response\" as value\nFROM weekly_response\nUNION ALL\nSELECT \n  time,\n  'Day 7 Response' as metric,\n  \"Day 7 Response\" as value\nFROM weekly_response\nORDER BY time, metric;",
