apiVersion: v1
kind: Service
metadata:
  name: jitsi-web
  labels:
    io.kompose.service: jitsi-web
spec:
  selector:
    app: jitsi-web
  ports:
    - name: "80"
      port: 80
      targetPort: 80
    - name: "443"
      port: 443
      targetPort: 443
  type: ClusterIP