apiVersion: v1
kind: Service
metadata:
  name: jitsi-prosody
  namespace: participate
  labels:
    app: jitsi
    component: prosody
spec:
  ports:
  - name: xmpp
    port: 5222
    protocol: TCP
  - name: component
    port: 5347
    protocol: TCP
  - name: bosh
    port: 5280
    protocol: TCP
  selector:
    app: jitsi
    component: prosody
