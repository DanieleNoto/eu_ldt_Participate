#ASR: Nueva Version Standar BACKEND
#---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: part-backend-pvc
  namespace: participate
  annotations:
    pv.kubernetes.io/provisioned-by: file.csi.azure.com
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: azurefile-csi
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tool3-shared-claim-backend
  namespace: participate
  annotations:
    pv.kubernetes.io/provisioned-by: file.csi.azure.com
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: azurefile-csi
  volumeMode: Filesystem
---
  #ASR Nueva version Standard FRONTEND
  apiVersion: v1
  kind: PersistentVolumeClaim
  metadata:
    name: part-frontend-pvc
    namespace: participate
    annotations:
      pv.kubernetes.io/provisioned-by: file.csi.azure.com
  spec:
    accessModes:
      - ReadWriteMany
    resources:
      requests:
        storage: 5Gi
    storageClassName: azurefile-csi
    volumeMode: Filesystem
---
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: tool3-shared-claim-frontend
      namespace: participate
      annotations:
        pv.kubernetes.io.provisioned-by: file.csi.azure.com
    spec:
      accessModes:
        - ReadWriteMany
      resources:
        requests:
          storage: 5Gi
      storageClassName: azurefile-csi
      volumeMode: Filesystem

