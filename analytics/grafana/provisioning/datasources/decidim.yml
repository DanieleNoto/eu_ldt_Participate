apiVersion: 1

datasources:
    - name: Decidim PostgreSQL
      type: postgres
      access: proxy
      url: ${DATABASE_HOST}:5432
      database: ${DATABASE_NAME}
      user: ${DATABASE_USERNAME}
      secureJsonData:
          password: ${DATABASE_PASSWORD}
      jsonData:
          sslmode: disable
          searchPath: 'decidim_application_development'
          postgresVersion: 1600
          timescaledb: false
          maxOpenConns: 100
          maxIdleConns: 100
          maxIdleConnsAuto: true
          connMaxLifetime: 14400
      isDefault: true
      uid: decidim_postgres
      editable: true
