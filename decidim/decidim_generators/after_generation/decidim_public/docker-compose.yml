services: 
  decidim:
    #image: decidim/decidim-dev:0.29.3
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_HOST=db
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=decidim_application_development
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY_BASE=insecure_key_base
      - DECIDIM_FORCE_SSL=false
      - RAILS_ENV=development
      - NODE_ENV=development
      - DECIDIM_MAILER_SENDER=changeme@example.org
      - QUEUE_ADAPTER=async
    volumes:  
      - .:/code
      - bundle_cache:/usr/local/bundle
      - ./vendor/bundle:/app/vendor/bundle
     
    command: bash -c "bin/rails db:create && bundle exec rails server -b 0.0.0.0"
    networks:
      - private
    depends_on:
      - redis
      - db
  db:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DATABASE=decidim_application_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private
  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    networks:
      - private
  adminer_container:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - 8080:8080
    networks:
      - private

volumes:
  decidim_public:
  redis_data:
  postgres_data:  
  bundle_cache:
networks:
  private:
