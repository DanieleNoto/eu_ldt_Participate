paths:
  /api/v1/chat/:
    post:
      tags:
        - chat
      description: Create a new chat
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                conversationId:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000)$
                nodeId:
                  type: string
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversationId:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000)$
                  answer:
                    type: string
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        text:
                          type: string
                      required:
                        - id
                        - text
                      additionalProperties: false
                  isLeaf:
                    type: boolean
                  options:
                    type: array
                    items:
                      type: object
                      properties:
                        action:
                          type: string
                        label:
                          type: string
                      required:
                        - action
                        - label
                      additionalProperties: false
                required:
                  - conversationId
                  - answer
                  - suggestions
                  - isLeaf
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                  error:
                    type: string
                  details:
                    type: array
                    items: {}
                required:
                  - statusCode
                  - error
                additionalProperties: false
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
