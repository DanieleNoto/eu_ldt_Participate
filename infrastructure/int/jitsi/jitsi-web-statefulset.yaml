apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jitsi-web
  labels:
    io.kompose.service: jitsi-web
spec:
  serviceName: jitsi-web
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: jitsi-web
  template:
    metadata:
      labels:
        io.kompose.service: jitsi-web
        io.kompose.network/temp1-private: "true"
    spec:
      containers:
        - name: jitsi-web
          image: jitsi/web:stable-8960
          ports:
            - containerPort: 80
              protocol: TCP
            - containerPort: 443
              protocol: TCP
          volumeMounts:
            - mountPath: /config
              name: jitsi-web-claim0
  volumeClaimTemplates:
    - metadata:
        name: jitsi-web-claim0
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Mi


