apiVersion: v1
kind: ConfigMap
metadata:
    name: grafana-db-config
data:
    # POSTGRES_DB is required by the official postgres image to create the DB on first init
    POSTGRES_DB: _%GF-DATABASE-NAME%_
    POSTGRES_DATABASE: _%GF-DATABASE-NAME%_
    PGDATA: /var/lib/postgresql/data/pgdata
