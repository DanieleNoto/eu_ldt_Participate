apiVersion: v1
kind: Secret
metadata:
    name: grafana-secrets
type: Opaque
stringData:
    GF_SECURITY_ADMIN_USER: '_%TOOL3_GRAFANA_GF_SECURITY_ADMIN_USER%_'
    GF_SECURITY_ADMIN_PASSWORD: '_%TOOL3_GRAFANA_GF_SECURITY_ADMIN_PASSWORD%_'
    GF_AUTH_GENERIC_OAUTH_CLIENT_ID: '_%TOOL3_GRAFANA_GF_AUTH_GENERIC_OAUTH_CLIENT_ID%_'
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: '_%TOOL3_GRAFANA_GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET%_'
    # Use the same Postgres password used by decidim (for local/dev setup)
    GF_DATABASE_PASSWORD: '_%TOOL3_GRAFANA_GF_DATABASE_PASSWORD%_'
