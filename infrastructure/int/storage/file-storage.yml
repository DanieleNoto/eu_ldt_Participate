kind: PersistentVolume
apiVersion: v1
metadata:
  name: postgres-pv
  labels:
    type: local
    app: tool3
spec:
  storageClassName: "standard"
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: "/opt/postgres"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  labels:
    app: tool3
spec:
  storageClassName: "standard"
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
#---
#kind: StorageClass
#apiVersion: storage.k8s.io/v1
#metadata:
#  name: tool3-shared-storage
#provisioner: file.csi.azure.com # replace with "kubernetes.io/azure-file" if aks version is less than 1.21
#allowVolumeExpansion: true
#mountOptions:
#  - dir_mode=0777
#  - file_mode=0777
