apiVersion: v1
kind: ConfigMap
metadata:
    name: jitsi-config
    namespace: participate
data:
    # General configuration
    DOCKER_HOST_ADDRESS: '_%TOOL3_JITSI_DOCKER_HOST_ADDRESS%_'
    PUBLIC_URL: '_%TOOL3_JITSI_PUBLIC_URL%_'
    TZ: '_%TOOL3_JITSI_TZ%_'

    # XMPP configuration
    XMPP_DOMAIN: '_%TOOL3_JITSI_XMPP_DOMAIN%_'
    XMPP_SERVER: '_%TOOL3_JITSI_XMPP_SERVER%_'
    XMPP_BOSH_URL_BASE: '_%TOOL3_JITSI_XMPP_BOSH_URL_BASE%_'
    XMPP_AUTH_DOMAIN: '_%TOOL3_JITSI_XMPP_AUTH_DOMAIN%_'
    XMPP_MUC_DOMAIN: '_%TOOL3_JITSI_XMPP_MUC_DOMAIN%_'
    XMPP_INTERNAL_MUC_DOMAIN: '_%TOOL3_JITSI_XMPP_INTERNAL_MUC_DOMAIN%_'
    XMPP_GUEST_DOMAIN: '_%TOOL3_JITSI_XMPP_GUEST_DOMAIN%_'
    XMPP_RECORDER_DOMAIN: '_%TOOL3_JITSI_XMPP_RECORDER_DOMAIN%_'
    XMPP_MODULES: '_%TOOL3_JITSI_XMPP_MODULES%_'

    # JVB configuration
    JVB_BREWERY_MUC: '_%TOOL3_JITSI_JVB_BREWERY_MUC%_'
    JVB_AUTH_USER: '_%TOOL3_JITSI_JVB_AUTH_USER%_'
    JVB_PORT: '_%TOOL3_JITSI_JVB_PORT%_'
    JVB_STUN_SERVERS: '_%TOOL3_JITSI_JVB_STUN_SERVERS%_'
    JVB_ENABLE_APIS: '_%TOOL3_JITSI_JVB_ENABLE_APIS%_'

    # Jicofo configuration
    JICOFO_AUTH_USER: '_%TOOL3_JITSI_JICOFO_AUTH_USER%_'

    # Authentication configuration
    ENABLE_AUTH: '_%TOOL3_JITSI_ENABLE_AUTH%_'
    ENABLE_GUESTS: '_%TOOL3_JITSI_ENABLE_GUESTS%_'
    AUTH_TYPE: '_%TOOL3_JITSI_AUTH_TYPE%_'

    # JWT configuration
    JITSI_APP_ID: '_%TOOL3_JITSI_APP_ID%_'
    JITSI_JWT_ALGORITHM: '_%TOOL3_JITSI_JWT_ALGORITHM%_'
