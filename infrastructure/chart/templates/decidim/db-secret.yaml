apiVersion: v1
kind: Secret
metadata:
    name: db-secret
    namespace: {{ include "eu-ldt-participate.namespace" . }}
type: Opaque
stringData:
    POSTGRES_USER: {{ .Values.decidim.db.username | quote }}
    POSTGRES_PASSWORD: {{ .Values.decidim.db.password | quote }}
