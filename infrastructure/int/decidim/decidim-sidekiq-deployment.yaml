apiVersion: apps/v1
kind: Deployment
metadata:
  name: decidim-sidekiq
  labels:
    app: decidim
    component: sidekiq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: decidim
      component: sidekiq
  template:
    metadata:
      labels:
        app: decidim
        component: sidekiq
    spec:
      # Do not automatically mount the service account token into the pod
      automountServiceAccountToken: false
      # Wait for Redis to be reachable before starting Sidekiq to avoid CrashLoopBackOff
      initContainers:
        - name: copy-assets
          image: euldtshared.azurecr.io/eu-ldt-part-int:_%CONTAINER_IMAGE_TOOL_TAG%_
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting 5 minutes for Decidim initContainer to complete asset compilation..."
              sleep 300
              
              echo "Copying assets from main PVC to Sidekiq volume..."
              # Wait for assets to be available in main PVC
              for i in $(seq 1 60); do
                if [ -f "/source-assets/public/decidim-packs/manifest.json" ] && [ "$(cat /source-assets/public/decidim-packs/manifest.json | wc -c)" -gt 2 ]; then
                  echo "Assets are ready, copying to Sidekiq volume..."
                  cp -r /source-assets/public/* /dest-assets/public/ 2>/dev/null || true
                  echo "Assets copied successfully"
                  exit 0
                fi
                echo "Waiting for assets (attempt $i)"; sleep 5
              done
              echo "Timeout waiting for assets"; exit 1
          envFrom:
            - secretRef:
                name: decidim-secret
            - configMapRef:
                name: decidim-configmap
          volumeMounts:
            - name: decidim-main-assets
              mountPath: /source-assets/public
              readOnly: true
            - name: decidim-assets
              mountPath: /dest-assets/public
        - name: wait-for-dependencies
          # use an image that contains redis-cli so we can handle auth/URLs
          image: redis:7-alpine
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for redis..."
              # If REDIS_URL is provided via secret/configmap use it (handles auth),
              # otherwise fall back to REDIS_HOST/REDIS_PORT/REDIS_PASSWORD or defaults.
              if [ -n "${REDIS_URL:-}" ]; then
                for i in $(seq 1 120); do
                  redis-cli -u "$REDIS_URL" ping >/dev/null 2>&1 && echo "redis reachable" && break
                  echo "redis not reachable yet (attempt $i)"; sleep 1
                done
              fi
              
              echo "Redis is ready, starting Sidekiq..."
          # import the same envs the app uses so the initContainer can read REDIS_URL
          envFrom:
            - secretRef:
                name: decidim-secret
            - configMapRef:
                name: decidim-configmap
          volumeMounts:
            - name: decidim-assets
              mountPath: /code/public
              readOnly: true
      containers:
        - name: sidekiq
          image: euldtshared.azurecr.io/eu-ldt-part-int:_%CONTAINER_IMAGE_TOOL_TAG%_
          imagePullPolicy: IfNotPresent
          # Run Sidekiq through a small wrapper that waits for Redis so
          # container restarts also wait (initContainers don't run on restarts).
          command: ["/bin/sh", "-lc"]
          args:
            - |
              set -e
              echo "Starting Sidekiq wrapper: waiting for redis..."
              # Prefer redis-cli if present (handles auth and URLs), otherwise fall back to nc TCP check.
              if command -v redis-cli >/dev/null 2>&1; then
                if [ -n "${REDIS_URL:-}" ]; then
                  until redis-cli -u "$REDIS_URL" ping >/dev/null 2>&1; do
                    echo "redis not reachable yet; sleeping 1s"
                    sleep 1
                  done
                fi
              else
                until nc -z ${REDIS_HOST:-redis} ${REDIS_PORT:-6379}; do
                  echo "redis not reachable yet; sleeping 1s"
                  sleep 1
                done
              fi
              echo "redis reachable; exec sidekiq"
              exec bundle exec sidekiq -e ${RAILS_ENV:-production} -c 5 \
              -q decidim_production_mailers,4 \
              -q decidim_production_default,2 \
              -q decidim_production_newsletters,2 \
              -q decidim_production_events,2 \
              -q decidim_production_translations,2 \
              -q decidim_production_vote_reminder,2 \
              -q decidim_production_reminders,2 \
              -q decidim_production_delete_inactive_participants,2 \
              -q decidim_production_newsletters_opt_in,2 \
              -q decidim_production_conference_diplomas,2 \
              -q decidim_production_user_report,2 \
              -q decidim_production_block_user,2 \
              -q decidim_production_exports,1 \
              -q decidim_production_close_meeting_reminder,1 \
              -q decidim_production_spam_analysis,1 \
              -q active_storage_analysis,1 \
              -q active_storage_purge,1
              
          envFrom:
            - secretRef:
                name: decidim-secret
            - configMapRef:
                name: decidim-configmap
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
              ephemeral-storage: "1Gi"
            limits:
              memory: "1Gi"
              cpu: "500m"
              ephemeral-storage: "2Gi"
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "ps aux | grep '[s]idekiq' || exit 1"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "ps aux | grep '[s]idekiq' || exit 1"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: decidim-assets
              mountPath: /code/public
              readOnly: true
      restartPolicy: Always
      volumes:
       - name: decidim-main-assets
         persistentVolumeClaim:
           claimName: decidim-pvc-decidim-0
       - name: decidim-assets
         emptyDir: {}
