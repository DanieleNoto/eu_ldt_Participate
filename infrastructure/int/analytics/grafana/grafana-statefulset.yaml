apiVersion: apps/v1
kind: StatefulSet
metadata:
    annotations:
        kompose.cmd: /home/adminlnx/.config/Code/User/globalStorage/othy1010.kompose/kompose convert --out=/home/adminlnx/TEMP1 --file=/home/adminlnx/TEMP1/docker-compose.yml
        kompose.version: 1.21.0 (992df58d8)
    labels:
        io.kompose.service: grafana
    name: grafana
spec:
    serviceName: grafana
    replicas: 1
    selector:
        matchLabels:
            io.kompose.service: grafana
    template:
        metadata:
            labels:
                io.kompose.network/temp1-private: 'true'
                io.kompose.service: grafana
        spec:
            securityContext:
                runAsUser: 472 # UID del usuario Grafana
                runAsGroup: 472 # GID del usuario Grafana
                fsGroup: 472 # Grupo para los volumenes montados
            containers:
                - name: grafana
                  image: grafana/grafana:11.0.0
                  ports:
                      - containerPort: 3000
                        hostPort: 3001
                        protocol: TCP
                  # Load environment variables for Grafana from its ConfigMap and secrets
                  envFrom:
                      # Load Grafana-specific settings first
                      - configMapRef:
                            name: grafana-config
                      # Override with global environment settings if present
                      - configMapRef:
                            name: home-adminlnx-temp1-env
                      # Load sensitive values from secrets
                      - secretRef:
                            name: grafana-secrets
                  volumeMounts:
                      - name: grafana-data
                        mountPath: /var/lib/grafana
                      - name: grafana-claim1
                        mountPath: /etc/grafana/provisioning
                      - name: grafana-claim2
                        mountPath: /etc/grafana/provisioning/dashboards
            restartPolicy: Always
            volumes:
                - name: grafana-data
                  persistentVolumeClaim:
                      claimName: grafana-data
                - name: grafana-claim1
                  persistentVolumeClaim:
                      claimName: grafana-claim1
                - name: grafana-claim2
                  persistentVolumeClaim:
                      claimName: grafana-claim2
