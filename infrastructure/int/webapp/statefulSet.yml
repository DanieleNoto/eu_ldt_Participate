apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: part-webapp
spec:
    selector:
        matchLabels:
            app: part-webapp
    serviceName: part-webapp
    replicas: 1
    minReadySeconds: 10
    template:
        metadata:
            labels:
                app: part-webapp
        spec:
            terminationGracePeriodSeconds: 10
            hostname: part-webapp
            imagePullSecrets:
                - name: acr-secret
            containers:
                - name: part-backend
                  image: euldtshared.azurecr.io/eu-ldt-part-int:ldt_tool2_be__%CONTAINER_IMAGE_TOOL_TAG%_
                  imagePullPolicy: Always
                  resources:
                      requests:
                          cpu: '100m'
                          memory: '128Mi'
                      limits:
                          cpu: '250m'
                          memory: '256Mi'
                  ports:
                      - containerPort: 3000
                        name: http-web
                  volumeMounts:
                      - name: part-backend-storage
                        mountPath: /mnt/shared
                        readOnly: false
                  env:
                      - name: DB_HOST
                        valueFrom:
                            configMapKeyRef:
                                name: part-backend-db-config
                                key: DB_HOST
                      - name: DB_PORT
                        valueFrom:
                            configMapKeyRef:
                                name: part-backend-db-config
                                key: DB_PORT
                      - name: DB_NAME
                        valueFrom:
                            configMapKeyRef:
                                name: part-backend-db-config
                                key: DB_NAME
                      - name: DB_SCHEMA
                        valueFrom:
                            configMapKeyRef:
                                name: part-backend-db-config
                                key: DB_SCHEMA
                      - name: DB_USERNAME
                        valueFrom:
                            secretKeyRef:
                                name: part-backend-db-secret
                                key: postgres_user
                      - name: DB_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: part-backend-db-secret
                                key: postgres_password
                      - name: PORT
                        valueFrom:
                            configMapKeyRef:
                                name: part-backend-config
                                key: PORT
                      - name: NODE_ENV
                        valueFrom:
                            configMapKeyRef:
                                name: part-backend-config
                                key: NODE_ENV
                      - name: CONTEXT_URL
                        valueFrom:
                            configMapKeyRef:
                                name: part-backend-config
                                key: CONTEXT_URL
                      - name: SWAGGER_GEN_DOC_FILE
                        valueFrom:
                            configMapKeyRef:
                                name: part-backend-config
                                key: SWAGGER_GEN_DOC_FILE
                      - name: JWT_ENABLE_CHECK
                        valueFrom:
                            configMapKeyRef:
                                name: part-backend-config
                                key: JWT_ENABLE_CHECK
                      - name: DATABASE_SYNC
                        valueFrom:
                            configMapKeyRef:
                                name: part-backend-config
                                key: DATABASE_SYNC
                      - name: SEQUELIZE_SEEDER_STORAGE
                        valueFrom:
                            configMapKeyRef:
                                name: part-backend-config
                                key: SEQUELIZE_SEEDER_STORAGE
                      - name: SEQUELIZE_SEEDER_STORAGE_TABLE_NAME
                        valueFrom:
                            configMapKeyRef:
                                name: part-backend-config
                                key: SEQUELIZE_SEEDER_STORAGE_TABLE_NAME
                      - name: LOGGER_TARGET
                        valueFrom:
                            configMapKeyRef:
                                name: part-backend-config
                                key: LOGGER_TARGET
                      - name: LOGGER_LEVEL
                        valueFrom:
                            configMapKeyRef:
                                name: part-backend-config
                                key: LOGGER_LEVEL
                      - name: EXPORT_ASYNC
                        valueFrom:
                            configMapKeyRef:
                                name: part-backend-config
                                key: EXPORT_ASYNC
                      - name: EXPORT_TEMPLATE_FOLDER_PATH
                        valueFrom:
                            configMapKeyRef:
                                name: part-backend-config
                                key: EXPORT_TEMPLATE_FOLDER_PATH
                      - name: RATE_LIMIT_TIME_WINDOW
                        valueFrom:
                            configMapKeyRef:
                                name: part-backend-config
                                key: RATE_LIMIT_TIME_WINDOW
                      - name: RATE_LIMIT_MAX
                        valueFrom:
                            configMapKeyRef:
                                name: part-backend-config
                                key: RATE_LIMIT_MAX
                      - name: CSRF_ENABLED
                        valueFrom:
                            configMapKeyRef:
                                name: part-backend-config
                                key: CSRF_ENABLED
                      - name: CSRF_SAME_SITE
                        valueFrom:
                            configMapKeyRef:
                                name: part-backend-config
                                key: CSRF_SAME_SITE
                      - name: CSRF_SECURE
                        valueFrom:
                            configMapKeyRef:
                                name: part-backend-config
                                key: CSRF_SECURE
                      - name: CSRF_URL
                        valueFrom:
                            configMapKeyRef:
                                name: part-backend-config
                                key: CSRF_URL
                      - name: CSRF_EXCLUDED_URLS
                        valueFrom:
                            configMapKeyRef:
                                name: part-backend-config
                                key: CSRF_EXCLUDED_URLS

                      - name: MOCK_DATA_PLATFORM
                        valueFrom:
                            configMapKeyRef:
                                name: part-backend-config
                                key: MOCK_DATA_PLATFORM

                      - name: DATA_PLATFORM_BASE_URL
                        valueFrom:
                            configMapKeyRef:
                                name: part-backend-config
                                key: DATA_PLATFORM_BASE_URL

                      - name: DATA_PLATFORM_TIMEOUT
                        valueFrom:
                            configMapKeyRef:
                                name: part-backend-config
                                key: DATA_PLATFORM_TIMEOUT

                      - name: DATA_PLATFORM_BROKER_BASE_URL
                        valueFrom:
                            configMapKeyRef:
                                name: part-backend-config
                                key: DATA_PLATFORM_BROKER_BASE_URL

                      - name: DATA_PLATFORM_BROKER_TIMEOUT
                        valueFrom:
                            configMapKeyRef:
                                name: part-backend-config
                                key: DATA_PLATFORM_BROKER_TIMEOUT

                      - name: MOCK_AI_NOTEBOOK
                        valueFrom:
                            configMapKeyRef:
                                name: part-backend-config
                                key: MOCK_AI_NOTEBOOK

                      - name: AI_NOTEBOOK_BASE_URL
                        valueFrom:
                            configMapKeyRef:
                                name: part-backend-config
                                key: AI_NOTEBOOK_BASE_URL

                      - name: AI_NOTEBOOK_TIMEOUT
                        valueFrom:
                            configMapKeyRef:
                                name: part-backend-config
                                key: AI_NOTEBOOK_TIMEOUT

                      - name: CYPHER_SALT
                        valueFrom:
                            secretKeyRef:
                                name: part-backend-jwt-secret
                                key: CYPHER_SALT
                      - name: CYPHER_SECRET
                        valueFrom:
                            secretKeyRef:
                                name: part-backend-jwt-secret
                                key: CYPHER_SECRET
                      - name: CSRF_SECRET
                        valueFrom:
                            secretKeyRef:
                                name: part-backend-jwt-secret
                                key: CSRF_SECRET
                - name: part-pg
                  image: docker.io/library/postgres:17.3
                  imagePullPolicy: IfNotPresent
                  resources:
                      requests:
                          cpu: '100m'
                          memory: '128Mi'
                      limits:
                          cpu: '250m'
                          memory: '256Mi'
                  ports:
                      - containerPort: 5432
                        name: postgres
                  env:
                      - name: POSTGRES_USER
                        valueFrom:
                            secretKeyRef:
                                name: part-backend-db-secret
                                key: postgres_user
                      - name: POSTGRES_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: part-backend-db-secret
                                key: postgres_password
                      - name: POSTGRES_DB
                        valueFrom:
                            configMapKeyRef:
                                name: part-backend-db-config
                                key: DB_NAME
                      - name: PGDATA
                        value: /pgdata/data
                      - name: POD_IP
                        valueFrom:
                            fieldRef:
                                fieldPath: status.podIP
                  volumeMounts:
                      - name: part-pg-storage
                        mountPath: /pgdata
                - name: part-frontend
                  image: euldtshared.azurecr.io/eu-ldt-part-int:ldt_tool2_fe__%CONTAINER_IMAGE_TOOL_TAG%_
                  imagePullPolicy: Always
                  resources:
                      requests:
                          cpu: '100m'
                          memory: '128Mi'
                      limits:
                          cpu: '250m'
                          memory: '256Mi'
                  ports:
                      - containerPort: 8080
                        name: http
                  volumeMounts:
                      - name: part-frontend-storage
                        mountPath: /mnt/shared
                        readOnly: false
                      - mountPath: /usr/share/nginx/html/config/config.json
                        subPath: config.json
                        name: part-frontend-config-volume
            volumes:
                - name: part-pg-storage
                  persistentVolumeClaim:
                      claimName: part-postgres-pvc
                - name: part-frontend-storage
                  persistentVolumeClaim:
                      claimName: part-frontend-pvc
                - name: part-backend-storage
                  persistentVolumeClaim:
                      claimName: part-backend-pvc
                - name: part-frontend-config-volume
                  configMap:
                      name: part-frontend-config
                      items:
                          - key: config.json
                            path: config.json
