apiVersion: v1
kind: Secret
metadata:
    name: grafana-db-secret
    namespace: {{ include "eu-ldt-participate.namespace" . }}
type: Opaque
stringData:
    POSTGRES_USER: {{ .Values.grafana.db.user }}
    POSTGRES_PASSWORD: {{ .Values.grafana.db.password }}
