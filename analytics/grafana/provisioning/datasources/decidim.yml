apiVersion: 1

datasources:
    - name: Decidim PostgreSQL
      type: postgres
      access: proxy
      url: ${GF_DATABASE_HOST}:5432
      database: ${GF_DATABASE_NAME}
      user: ${GF_DATABASE_USER}
      secureJsonData:
          password: ${GF_DATABASE_PASSWORD}
      jsonData:
          sslmode: disable
          searchPath: ${GF_DATABASE_NAME}
          postgresVersion: 1600
          timescaledb: false
          maxOpenConns: 100
          maxIdleConns: 100
          maxIdleConnsAuto: true
          connMaxLifetime: 14400
      isDefault: true
      uid: decidim_postgres
      editable: true
