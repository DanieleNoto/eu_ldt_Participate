name: Lot5RepoSync-Tool1

trigger:
  branches:
    include:
      - main
  tags:
    include:
      - '*'  # Cualquier tag dispara el pipeline

variables:
- group: 'TOOL3 - PT - KV'

jobs:
- job: MirrorRepoToLot5
  displayName: MirrorRepoToLot5
  steps:
    - checkout: none  # No se necesita clonar el repositorio actual

    - task: Bash@3
      displayName: 'Mirror completo del repositorio origen al destino (con limpieza de refs especiales)'
      inputs:
        targetType: inline
        script: |
          set -e
          git config --global http.sslVerify false

          echo "Clonando todo el repositorio origen con --mirror..."
          git clone --mirror https://$(PAT-LOT5-REPO-SYNC)@vdev.azure.com/EULDT-Toolbox/EU%20LDT%20Participate/_git/EU%20LDT%20Participate source-repo

          cd source-repo

          echo "Eliminando refs de pull request (refs/pull/*)..."
          for ref in $(git for-each-ref --format='%(refname)' refs/pull/ 2>/dev/null); do
            echo "  Eliminando $ref"
            git update-ref -d "$ref"
          done

          echo "Configurando remote destino..."
          #git remote set-url origin https://$(PAT-LOT5-REPO-SYNC-CLONACION)@dev.azure.com/EULDT-Toolbox/EU%20LDT%20Toolbox/_git/EU%20LDT%20Participate
          git remote set-url origin https://$(PAT-LOT5-REPO-SYNC)@dev.azure.com/EULDT-Toolbox/EU%20LDT%20Toolbox/_git/EU%20LDT%20Participate

          echo "Empujando todos los refs al destino con --mirror..."
          git push --mirror

          echo "Repositorios sincronizados exitosamente."