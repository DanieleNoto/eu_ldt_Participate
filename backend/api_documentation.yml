  /api/v1/products:
    get:
      tags:
        - products
      description: Retrieve a products
      parameters:
        - schema:
            default: 0
            anyOf:
              - type: number
              - nullable: true
                enum:
                  - null
          in: query
          name: page
          required: false
          description: "<b>Page number</b>: The <i>current</i> page number. Defaults to `0`"
        - schema:
            default: 10
            anyOf:
              - type: number
              - nullable: true
                enum:
                  - null
          in: query
          name: size
          required: false
          description: <b>Page size</b>. Defaults to `10`
        - schema:
            anyOf:
              - anyOf:
                  - default: []
                    anyOf:
                      - type: array
                        items:
                          type: string
                      - nullable: true
                        enum:
                          - null
                  - type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        query:
                          default: []
                          anyOf:
                            - type: array
                              items:
                                type: string
                            - nullable: true
                              enum:
                                - null
                        not:
                          default: false
                          anyOf:
                            - type: boolean
                            - nullable: true
                              enum:
                                - null
                      required:
                        - field
              - nullable: true
                enum:
                  - null
          in: query
          name: search
          required: true
          description: '<b>Search options:</b><ul>  <li>Example: <code>name::Tomas</code>,
            or [{ field: "name", query: ["Tomas"] }]</li>  <li>or
            <code>!name::Tomas</code>, or [{ field: "name", query: ["Tomas"],
            not: true }]</li></ul>'
        - schema:
            anyOf:
              - anyOf:
                  - default: []
                    anyOf:
                      - type: array
                        items:
                          type: string
                      - nullable: true
                        enum:
                          - null
                  - type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        direction:
                          type: string
                          enum:
                            - ASC
                            - DESC
                      required:
                        - field
                        - direction
              - nullable: true
                enum:
                  - null
          in: query
          name: sort
          required: true
          description: '<b>Sorting options:</b><ul>  <li>Example: <code>name::ASC</code>,
            <code>age::DESC</code>, or [{ field: "id", direction: "ASC"
            }]</li></ul>'
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000)$
                        name:
                          type: string
                      required:
                        - id
                        - name
                      additionalProperties: false
                  metadata:
                    type: object
                    properties:
                      total:
                        type: number
                      page:
                        type: number
                      size:
                        type: number
                      sort:
                        type: array
                        items:
                          type: object
                          properties:
                            field:
                              type: string
                            direction:
                              type: string
                              enum:
                                - DESC
                                - ASC
                          required:
                            - field
                            - direction
                          additionalProperties: false
                    required:
                      - total
                      - page
                      - size
                      - sort
                    additionalProperties: false
                required:
                  - content
                  - metadata
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                  error:
                    type: string
                  details:
                    type: array
                    items: {}
                required:
                  - statusCode
                  - error
                additionalProperties: false
        "404":
          description: Default Response
          content:
