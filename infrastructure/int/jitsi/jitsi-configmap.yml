apiVersion: v1
kind: ConfigMap
metadata:
    labels:
        io.kompose.service: jitsi-config
    name: jitsi-config
data:
    CONFIG: ./jitsi-meet-cfg
    DATABASE_HOST: db
    DATABASE_NAME: decidim_application_development
    DATABASE_USERNAME: postgres
    POSTGRES_USER: admin
    POSTGRES_PASSWORD: supersecret
    ENABLE_AUTH: '1'
    ENABLE_GUESTS: '1'
    JICOFO_AUTH_USER: focus
    JITSI_HTTP_PORT: '8000'
    JITSI_HTTPS_PORT: '8443'
    JITSI_UDP_PORT: '10000'
    JVB_AUTH_USER: jvb
    JVB_BREWERY_MUC: jvbbrewery
    JVB_ENABLE_APIS: rest,colibri
    JVB_PORT: '10000'
    JVB_STUN_SERVERS: stun.l.google.com:19302,stun1.l.google.com:19302
    PUBLIC_URL: https://part-int.ldttoolbox.app/jitsi
    RESTART_POLICY: unless-stopped
    TZ: Europe/Rome
    XMPP_AUTH_DOMAIN: auth.meet.jitsi
    XMPP_BOSH_URL_BASE: http://jitsi-prosody:5280/http-bind
    XMPP_DOMAIN: meet.jitsi
    XMPP_GUEST_DOMAIN: guest.meet.jitsi
    XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
    XMPP_MODULES: ''
    XMPP_MUC_DOMAIN: muc.meet.jitsi
    XMPP_RECORDER_DOMAIN: recorder.meet.jitsi
    XMPP_SERVER: jitsi-prosody
    ENABLE_XMPP_WEBSOCKET: '1'
    SUBDIR: jitsi
    # File di configurazione personalizzato per Jitsi
    
    meet.conf: |
      server_name _;
      
       location ~ ^/jitsi/(.*)$ {
            rewrite ^/jitsi/(.*)$ /$1 break;
            proxy_pass http://localhost:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    config.js: |
        /* Jitsi Meet configuration for subpath /jitsi */
        var config = {
            hosts: {
                domain: 'part-int.ldttoolbox.app',
                muc: 'muc.part-int.ldttoolbox.app'
            },
            bosh: '/jitsi/http-bind',
            websocket: 'wss://part-int.ldttoolbox.app/jitsi/xmpp-websocket',
            publicURL: 'https://part-int.ldttoolbox.app/jitsi',
            externalConnectUrl: 'https://part-int.ldttoolbox.app/jitsi/http-pre-bind',
            enableWelcomePage: true,
            enableClosePage: false,
            deploymentInfo: {
                environment: 'k8s',
                envType: 'production'
            }
        };