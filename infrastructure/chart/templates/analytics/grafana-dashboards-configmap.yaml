        					"editorMode": "code",
        					"format": "table",
        					"rawQuery": true,
        					"rawSql": "WITH proposal_metrics AS (\n  SELECT \n    p.id,\n    COALESCE(p.title->>'en', p.title->>'it', p.title->>'fr', p.title->>'de', p.title->>'es', p.title::text) as title,\n    p.created_at,\n    u.name as author_name,\n    u.nickname as author_nickname,\n    COALESCE(c.comments_count, 0) as comments_count,\n    COALESCE(e.endorsements_count, 0) as endorsements_count,\n    s.title->>'en' as state,\n    pp.slug as process_slug\n  FROM decidim_proposals_proposals p\n  LEFT JOIN decidim_coauthorships ca ON ca.coauthorable_id = p.id AND ca.coauthorable_type = 'Decidim::Proposals::Proposal' AND ca.decidim_author_type IN ('Decidim::User', 'Decidim::UserBaseEntity')\n  LEFT JOIN decidim_users u ON ca.decidim_author_id = u.id\n  LEFT JOIN (\n    SELECT decidim_commentable_id, COUNT(*) as comments_count\n    FROM decidim_comments_comments \n    WHERE deleted_at IS NULL AND decidim_commentable_type = 'Decidim::Proposals::Proposal'\n    GROUP BY decidim_commentable_id\n  ) c ON p.id = c.decidim_commentable_id\n  LEFT JOIN (\n    SELECT resource_id, COUNT(*) as endorsements_count\n    FROM decidim_likes \n    WHERE resource_type = 'Decidim::Proposals::Proposal'\n    GROUP BY resource_id\n  ) e ON p.id = e.resource_id\n  LEFT JOIN decidim_proposals_proposal_states s ON p.decidim_proposals_proposal_state_id = s.id\n  LEFT JOIN decidim_components comp ON p.decidim_component_id = comp.id\n  LEFT JOIN decidim_participatory_processes pp ON comp.participatory_space_id = pp.id AND comp.participatory_space_type = 'Decidim::ParticipatoryProcess'\n  WHERE p.deleted_at IS NULL AND p.created_at >= NOW() - INTERVAL '$time_range days'\n)\nSELECT \n  title,\n  author_name,\n  author_nickname,\n  comments_count,\n  endorsements_count,\n  state,\n  process_slug,\n  created_at\nFROM proposal_metrics\nORDER BY (comments_count + endorsements_count) DESC\nLIMIT 20;",
        					"refId": "A"
        				}
        			],
        			"title": "Top Performing Proposals",
        			"type": "table"
        		}
