apiVersion: v1
kind: ConfigMap
metadata:
    name: grafana-provisioning-dashboards
    namespace: {{ include "eu-ldt-participate.namespace" . }}
data:
    # Dashboard provisioning configuration
    decidim.yml: |
        apiVersion: 1
        providers:
            - name: 'Decidim Dashboards'
              orgId: 1
              folder: 'Decidim'
              type: file
              disableDeletion: false
              updateIntervalSeconds: 10
              allowUiUpdates: true
              options:
                  path: /var/lib/grafana/dashboards
