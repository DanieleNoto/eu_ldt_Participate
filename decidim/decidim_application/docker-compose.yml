services:
    decidim:
        #image: decidim/decidim-dev:0.29.3
        build: .
        ports:
            - '3000:3000'
        env_file:
            - .env
        environment:
            - DATABASE_HOST=${DATABASE_HOST}
            - DATABASE_USERNAME=${DATABASE_USERNAME}
            - DATABASE_PASSWORD=${DATABASE_PASSWORD}
            - DATABASE_NAME=${DATABASE_NAME}
            - REDIS_URL=${REDIS_URL}
            - SECRET_KEY_BASE=${SECRET_KEY_BASE}
            - DECIDIM_FORCE_SSL=${DECIDIM_FORCE_SSL}
            - RAILS_ENV=${RAILS_ENV}
            - NODE_ENV=${NODE_ENV}
            - DECIDIM_MAILER_SENDER=${DECIDIM_MAILER_SENDER}
            - QUEUE_ADAPTER=${QUEUE_ADAPTER}
            - SHAKAPACKER_DEV_SERVER_HOST=shakapacker
            - SHAKAPACKER_DEV_SERVER_PORT=3035
            - SHAKAPACKER_DEV_SERVER_ENABLED=true
        volumes:
            - .:/code
            - bundle_cache:/usr/local/bundle
            - vendor_bundle:/app/vendor/bundle
            - node_modules:/code/node_modules
        command: bash /code/docker-entrypoint.sh
        networks:
            - private
        depends_on:
            - redis
            - db
        healthcheck:
            test: ['CMD', 'test', '-d', 'node_modules']
            interval: 5s
            timeout: 3s
            retries: 20
    db:
        image: postgres:16
        env_file:
            - .env
        environment:
            - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
            - POSTGRES_USER=${DATABASE_USERNAME}
            - POSTGRES_DATABASE=${DATABASE_NAME}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - private
        ports:
            - '5432:5432'
    redis:
        image: redis:7
        volumes:
            - redis_data:/data
        networks:
            - private
    shakapacker:
        build: .
        command: bundle exec bin/shakapacker-dev-server
        volumes:
            - .:/code
            - bundle_cache:/usr/local/bundle
            - vendor_bundle:/app/vendor/bundle
            - node_modules:/code/node_modules
        depends_on:
            db:
                condition: service_started
            redis:
                condition: service_started
            decidim:
                condition: service_healthy
        networks:
            - private
        ports:
            - '3035:3035'
        env_file:
            - .env
        environment:
            - RAILS_ENV=${RAILS_ENV}
            - NODE_ENV=${NODE_ENV}
            - SHAKAPACKER_DEV_SERVER_HOST=${SHAKAPACKER_DEV_SERVER_HOST}

    grafana:
        image: grafana/grafana:11.0.0
        ports:
            - '3001:3000'
        env_file:
            - .env
        environment:
            - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
            - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
            - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
            - GF_SECURITY_ALLOW_EMBEDDING=true
            - DATABASE_HOST=${DATABASE_HOST}
            - DATABASE_NAME=${DATABASE_NAME}
            - DATABASE_USERNAME=${DATABASE_USERNAME}
            - DATABASE_PASSWORD=${DATABASE_PASSWORD}
        volumes:
            - grafana_data:/var/lib/grafana
            - ../../analytics/grafana/provisioning:/etc/grafana/provisioning
            - ../../analytics/grafana/dashboards:/etc/grafana/provisioning/dashboards
        networks:
            - private
        depends_on:
            - db

    matomo:
        image: matomo:5
        ports:
            - '8081:80'
        env_file:
            - .env
        environment:
            - MATOMO_DATABASE_HOST=${MATOMO_DATABASE_HOST}
            - MATOMO_DATABASE_ADAPTER=${MATOMO_DATABASE_ADAPTER}
            - MATOMO_DATABASE_TABLES_PREFIX=${MATOMO_DATABASE_TABLES_PREFIX}
            - MATOMO_DATABASE_USERNAME=${MATOMO_DATABASE_USERNAME}
            - MATOMO_DATABASE_PASSWORD=${MATOMO_DATABASE_PASSWORD}
            - MATOMO_DATABASE_DBNAME=${MATOMO_DATABASE_DBNAME}
        volumes:
            - matomo_data:/var/www/html
        depends_on:
            - matomo-db
        networks:
            - private

    matomo-db:
        image: mariadb:11
        env_file:
            - .env
        environment:
            - MYSQL_ROOT_PASSWORD=${MATOMO_DATABASE_PASSWORD}
            - MYSQL_DATABASE=${MATOMO_DATABASE_DBNAME}
            - MYSQL_USER=${MATOMO_DATABASE_USERNAME}
            - MYSQL_PASSWORD=${MATOMO_DATABASE_PASSWORD}
        volumes:
            - matomo_db_data:/var/lib/mysql
        networks:
            - private

volumes:
    decidim_public:
    redis_data:
    postgres_data:
    bundle_cache:
    vendor_bundle:
    node_modules:
    grafana_data:
    matomo_data:
    matomo_db_data:
networks:
    private:
