apiVersion: v1
kind: Service
metadata:
  name: tool3-pg
spec:
  type: NodePort
  selector:
    app: tool3
  ports:
    - name: "pgsql"
      protocol: TCP
      port: 5432
      targetPort: 5432
      nodePort: 30002
---
apiVersion: v1
kind: Service
metadata:
  name: tool3-back
spec:
  type: ClusterIP
  ports:
  - targetPort: 3000
    port: 3000 
  selector:
    app: tool3
---
apiVersion: v1
kind: Service
metadata:
  name: tool3-front
spec:
  type: ClusterIP
  ports:
  - targetPort: 8080
    port: 8080   
  selector:
    app: tool3