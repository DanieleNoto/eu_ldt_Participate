name: Tool3-Testing-DEV-$(date:yyyyMMdd)$(rev:.r)
pool:
    vmImage: 'ubuntu-latest'

trigger:
    - main

variables:
    - group: 'TOOL3 - PT'
    - group: 'TOOL3 - PT - KV'
    - group: 'TOOL3 - PT - PERFORMANCE TESTS'
    - name: isMain
      value: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]

jobs:
    - job: PlaywrightAxeFrontend
      displayName: 'Install and Run Playwright / Axe (Frontend) & Publish Results'
      steps:
          - task: replacetokens@5
            displayName: 'Replace tokens Playwright'
            inputs:
                rootDirectory: tests/acceptance/e2e
                targetFiles: .env.ci
                tokenPattern: custom
                tokenPrefix: _%
                tokenSuffix: '%_'
                writeBOM: false
                verbosity: detailed
                actionOnNoFiles: warn
          - task: NodeTool@0
            inputs:
                versionSource: 'fromFile'
                versionFilePath: '.nvmrc'
          - task: Cache@2
            inputs:
                key: 'npm-pw | "$(Agent.OS)" | tests/acceptance/e2e/package-lock.json'
                restoreKeys: |
                    npm-pw | "$(Agent.OS)"
                path: tests/acceptance/e2e/node_modules
            displayName: 'Cache npm modules (Playwright)'
          - script: |
                cd tests/acceptance/e2e
                npm ci
                npx playwright install --with-deps
                npm install @axe-core/playwright axe-sarif-converter
            displayName: 'Install Playwright / Axe (Frontend)'
          - script: |
                cd tests/acceptance/e2e
                rm -rf a11y-reports
                echo "Old accessibility reports removed"
            displayName: 'Clean previous accessibility reports'
          - script: |
                cd tests/acceptance/e2e
                npm run test:ci
            env:
                CI: 'true'
            continueOnError: true
            displayName: 'Run Playwright / Axe (Frontend) - All tests except Keycloak'
          - script: |
                cd tests/acceptance/e2e
                npm run test:keycloak
            env:
                CI: 'true'
            continueOnError: true
            displayName: 'Run Playwright / Axe (Frontend) - Keycloak tests only'

          # Publish JUnit results (pass/fail)
          - task: PublishTestResults@2
            displayName: 'Publish Playwright / Axe Test Results (Frontend)'
            inputs:
                testResultsFormat: 'JUnit'
                testResultsFiles: '**/*junit.xml'
                testRunTitle: 'Playwright + Axe'

          # Publish WCAG reports (JSON artifacts)
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Accessibility Reports (WCAG Compliance)'
            inputs:
                PathtoPublish: 'tests/acceptance/e2e/a11y-reports'
                ArtifactName: 'WCAG-AccessibilityReports'
                publishLocation: 'Container'
            condition: succeededOrFailed()

          # Convert JSON to SARIF format
          - script: |
                cd tests/acceptance/e2e/a11y-reports
                for file in *__latest.json; do
                  if [ -f "$file" ]; then
                    npx axe-sarif-converter "$file" "${file%.json}.sarif"
                  fi
                done
                echo "JSON files converted to SARIF format"
            displayName: 'Convert Accessibility Reports to SARIF format'
            condition: succeededOrFailed()
            continueOnError: true

          # Publish SARIF for integrated visualization in Azure DevOps Scans tab
          - task: PublishSARIF@1
            displayName: 'Publish SARIF Accessibility Reports to Scans'
            inputs:
                SarifFiles: 'tests/acceptance/e2e/a11y-reports/*.sarif'
            condition: succeededOrFailed()
            continueOnError: true

    - job: PerformanceTests
      displayName: Service Load Test
      steps:
          - task: replacetokens@5
            displayName: 'Replace tokens Locust config'
            inputs:
                rootDirectory: tests/performance/
                targetFiles: locust_config.json
                tokenPattern: custom
                tokenPrefix: _%
                tokenSuffix: '%_'
                writeBOM: false
                verbosity: detailed
                actionOnNoFiles: warn
          - task: UsePythonVersion@0
            inputs:
                versionSpec: '3.12'
                addToPath: true
                architecture: 'x64'
            displayName: 'Install Python'

          - script: |
                pip install -r ./tests/requirements-dev.txt
                pip install locust==2.33.0
            displayName: 'Install locust dependencies'

          - script: |
                mkdir -p tests/performance/results
            displayName: 'Create results directory'

          - script: |
                cd tests/performance
                locust --config locust.conf
            displayName: 'Run load test'

          - task: PublishPipelineArtifact@1
            inputs:
                targetPath: 'tests/performance/results/locust_results_file.html'
                artifactName: 'LocustResults'
            condition: succeededOrFailed()
            displayName: 'Save results'
