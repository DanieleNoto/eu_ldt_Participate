apiVersion: v1
kind: ConfigMap
metadata:
    name: grafana-configmap
data:
    # Use Postgres as Grafana storage backend
    GF_DATABASE_TYPE: _%GF-DATABASE-TYPE%_
    GF_DATABASE_HOST: _%GF-DATABASE-HOST%_
    GF_DATABASE_NAME: _%GF-DATABASE-NAME%_
    GF_DATABASE_USER: _%GF-DATABASE-USER%_
    # Password moved to Secret (grafana-secrets)
    GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    GF_SECURITY_ALLOW_EMBEDDING: 'true'
    GF_SECURITY_ADMIN_USER: _%GF-SECURITY-ADMIN-USER%_
    GF_SERVER_ROOT_URL: _%GF-SERVER-ROOT-URL%_
    GF_SERVER_DOMAIN: _%GF-SERVER-DOMAIN%_
    GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: _%GF-AUTH-GENERIC-OAUTH-ALLOW-SIGN-UP%_
    GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: _%GF-AUTH-GENERIC-OAUTH-ALLOW-ASSIGN-GRAFANA-ADMIN%_
    GF_AUTH_GENERIC_OAUTH_API_URL: _%GF-AUTH-GENERIC-OAUTH-API-URL%_
    GF_AUTH_GENERIC_OAUTH_AUTH_URL: _%GF-AUTH-GENERIC-OAUTH-AUTH-URL%_
    # Do not automatically redirect to the OAuth provider so the local
    # Grafana login form remains available to users.
    GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: 'false'
    # Ensure the standard Grafana login form is enabled so users can
    # authenticate with local Grafana accounts in addition to Keycloak.
    GF_AUTH_DISABLE_LOGIN_FORM: 'false'
    # Ensure basic (username/password) auth is enabled (default is true,
    # but set explicitly to make intent clear).
    GF_AUTH_BASIC_ENABLED: 'true'
    GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: _%GF-AUTH-GENERIC-OAUTH-EMAIL-ATTRIBUTE-PATH%_
    GF_AUTH_GENERIC_OAUTH_ENABLED: 'true'
    GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH: _%GF-AUTH-GENERIC-OAUTH-GROUPS-ATTRIBUTE-PATH%_
    GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: _%GF-AUTH-GENERIC-OAUTH-LOGIN-ATTRIBUTE-PATH%_
    GF_AUTH_GENERIC_OAUTH_NAME: _%GF-AUTH-GENERIC-OAUTH-NAME%_
    GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: _%GF-AUTH-GENERIC-OAUTH-NAME-ATTRIBUTE-PATH%_
    GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: _%GF-AUTH-GENERIC-OAUTH-ROLE-ATTRIBUTE-PATH%_
    GF_AUTH_GENERIC_OAUTH_SCOPES: _%GF-AUTH-GENERIC-OAUTH-SCOPES%_
    GF_AUTH_GENERIC_OAUTH_SIGNOUT_REDIRECT_URL: _%GF-AUTH-GENERIC-OAUTH-SIGNOUT-REDIRECT-URL%_
    GF_AUTH_GENERIC_OAUTH_TOKEN_URL: _%GF-AUTH-GENERIC-OAUTH-TOKEN-URL%_
    GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN: 'true'
    GF_SERVER_SERVE_FROM_SUB_PATH: _%GF-SERVER-SERVE-FROM-SUB-PATH%_
    GF_USERS_DEFAULT_THEME: 'light'
    GF_SECURITY_COOKIE_SAMESITE: 'none'
    GF_SECURITY_COOKIE_SECURE: 'true'
    GF_SECURITY_X_FRAME_OPTIONS: 'SAMEORIGIN'
    GF_PANELS_DISABLE_SANITIZE_HTML: 'true'
    GF_AUTH_DISABLE_SIGNOUT_MENU: 'true'
    # User and Organization Management
    GF_USERS_AUTO_ASSIGN_ORG: 'true'
    GF_USERS_AUTO_ASSIGN_ORG_ID: '1'
    GF_USERS_AUTO_ASSIGN_ORG_ROLE: 'Editor'
    GF_USERS_ALLOW_ORG_CREATE: 'false'
