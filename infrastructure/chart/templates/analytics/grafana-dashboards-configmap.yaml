        			"targets": [
        				{
        					"datasource": {
        						"type": "postgres",
        						"uid": "decidim_postgres"
        					},
        					"editorMode": "code",
        					"format": "table",
        					"rawQuery": true,
        					"rawSql": "WITH engagement_levels AS (\n  SELECT \n    u.id,\n    COALESCE(p.proposal_count, 0) + COALESCE(c.comment_count, 0) + COALESCE(e.endorsement_count, 0) as total_activity\n  FROM decidim_users u\n  LEFT JOIN (\n    SELECT ca.decidim_author_id, COUNT(*) as proposal_count\n    FROM decidim_coauthorships ca\n    JOIN decidim_proposals_proposals p ON ca.coauthorable_id = p.id AND ca.coauthorable_type = 'Decidim::Proposals::Proposal'\n    WHERE p.deleted_at IS NULL AND ca.decidim_author_type IN ('Decidim::User', 'Decidim::UserBaseEntity') AND p.created_at >= NOW() - INTERVAL '$time_range days'\n    GROUP BY ca.decidim_author_id\n  ) p ON u.id = p.decidim_author_id\n  LEFT JOIN (\n    SELECT decidim_author_id, COUNT(*) as comment_count\n    FROM decidim_comments_comments \n    WHERE deleted_at IS NULL AND created_at >= NOW() - INTERVAL '$time_range days'\n    GROUP BY decidim_author_id\n  ) c ON u.id = c.decidim_author_id\n  LEFT JOIN (\n    SELECT decidim_author_id, COUNT(*) as endorsement_count\n    FROM decidim_likes \n    WHERE created_at >= NOW() - INTERVAL '$time_range days'\n    GROUP BY decidim_author_id\n  ) e ON u.id = e.decidim_author_id\n  WHERE u.deleted_at IS NULL AND u.type = 'Decidim::User' AND u.confirmed_at IS NOT NULL\n)\nSELECT \n  CASE \n    WHEN total_activity >= 10 THEN 'High Engagement (10+)'\n    WHEN total_activity >= 3 THEN 'Medium Engagement (3-9)'\n    WHEN total_activity >= 1 THEN 'Low Engagement (1-2)'\n    ELSE 'No Activity'\n  END as engagement_level,\n  COUNT(*) as value\nFROM engagement_levels\nGROUP BY \n  CASE \n    WHEN total_activity >= 10 THEN 'High Engagement (10+)'\n    WHEN total_activity >= 3 THEN 'Medium Engagement (3-9)'\n    WHEN total_activity >= 1 THEN 'Low Engagement (1-2)'\n    ELSE 'No Activity'\n  END;",
        					"refId": "A"
        				}
