apiVersion: v1
kind: Secret
metadata:
    name: chatbot-backend-secret
    namespace: {{ include "eu-ldt-participate.namespace" . }}
type: Opaque
stringData:
    ## INFRA please move on KV
    CYPHER_SECRET: {{ .Values.chatbot.backend.cypherSecret | quote }}
    CYPHER_SALT: {{ .Values.chatbot.backend.cypherSalt | quote }}
    SMTP_PASSWORD: {{ .Values.smtp.password | quote }}
    DB_USERNAME: {{ .Values.chatbot.db.username | quote }}
    DB_PASSWORD: {{ .Values.chatbot.db.password | quote }}
    DATABASE_URL: {{ .Values.chatbot.db.url | quote }}
