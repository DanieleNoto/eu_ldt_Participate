name: Tool3-SBOM-$(date:yyyyMMdd)$(rev:.r)

trigger: none
pr: none

pool:
    name: 'EU-LDT-DEVOPS-AGENT-01'

jobs:
    - job: sBomGeneration
      displayName: 'SBOM File(s) generation'
      steps:
          - task: UseNode@1
            inputs:
                version: '20.x'
            displayName: 'Install Node.js'

          - script: |
                node -v
                npm -v
                npm cache clean --force
                npm install -g @cyclonedx/cdxgen@latest

                export CDXGEN_NO_CACHE=true
                export NO_PROXY="*"

                FETCH_LICENSE=true cdxgen -r -o SBOM_Tool_4_EU_LDT_City_Innovation_Planner.json
            displayName: 'Generate SBOM'

          - task: PublishPipelineArtifact@1
            displayName: Publish SBOM
            inputs:
                targetPath: $(System.DefaultWorkingDirectory)/SBOM_Tool_4_EU_LDT_City_Innovation_Planner.json
                artifactName: sbom
