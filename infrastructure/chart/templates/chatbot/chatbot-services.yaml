apiVersion: v1
kind: Service
metadata:
    name: chatbot-backend-svc
    namespace: {{ include "eu-ldt-participate.namespace" . }}
spec:
    type: ClusterIP
    selector:
        app: chatbot-webapp
    ports:
        - port: 3002
          targetPort: 3002
          protocol: TCP
