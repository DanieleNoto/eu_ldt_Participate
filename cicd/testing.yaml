name: Tool3-Testing-DEV-$(date:yyyyMMdd)$(rev:.r)
pool:
    vmImage: 'ubuntu-latest'

trigger:
    - main

variables:
    - group: 'TOOL3 - PT'
    - group: 'TOOL3 - PT - KV'
    - group: 'TOOL3 - PT - PERFORMANCE TESTS'
    - name: isMain
      value: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]

jobs:
    # Job 1: Parallel Tests (10 workers)
    - job: PlaywrightParallelTests
      timeoutInMinutes: 120
      displayName: 'Playwright Parallel Tests (10 workers)'
      steps:
          - task: replacetokens@5
            displayName: 'Replace tokens Playwright'
            inputs:
                rootDirectory: tests/acceptance/e2e
                targetFiles: .env.ci
                tokenPattern: custom
                tokenPrefix: _%
                tokenSuffix: '%_'
                writeBOM: false
                verbosity: detailed
                actionOnNoFiles: warn
          - task: NodeTool@0
            inputs:
                versionSource: 'fromFile'
                versionFilePath: '.nvmrc'
          - script: |
                cd tests/acceptance/e2e
                rm -rf node_modules
                npm ci
                npx playwright install --with-deps
            displayName: 'Install Playwright Dependencies'

          - script: |
                cd tests/acceptance/e2e
                npm run test:parallel:setup
            env:
                CI: 'true'
            displayName: 'Setup Parallel Authentication (10 workers)'
          - script: |
                cd tests/acceptance/e2e
                PLAYWRIGHT_HTML_REPORT=playwright-report-parallel PLAYWRIGHT_JUNIT_OUTPUT_NAME=results-parallel-junit.xml npm run test:parallel
            env:
                CI: 'true'
            continueOnError: true
            displayName: 'Run Parallel Tests (10 workers)'
          - task: PublishTestResults@2
            displayName: 'Publish Parallel Test Results'
            inputs:
                testResultsFormat: 'JUnit'
                testResultsFiles: '**/results-parallel-junit.xml'
                testRunTitle: 'Playwright Parallel Tests'
            condition: succeededOrFailed()
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Parallel HTML Report'
            inputs:
                PathtoPublish: 'tests/acceptance/e2e/playwright-report-parallel'
                ArtifactName: 'Playwright-Parallel-Report'
                publishLocation: 'Container'
            condition: succeededOrFailed()
            continueOnError: true
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Parallel Accessibility Reports'
            inputs:
                PathtoPublish: 'tests/acceptance/e2e/a11y-reports'
                ArtifactName: 'Parallel-WCAG-Reports'
                publishLocation: 'Container'
            condition: succeededOrFailed()
            continueOnError: true

    # Job 2: Reserved Tests (1 worker)
    - job: PlaywrightReservedTests
      timeoutInMinutes: 120
      displayName: 'Playwright Reserved Tests (@reserved)'
      steps:
          - task: replacetokens@5
            displayName: 'Replace tokens Playwright'
            inputs:
                rootDirectory: tests/acceptance/e2e
                targetFiles: .env.ci
                tokenPattern: custom
                tokenPrefix: _%
                tokenSuffix: '%_'
                writeBOM: false
                verbosity: detailed
                actionOnNoFiles: warn
          - task: NodeTool@0
            inputs:
                versionSource: 'fromFile'
                versionFilePath: '.nvmrc'
          - script: |
                cd tests/acceptance/e2e
                rm -rf node_modules
                npm ci
                npx playwright install --with-deps
            displayName: 'Install Playwright Dependencies'
          - script: |
                cd tests/acceptance/e2e
                npm run test:reserved:setup
            env:
                CI: 'true'
            displayName: 'Setup Reserved Authentication (reserved users only)'
          - script: |
                cd tests/acceptance/e2e
                PLAYWRIGHT_HTML_REPORT=playwright-report-reserved PLAYWRIGHT_JUNIT_OUTPUT_NAME=results-reserved-junit.xml npm run test:reserved
            env:
                CI: 'true'
            continueOnError: true
            displayName: 'Run Reserved Tests (1 worker)'
          - task: PublishTestResults@2
            displayName: 'Publish Reserved Test Results'
            inputs:
                testResultsFormat: 'JUnit'
                testResultsFiles: '**/results-reserved-junit.xml'
                testRunTitle: 'Playwright Reserved Tests'
            condition: succeededOrFailed()
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Reserved HTML Report'
            inputs:
                PathtoPublish: 'tests/acceptance/e2e/playwright-report-reserved'
                ArtifactName: 'Playwright-Reserved-Report'
                publishLocation: 'Container'
            condition: succeededOrFailed()
            continueOnError: true

    # Job 3: Keycloak Tests
    - job: PlaywrightKeycloakTests
      timeoutInMinutes: 120
      displayName: 'Playwright Keycloak Tests (@useKeycloak)'
      steps:
          - task: replacetokens@5
            displayName: 'Replace tokens Playwright'
            inputs:
                rootDirectory: tests/acceptance/e2e
                targetFiles: .env.ci
                tokenPattern: custom
                tokenPrefix: _%
                tokenSuffix: '%_'
                writeBOM: false
                verbosity: detailed
                actionOnNoFiles: warn
          - task: NodeTool@0
            inputs:
                versionSource: 'fromFile'
                versionFilePath: '.nvmrc'
          - script: |
                cd tests/acceptance/e2e
                rm -rf node_modules
                npm ci
                npx playwright install --with-deps
            displayName: 'Install Playwright Dependencies'
          - script: |
                cd tests/acceptance/e2e
                USE_KEYCLOAK=true npx playwright test --project user-setup --project admin-setup
            env:
                CI: 'true'
                USE_KEYCLOAK: 'true'
            displayName: 'Setup Keycloak Authentication'
          - script: |
                cd tests/acceptance/e2e
                PLAYWRIGHT_HTML_REPORT=playwright-report-keycloak PLAYWRIGHT_JUNIT_OUTPUT_NAME=results-keycloak-junit.xml npm run test:keycloak
            env:
                CI: 'true'
            continueOnError: true
            displayName: 'Run Keycloak Tests'
          - task: PublishTestResults@2
            displayName: 'Publish Keycloak Test Results'
            inputs:
                testResultsFormat: 'JUnit'
                testResultsFiles: '**/results-keycloak-junit.xml'
                testRunTitle: 'Playwright Keycloak Tests'
            condition: succeededOrFailed()
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Keycloak HTML Report'
            inputs:
                PathtoPublish: 'tests/acceptance/e2e/playwright-report-keycloak'
                ArtifactName: 'Playwright-Keycloak-Report'
                publishLocation: 'Container'
            condition: succeededOrFailed()
            continueOnError: true
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Keycloak Accessibility Reports'
            inputs:
                PathtoPublish: 'tests/acceptance/e2e/a11y-reports'
                ArtifactName: 'Keycloak-WCAG-Reports'
                publishLocation: 'Container'
            condition: succeededOrFailed()
            continueOnError: true

    # Job 4: Aggregate Accessibility Reports
    - job: AccessibilityReports
      displayName: 'Aggregate Accessibility & WCAG Reports'
      dependsOn:
          - PlaywrightParallelTests
          - PlaywrightReservedTests
          - PlaywrightKeycloakTests
      condition: succeededOrFailed()
      steps:
          - task: NodeTool@0
            inputs:
                versionSource: 'fromFile'
                versionFilePath: '.nvmrc'
          - script: |
                cd tests/acceptance/e2e
                npm ci
            displayName: 'Install Dependencies'
          - task: DownloadBuildArtifacts@0
            displayName: 'Download Parallel WCAG Reports'
            inputs:
                buildType: 'current'
                downloadType: 'single'
                artifactName: 'Parallel-WCAG-Reports'
                downloadPath: '$(System.ArtifactsDirectory)'
            continueOnError: true
          - task: DownloadBuildArtifacts@0
            displayName: 'Download Keycloak WCAG Reports'
            inputs:
                buildType: 'current'
                downloadType: 'single'
                artifactName: 'Keycloak-WCAG-Reports'
                downloadPath: '$(System.ArtifactsDirectory)'
            continueOnError: true
          - script: |
                mkdir -p tests/acceptance/e2e/a11y-reports
                echo "Copying accessibility reports from all test jobs..."
                if [ -d "$(System.ArtifactsDirectory)/Parallel-WCAG-Reports" ]; then
                  cp -r $(System.ArtifactsDirectory)/Parallel-WCAG-Reports/* tests/acceptance/e2e/a11y-reports/ || true
                  echo "Copied Parallel reports"
                fi
                if [ -d "$(System.ArtifactsDirectory)/Keycloak-WCAG-Reports" ]; then
                  cp -r $(System.ArtifactsDirectory)/Keycloak-WCAG-Reports/* tests/acceptance/e2e/a11y-reports/ || true
                  echo "Copied Keycloak reports"
                fi
                ls -la tests/acceptance/e2e/a11y-reports/
            displayName: 'Copy All Accessibility Reports'
            continueOnError: true
          - script: |
                cd tests/acceptance/e2e
                node convert-to-sarif.js
                echo "Listing converted SARIF files:"
                ls -la a11y-reports/sarif/
            displayName: 'Convert Accessibility Reports to SARIF format'
            condition: succeededOrFailed()
            continueOnError: true
          - task: PublishBuildArtifacts@1
            displayName: 'Publish SARIF Accessibility Reports to Scans'
            inputs:
                PathtoPublish: 'tests/acceptance/e2e/a11y-reports/sarif'
                ArtifactName: 'CodeAnalysisLogs'
                publishLocation: 'Container'
            condition: succeededOrFailed()
            continueOnError: true
          - script: |
                cd tests/acceptance/e2e/scripts
                python3 generate_wcag_report.py
            displayName: 'Generate WCAG Violations Report'
            condition: succeededOrFailed()
            continueOnError: true
          - task: PublishBuildArtifacts@1
            displayName: 'Publish WCAG Violations Report'
            inputs:
                PathtoPublish: 'tests/acceptance/e2e/a11y-reports/WCAG_2.0_2.1_AA_VIOLATIONS_REPORT.txt'
                ArtifactName: 'WCAG-ViolationsReport'
                publishLocation: 'Container'
            condition: succeededOrFailed()
            continueOnError: true

          # Install Python dependencies for test publisher
          - script: |
                pip install -r azure-test-plan/requirements.txt
            displayName: 'Install Python dependencies for test publisher'
            condition: succeededOrFailed()
            continueOnError: true

          # Publish Playwright results to Azure Test Plans
          - script: |
                python3 azure-test-plan/playwright_test_publisher.py
            env:
                SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                AZURE_DEVOPS_ORG: $(AZURE_DEVOPS_ORG)
                AZURE_DEVOPS_PROJECT: $(AZURE_DEVOPS_PROJECT)
            displayName: 'Publish Test Results to Azure Test Plans (Auto-Discovery)'
            condition: succeededOrFailed()
            continueOnError: true

    - job: PerformanceTests
      timeoutInMinutes: 120
      displayName: Service Load Test
      steps:
          - task: replacetokens@5
            displayName: 'Replace tokens Locust config'
            inputs:
                rootDirectory: tests/performance/
                targetFiles: locust_config.json
                tokenPattern: custom
                tokenPrefix: _%
                tokenSuffix: '%_'
                writeBOM: false
                verbosity: detailed
                actionOnNoFiles: warn
          - task: UsePythonVersion@0
            inputs:
                versionSpec: '3.12'
                addToPath: true
                architecture: 'x64'
            displayName: 'Install Python'

          - script: |
                pip install -r ./tests/requirements-dev.txt
                pip install locust==2.33.0
            displayName: 'Install locust dependencies'

          - script: |
                mkdir -p tests/performance/results
            displayName: 'Create results directory'

          - script: |
                cd tests/performance
                locust --config locust.conf
            displayName: 'Run load test'

          - task: PublishPipelineArtifact@1
            inputs:
                targetPath: 'tests/performance/results/locust_results_file.html'
                artifactName: 'LocustResults'
            condition: succeededOrFailed()
            displayName: 'Save results'
