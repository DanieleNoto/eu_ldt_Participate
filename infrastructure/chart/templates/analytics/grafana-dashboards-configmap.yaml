        					"format": "table",
        					"rawQuery": true,
        					"rawSql": "SELECT \n  COALESCE(NULLIF(u.extended_data->>'country', ''), 'Unknown') as area_name,\n  COUNT(DISTINCT u.id) as total_users,\n  COUNT(DISTINCT CASE WHEN c.created_at >= NOW() - INTERVAL '30 days' THEN c.decidim_author_id END) as active_users_30d,\n  COUNT(DISTINCT cp.coauthorable_id) as proposals_created,\n  COUNT(DISTINCT comm.id) as comments_made,\n  ROUND((COUNT(DISTINCT CASE WHEN c.created_at >= NOW() - INTERVAL '30 days' THEN c.decidim_author_id END) * 100.0) / NULLIF(COUNT(DISTINCT u.id), 0), 2) as activity_rate\nFROM decidim_users u\nLEFT JOIN decidim_coauthorships cp ON u.id = cp.decidim_author_id AND cp.decidim_author_type IN ('Decidim::User', 'Decidim::UserBaseEntity') AND cp.coauthorable_type = 'Decidim::Proposals::Proposal'\nLEFT JOIN decidim_comments_comments comm ON u.id = comm.decidim_author_id AND comm.decidim_author_type IN ('Decidim::User', 'Decidim::UserBaseEntity') AND comm.deleted_at IS NULL\nLEFT JOIN (SELECT DISTINCT decidim_author_id, created_at FROM decidim_comments_comments WHERE decidim_author_type IN ('Decidim::User', 'Decidim::UserBaseEntity') AND deleted_at IS NULL) c ON u.id = c.decidim_author_id\nWHERE u.deleted_at IS NULL AND u.type = 'Decidim::User'\nGROUP BY area_name\nHAVING COUNT(DISTINCT u.id) > 0\nORDER BY total_users DESC\nLIMIT 10;",
