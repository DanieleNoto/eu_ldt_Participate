apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    io.kompose.service: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: redis
  template:
    metadata:
      labels:
        io.kompose.service: redis
        io.kompose.network/temp1-private: "true"
    spec:
      containers:
        - name: redis
          image: redis:7
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            failureThreshold: 5
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Mi
