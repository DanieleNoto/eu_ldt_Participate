apiVersion: apps/v1
kind: Deployment
metadata:
  name: decidim-sidekiq
  labels:
    app: decidim
    component: sidekiq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: decidim
      component: sidekiq
  template:
    metadata:
      labels:
        app: decidim
        component: sidekiq
    spec:
      # Do not automatically mount the service account token into the pod
      automountServiceAccountToken: false
      # Wait for Redis to be reachable before starting Sidekiq to avoid CrashLoopBackOff
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36.1
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for redis at redis:6379..."
              for i in $(seq 1 60); do
                nc -z redis 6379 && echo "redis reachable" && exit 0
                echo "redis not reachable yet (attempt $i)"; sleep 1
              done
              echo "timeout waiting for redis"; exit 1
          # initContainer only needs to perform a TCP check; do not import app envs here
      containers:
        - name: sidekiq
          image: euldtshared.azurecr.io/eu-ldt-part-int:_%CONTAINER_IMAGE_TOOL_TAG%_
          imagePullPolicy: IfNotPresent
          # Run Sidekiq through a small wrapper that waits for Redis so
          # container restarts also wait (initContainers don't run on restarts).
          command: ["/bin/sh", "-lc"]
          args:
            - |
              set -e
              echo "Starting Sidekiq wrapper: waiting for redis at redis:6379..."
              # loop until redis is reachable; this handles container restarts as well
              until nc -z redis 6379; do
                echo "redis not reachable yet; sleeping 1s"
                sleep 1
              done
              echo "redis reachable; exec sidekiq"
              exec bundle exec sidekiq -c ${SIDEKIQ_CONCURRENCY:-5} -e ${RAILS_ENV:-production}
          envFrom:
            - secretRef:
                name: decidim-secret
            - configMapRef:
                name: decidim-configmap
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
              ephemeral-storage: "1Gi"
            limits:
              memory: "1Gi"
              cpu: "500m"
              ephemeral-storage: "2Gi"
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "ps aux | grep '[s]idekiq' || exit 1"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "ps aux | grep '[s]idekiq' || exit 1"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      restartPolicy: Always
      # Reuse same DNS/Network settings as the app; no extra volumes by default
      # If you need access to persistent bundles, mount the same PVCs as decidim
      # by uncommenting the volume and volumeMount sections below.
      # volumes:
      #  - name: bundle-cache
      #    persistentVolumeClaim:
      #      claimName: bundle-cache-decidim-0
