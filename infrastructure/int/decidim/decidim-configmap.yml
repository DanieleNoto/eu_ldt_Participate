apiVersion: v1
kind: ConfigMap
metadata:
    name: decidim-config
data:
    # Database (non-sensitive parts)
    DATABASE_HOST: '_%TOOL3_DECIDIM_DATABASE_HOST%_'
    DATABASE_USERNAME: '_%TOOL3_DECIDIM_DATABASE_USERNAME%_'
    DATABASE_NAME: '_%TOOL3_DECIDIM_DATABASE_NAME%_'

    # Redis
    REDIS_URL: '_%TOOL3_DECIDIM_REDIS_URL%_'

    # App environment
    DECIDIM_FORCE_SSL: '_%TOOL3_DECIDIM_DECIDIM_FORCE_SSL%_'
    RAILS_ENV: '_%TOOL3_DECIDIM_RAILS_ENV%_'
    NODE_ENV: '_%TOOL3_DECIDIM_NODE_ENV%_'
    RAILS_SERVE_STATIC_FILES: '_%TOOL3_DECIDIM_RAILS_SERVE_STATIC_FILES%_'
    DECIDIM_MAILER_SENDER: '_%TOOL3_DECIDIM_DECIDIM_MAILER_SENDER%_'
    QUEUE_ADAPTER: '_%TOOL3_DECIDIM_QUEUE_ADAPTER%_'

    # Keycloak / omniauth (non-sensitive parts)
    OMNIAUTH_KEYCLOAK_CLIENT_ID: '_%TOOL3_DECIDIM_OMNIAUTH_KEYCLOAK_CLIENT_ID%_'
    OMNIAUTH_KEYCLOAK_SITE: '_%TOOL3_DECIDIM_OMNIAUTH_KEYCLOAK_SITE%_'
    OMNIAUTH_KEYCLOAK_REALM: '_%TOOL3_DECIDIM_OMNIAUTH_KEYCLOAK_REALM%_'

    # Shakapacker devserver (disabled in production)
    SHAKAPACKER_DEV_SERVER_HOST: '_%TOOL3_DECIDIM_SHAKAPACKER_DEV_SERVER_HOST%_'
    SHAKAPACKER_DEV_SERVER_PORT: '_%TOOL3_DECIDIM_SHAKAPACKER_DEV_SERVER_PORT%_'
    SHAKAPACKER_DEV_SERVER_ENABLED: '_%TOOL3_DECIDIM_SHAKAPACKER_DEV_SERVER_ENABLED%_'

    # Runtime / flags
    RAILS_CSP_DEVELOPMENT: '_%TOOL3_DECIDIM_RAILS_CSP_DEVELOPMENT%_'
    FORCE_DB_RESET: '_%TOOL3_DECIDIM_FORCE_DB_RESET%_'
    FORCE_DATA_SETUP: '_%TOOL3_DECIDIM_FORCE_DATA_SETUP%_'

    # SMTP (non-sensitive parts go here)
    SMTP_ADDRESS: '_%TOOL3_DECIDIM_SMTP_ADDRESS%_'
    SMTP_PORT: '_%TOOL3_DECIDIM_SMTP_PORT%_'
    SMTP_DOMAIN: '_%TOOL3_DECIDIM_SMTP_DOMAIN%_'
    SMTP_AUTHENTICATION: '_%TOOL3_DECIDIM_SMTP_AUTHENTICATION%_'
    SMTP_ENABLE_STARTTLS_AUTO: '_%TOOL3_DECIDIM_SMTP_ENABLE_STARTTLS_AUTO%_'
    SMTP_OPENSSL_VERIFY_MODE: '_%TOOL3_DECIDIM_SMTP_OPENSSL_VERIFY_MODE%_'
