apiVersion: v1
kind: Service
metadata:
    name: grafana
    namespace: {{ include "eu-ldt-participate.namespace" . }}
    labels:
        app: grafana
spec:
    type: ClusterIP
    selector:
        io.kompose.service: grafana # Selector que apunta al StatefulSet/Deployment
    ports:
        - name: http
          port: 3000 # Puerto expuesto dentro del cluster
          targetPort: 3000 # Puerto del contenedor
