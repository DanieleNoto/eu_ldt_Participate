apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: jitsi-web
    labels:
       app: jitsi-web
spec:
    serviceName: jitsi-web
    replicas: 1
    selector:
        matchLabels:
            io.kompose.service: jitsi-web
    template:
        metadata:
            labels:
                io.kompose.service: jitsi-web
                io.kompose.network/temp1-private: 'true'
        spec:
            automountServiceAccountToken: false
            containers:
                - name: jitsi-web
                  image: jitsi/web:stable-8960
                  resources:
                      requests:
                          memory: '128Mi'
                          cpu: '100m'
                          ephemeral-storage: '512Mi'
                      limits:
                          memory: '256Mi'
                          cpu: '250m'
                          ephemeral-storage: '1Gi'
                  ports:
                      - containerPort: 8000
                        protocol: TCP
                      - containerPort: 8443
                        protocol: TCP
                  volumeMounts:
                      - mountPath: /config
                        name: jitsi-web-claim0
                  envFrom:
                      - configMapRef:
                            name: jitsi-config
                      - secretRef:
                            name: jitsi-secret
    volumeClaimTemplates:
        - metadata:
              name: jitsi-web-claim0
          spec:
              accessModes: ['ReadWriteOnce']
              resources:
                  requests:
                      storage: 50Mi
