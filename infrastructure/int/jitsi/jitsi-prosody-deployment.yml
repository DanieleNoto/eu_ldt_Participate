apiVersion: apps/v1
kind: Deployment
metadata:
    name: jitsi-prosody
    namespace: participate
    labels:
        app: jitsi
        component: prosody
spec:
    replicas: 1
    selector:
        matchLabels:
            app: jitsi
            component: prosody
    template:
        metadata:
            labels:
                app: jitsi
                component: prosody
        spec:
            automountServiceAccountToken: false
            containers:
                - name: prosody
                  image: jitsi/prosody:stable-8960
                  imagePullPolicy: IfNotPresent
                  resources:
                      requests:
                          memory: '128Mi'
                          cpu: '100m'
                          ephemeral-storage: '512Mi'
                      limits:
                          memory: '256Mi'
                          cpu: '250m'
                          ephemeral-storage: '1Gi'
                  ports:
                      - containerPort: 5222
                        name: xmpp
                      - containerPort: 5347
                        name: component
                      - containerPort: 5280
                        name: bosh
                  envFrom:
                      - configMapRef:
                            name: jitsi-config
                      - secretRef:
                            name: jitsi-secrets
                  volumeMounts:
                      - name: prosody-config
                        mountPath: /config
                      - name: prosody-plugins
                        mountPath: /prosody-plugins-custom
            volumes:
                - name: prosody-config
                  persistentVolumeClaim:
                      claimName: jitsi-prosody-pvc
                - name: prosody-plugins
                  emptyDir: {}
