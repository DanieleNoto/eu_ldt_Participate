<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>euldt-participate-chatbot-fe - react</title>

		<script>
			console.log('%c[euldt-participate-chatbot-fe] startup 🚀', 'color: #0164f2');
			console.log('%c[euldt-participate-chatbot-fe] running version: {{version}}', 'color: #0164f2');
			console.log('%c[euldt-participate-chatbot-fe] release date: {{releaseDate}}', 'color: #0164f2');
		</script>
		<style>
			#loader {
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				z-index: 1003;
				background: #000000;
				overflow: hidden;
			}

			.lds-ripple {
				display: block;
				position: relative;
				left: 50%;
				top: 50%;
				margin: -80px 0;
				width: 80px;
				height: 80px;
			}

			.lds-ripple div {
				position: absolute;
				border: 4px solid #fff;
				opacity: 1;
				border-radius: 50%;
				animation: lds-ripple 1s cubic-bezier(0, 0.2, 0.8, 1) infinite;
			}

			.lds-ripple div:nth-child(2) {
				animation-delay: -0.5s;
			}

			@keyframes lds-ripple {
				0% {
					top: 36px;
					left: 36px;
					width: 0;
					height: 0;
					opacity: 1;
				}
				100% {
					top: 0px;
					left: 0px;
					width: 72px;
					height: 72px;
					opacity: 0;
				}
			}
		</style>
	</head>
	<body>
		<noscript>You need to enable JavaScript to run this app.</noscript>
		<div id="root">
			<div id="loader">
				<div class="lds-ripple">
					<div></div>
					<div></div>
				</div>
			</div>
		</div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
