{{- if .Values.jitsi.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: jitsi-jvb
    namespace: {{ include "eu-ldt-participate.namespace" . }}
    labels:
        app: jitsi-jvb
spec:
    serviceName: jitsi-jvb
    replicas: 1
    selector:
        matchLabels:
            app: jitsi-jvb
    template:
        metadata:
            labels:
                app: jitsi-jvb
        spec:
            automountServiceAccountToken: false
            containers:
                - name: jitsi-jvb
                  image: jitsi/jvb:stable-10888
                  imagePullPolicy: IfNotPresent
                  resources:
                      requests:
                          memory: '256Mi'
                          cpu: '200m'
                          ephemeral-storage: '512Mi'
                      limits:
                          memory: '512Mi'
                          cpu: '500m'
                          ephemeral-storage: '1Gi'
                  envFrom:
                      - configMapRef:
                            name: jitsi-config
                      - secretRef:
                            name: jitsi-secret
                  ports:
                      - containerPort: 10000
                        protocol: UDP
                  volumeMounts:
                      - mountPath: /config
                        name: jitsi-jvb-storage
    volumeClaimTemplates:
        - metadata:
              name: jitsi-jvb-storage
          spec:
              accessModes: ['ReadWriteOnce']
              resources:
                  requests:
                      storage: 100Mi
---
apiVersion: v1
kind: Service
metadata:
    name: jitsi-jvb
    namespace: {{ include "eu-ldt-participate.namespace" . }}
    labels:
        app: jitsi-jvb
spec:
    type: ClusterIP
    selector:
        app: jitsi-jvb
    ports:
        - name: udp-10000
          port: 10000
          targetPort: 10000
          protocol: UDP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: jitsi-jvb-claim0
    namespace: {{ include "eu-ldt-participate.namespace" . }}
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 100Mi
{{- end }}
