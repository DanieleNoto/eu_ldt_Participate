server {
    listen 8081;
    server_name localhost;
    
    root /var/www/html;
    index index.php index.html index.htm;
    
    # Security headers for iframe embedding - permissive for navigation
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self' http://decidim:3000 https://decidim:3000" always;
    add_header X-Content-Type-Options "nosniff" always;
    
    # Configure for iframe embedding without parent navigation
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        
        # Headers to keep content within iframe
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Content-Security-Policy "frame-ancestors 'self' http://decidim:3000 https://decidim:3000; frame-src 'self'";
        
        # Prevent cache issues with embedded content
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # Handle Matomo PHP files for iframe embedding
    location ~ \.php$ {
        fastcgi_pass matomo-fpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        # Keep PHP responses within iframe
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Content-Security-Policy "frame-ancestors 'self' http://decidim:3000 https://decidim:3000; frame-src 'self'";
        
        # Prevent caching issues
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    
    # Static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN";
    }
    
    # Security: deny access to sensitive files
    location ~ /\. {
        deny all;
    }
    
    location ~ /config/ {
        deny all;
    }
}