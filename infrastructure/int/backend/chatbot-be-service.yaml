apiVersion: v1
kind: Service
metadata:
    name: chatbot-backend-svc
    namespace: participate
spec:
    type: ClusterIP
    selector:
        app: chatbot-webapp
    ports:
        - port: 3002
          targetPort: 3002
          protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
    name: chatbot-pg-svc
    namespace: participate
spec:
    type: ClusterIP
    selector:
        app: chatbot-webapp
    ports:
        - name: pgsql
          protocol: TCP
          port: 5432
          targetPort: 5432

