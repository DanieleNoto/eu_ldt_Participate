
apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
    pv.kubernetes.io/provisioned-by: file.csi.azure.com
  name: decidim-pv-rwx
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: azurefile-csi
  csi:
    driver: file.csi.azure.com
    readOnly: false
    volumeHandle: EU-LDT-Toolbox-Shared-int-group-name#euldtsharedtfstateint#tool3-shared-files  # make sure this volumeid is unique in the cluster "EU-LDT-Toolbox-Shared-int-group-name#euldtsharedtfstateint#tool1-shared-files"
    volumeAttributes:
      resourceGroup: EU-LDT-Toolbox-Shared-int  # optional, only set this when storage account is not in the same resource group as agent node
      shareName: decidim-pv-rwx
      folderName: shared
    nodeStageSecretRef:
      name: storage-secret
      namespace: participate
  mountOptions:
    - dir_mode=0777
    - file_mode=0777
    - uid=0
    - gid=0
    - mfsymlinks
    - cache=strict
    - nosharesock
    - nobrl
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: decidim-pvc-rwx
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: azurefile-csi
  volumeName: decidim-pv-rwx
  resources:
    requests:
      storage: 5Gi