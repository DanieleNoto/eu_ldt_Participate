openapi: 3.0.3
info:
  title: EU LDT Participate Chatbot API
  description: BE Project of EU LDT Participate chatbot
  version: 1.0.0
components:
  schemas: {}
paths:
  /api/v1/chat/:
    post:
      tags:
        - chat
      description: Create a new chat
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                conversationId:
                  type: string
                  format: uuid
                nodeId:
                  type: string
              additionalProperties: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversationId:
                    type: string
                    format: uuid
                  answer:
                    type: string
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        text:
                          type: string
                      required:
                        - id
                        - text
                      additionalProperties: false
                  isLeaf:
                    type: boolean
                  options:
                    type: array
                    items:
                      type: object
                      properties:
                        action:
                          type: string
                        label:
                          type: string
                      required:
                        - action
                        - label
                      additionalProperties: false
                required:
                  - conversationId
                  - answer
                  - suggestions
                  - isLeaf
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                  error:
                    type: string
                  details:
                    type: array
                required:
                  - statusCode
                  - error
                additionalProperties: false
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                  error:
                    type: string
                  details:
                    type: array
                required:
                  - statusCode
                  - error
                additionalProperties: false
        "500":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                  error:
                    type: string
                  details:
                    type: array
                required:
                  - statusCode
                  - error
                additionalProperties: false
