apiVersion: v1
kind: ConfigMap
metadata:
    labels:
        io.kompose.service: jitsi-config
    name: jitsi-config
data:
    CONFIG: ./jitsi-meet-cfg
    DATABASE_HOST: db
    DATABASE_NAME: decidim_application_development
    DATABASE_USERNAME: postgres
    POSTGRES_USER: admin
    POSTGRES_PASSWORD: supersecret
    ENABLE_AUTH: '1'
    ENABLE_GUESTS: '1'
    JICOFO_AUTH_USER: focus
    JITSI_HTTP_PORT: '8000'
    JITSI_HTTPS_PORT: '8443'
    JITSI_UDP_PORT: '10000'
    JVB_AUTH_USER: jvb
    JVB_BREWERY_MUC: jvbbrewery
    JVB_ENABLE_APIS: rest,colibri
    JVB_PORT: '10000'
    JVB_STUN_SERVERS: stun.l.google.com:19302,stun1.l.google.com:19302
    PUBLIC_URL: https://jitsi.part-int.ldttoolbox.app
    RESTART_POLICY: unless-stopped
    TZ: Europe/Rome
    XMPP_AUTH_DOMAIN: auth.meet.jitsi
    XMPP_BOSH_URL_BASE: http://jitsi-prosody:5280/http-bind
    XMPP_DOMAIN: meet.jitsi
    XMPP_GUEST_DOMAIN: guest.meet.jitsi
    XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
    XMPP_MODULES: ''
    XMPP_MUC_DOMAIN: muc.meet.jitsi
    XMPP_RECORDER_DOMAIN: recorder.meet.jitsi
    XMPP_SERVER: jitsi-prosody
    ENABLE_XMPP_WEBSOCKET: '1'
    SUBDIR: ''
    ENABLE_SUBDOMAINS: 'true'
    
    # No embedded config.js here — rely on the image default config.js or mount a separate file
    # If you need custom JS, mount a file at /config/web/config.js via a ConfigMap or a volume.