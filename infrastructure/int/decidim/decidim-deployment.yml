apiVersion: apps/v1
kind: Deployment
metadata:
    name: decidim
    labels:
        app: decidim
spec:
    replicas: 1
    selector:
        matchLabels:
            app: decidim
    template:
        metadata:
            labels:
                app: decidim
        spec:
            containers:
                - name: decidim
                  # Replace the image after you build & push the local Dockerfile
                  image: decidim:dev
                  imagePullPolicy: IfNotPresent
                  ports:
                      - containerPort: 3000
                  envFrom:
                      - configMapRef:
                            name: decidim-config
                      - secretRef:
                            name: decidim-secrets
                  volumeMounts:
                      - name: bundle-cache
                        mountPath: /usr/local/bundle
                      - name: vendor-bundle
                        mountPath: /app/vendor/bundle
                      - name: node-modules
                        mountPath: /code/node_modules
                  command: ['bash', '/code/docker-entrypoint.sh']
            volumes:
                - name: bundle-cache
                  persistentVolumeClaim:
                      claimName: bundle-cache-pvc
                - name: vendor-bundle
                  persistentVolumeClaim:
                      claimName: vendor-bundle-pvc
                - name: node-modules
                  persistentVolumeClaim:
                      claimName: node-modules-pvc
