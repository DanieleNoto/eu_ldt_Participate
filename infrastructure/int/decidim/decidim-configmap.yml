apiVersion: v1
kind: ConfigMap
metadata:
    labels:
        io.kompose.service: db-home-adminlnx-temp1-env
    name: decidim-configmap
data:
    CHATBOT_ENABLED: 'true'
    CHATBOT_URL: _%CHATBOT-URL%_
    CHATBOT_BACKEND_URL: _%CHATBOT-BACKEND-URL%_
    DATABASE_HOST: _%DATABASE-HOST%_
    DATABASE_NAME: _%DATABASE-NAME%_
    # DATABASE_USERNAME: postgres
    DECIDIM_AVAILABLE_LOCALES: _%DECIDIM-AVAILABLE-LOCALES%_
    DECIDIM_DEFAULT_LOCALE: _%DECIDIM-DEFAULT-LOCALE%_
    DECIDIM_FORCE_SSL: 'true'
    DECIDIM_FOLLOW_HTTP_X_FORWARDED_HOST: 'true'
    DECIDIM_HOST: _%DECIDIM-HOST%_
    DECIDIM_JITSI_URL: _%DECIDIM-JITSI-URL%_
    DECIDIM_JITSI_ROOM_PREFIX: decidim-meeting-
    DECIDIM_MAILER_SENDER: _%DECIDIM-MAILER-SENDER%_
    DECIDIM_PROTOCOL: https
    DECIDIM_ENABLE_HTML_HEADER_SNIPPETS: 'true'
    DECIDIM_SERVICE_WORKER_ENABLED: 'false'
    DECIDIM_THROTTLING_MAX_REQUESTS: _%DECIDIM-THROTTLING-MAX-REQUESTS%_
    DOCKER_HOST_ADDRESS: 127.0.0.1
    ENABLE_JSON_LOGS: _%ENABLE-JSON-LOGS%_
    GF_SERVER_DOMAIN: _%GF-SERVER-DOMAIN%_
    HELP_URL: _%HELP-URL%_
    KEYCLOAK_DISABLE_SSL_VERIFY: _%KEYCLOAK-DISABLE-SSL-VERIFY%_
    MATOMO_SITE_ID: _%MATOMO-SITE-ID%_
    MATOMO_SERVER_ADDRESS: _%MATOMO-SERVER-ADDRESS%_
    MEETINGS_EMBEDDABLE_SERVICES: _%MEETINGS-EMBEDDABLE-SERVICES%_
    NODE_ENV: production
    OMNIAUTH_KEYCLOAK_CLIENT_ID: _%OMNIAUTH-KEYCLOAK-CLIENT-ID%_
    OMNIAUTH_KEYCLOAK_REALM: _%OMNIAUTH-KEYCLOAK-REALM%_
    OMNIAUTH_KEYCLOAK_SITE: _%OMNIAUTH-KEYCLOAK-SITE%_
    QUEUE_ADAPTER: _%QUEUE-ADAPTER%_
    RAILS_LOG_LEVEL: _%RAILS-LOG-LEVEL%_
    RAILS_LOG_TO_STDOUT: 'true'
    RAILS_ENV: production
    RAILS_ASSET_HOST: _%RAILS-ASSET-HOST%_
    REDIS_URL: _%REDIS-URL%_
    RESTART_POLICY: _%RESTART-POLICY%_
    SMTP_ADDRESS: _%SMTP-ADDRESS%_
    SMTP_AUTHENTICATION: _%SMTP-AUTHENTICATION%_
    SMTP_DOMAIN: _%SMTP-DOMAIN%_
    SMTP_ENABLE_STARTTLS_AUTO: _%SMTP-ENABLE-STARTTLS-AUTO%_
    SMTP_PORT: _%SMTP-PORT%_
    SMTP_TLS: _%SMTP-TLS%_
    SMTP_USERNAME: _%SMTP-USERNAME%_
    SMTP_OPEN_TIMEOUT: _%SMTP-OPEN-TIMEOUT%_
    SMTP_READ_TIMEOUT: _%SMTP-READ-TIMEOUT%_
    TOOL0_API_TOOLBAR_APPLICATIONS: _%TOOL0-API-TOOLBAR-APPLICATIONS%_
    TOOL0_FULL_URL: _%TOOL0-FULL-URL%_
    TOOL0_DOMAIN: _%TOOL0-DOMAIN%_
    TOOL2_EXPERIMENTS_URL: _%TOOL2-EXPERIMENTS-URL%_
    TOOL2_IFRAME_URL: _%TOOL2-IFRAME-URL%_
    TOOL1_MAPS_URL: _%TOOL1-MAPS-URL%_
