apiVersion: apps/v1
kind: StatefulSet
metadata:
    annotations:
        kompose.cmd: /home/adminlnx/.config/Code/User/globalStorage/othy1010.kompose/kompose convert --out=/home/adminlnx/TEMP1 --file=/home/adminlnx/TEMP1/docker-compose.yml
        kompose.version: 1.21.0 (992df58d8)
    labels:
        io.kompose.service: grafana
    name: grafana
spec:
    serviceName: grafana
    replicas: 1
    selector:
        matchLabels:
            io.kompose.service: grafana
    template:
        metadata:
            labels:
                io.kompose.network/temp1-private: 'true'
                io.kompose.service: grafana
        spec:
            automountServiceAccountToken: false
            securityContext:
                runAsUser: 472 # UID del usuario Grafana
                runAsGroup: 472 # GID del usuario Grafana
                fsGroup: 472 # Grupo para los volumenes montados
            containers:
                - name: grafana
                  image: grafana/grafana:13.0.1
                  resources:
                      requests:
                          memory: '256Mi'
                          cpu: '250m'
                          ephemeral-storage: '1Gi'
                      limits:
                          memory: '512Mi'
                          cpu: '500m'
                          ephemeral-storage: '2Gi'
                  ports:
                      - containerPort: 3000
                        hostPort: 3001
                        protocol: TCP
                  envFrom:
                      - secretRef:
                            name: grafana-secrets
                      - configMapRef:
                            name: grafana-configmap
                  volumeMounts:
                      - name: grafana-data
                        mountPath: /var/lib/grafana
                      - name: grafana-provisioning-datasources
                        mountPath: /etc/grafana/provisioning/datasources
                        readOnly: true
                      - name: grafana-provisioning-dashboards
                        mountPath: /etc/grafana/provisioning/dashboards
                        readOnly: true
                      - name: grafana-dashboards
                        mountPath: /var/lib/grafana/dashboards
                        readOnly: true
            restartPolicy: Always
            volumes:
                - name: grafana-provisioning-datasources
                  configMap:
                      name: grafana-provisioning-datasources
                - name: grafana-provisioning-dashboards
                  configMap:
                      name: grafana-provisioning-dashboards
                - name: grafana-dashboards
                  configMap:
                      name: grafana-dashboards
                - name: grafana-data
                  persistentVolumeClaim:
                      claimName: grafana-data
