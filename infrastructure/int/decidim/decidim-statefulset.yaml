apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: decidim
    labels:
        app: decidim
spec:
    serviceName: 'decidim' # requerido en StatefulSet
    replicas: 1
    selector:
        matchLabels:
            app: decidim
    template:
        metadata:
            labels:
                app: decidim
        spec:
            automountServiceAccountToken: false
            containers:
                - name: decidim
                  resources:
                      requests:
                          memory: '512Mi'
                          cpu: '500m'
                          ephemeral-storage: '2Gi'
                      limits:
                          memory: '1Gi'
                          cpu: '1'
                          ephemeral-storage: '4Gi'
                  image: euldtshared.azurecr.io/eu-ldt-part-int:_%CONTAINER_IMAGE_TOOL_TAG%_
                  envFrom:
                      - secretRef:
                            name: decidim-secret
                      - configMapRef:
                            name: decidim-configmap

                  ports:
                      - containerPort: 3000
                  livenessProbe:
                      httpGet:
                          path: /up
                          port: 3000
                          scheme: HTTP
                      initialDelaySeconds: 60
                      periodSeconds: 30
                      timeoutSeconds: 10
                      failureThreshold: 5
                      successThreshold: 1
                  readinessProbe:
                      httpGet:
                          path: /up
                          port: 3000
                          scheme: HTTP
                      initialDelaySeconds: 30
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3
                      successThreshold: 1
                  volumeMounts:
                      - mountPath: /code/data
                        name: decidim-pvc
    volumeClaimTemplates:
        - metadata:
              name: decidim-pvc
          spec:
              accessModes: ['ReadWriteOnce']
              resources:
                  requests:
                      storage: 1Gi
