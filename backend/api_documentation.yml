openapi: 3.0.3
info:
  title: EU LDT Participate Chatbot API
  description: BE Project of EU LDT Participate chatbot
  version: 1.0.0
components:
  schemas: {}
paths:
  /api/v1/chat/:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                conversationId:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000)$
                nodeId:
                  type: string
                language:
                  default: en
                  type: string
                  minLength: 2
                  maxLength: 5
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversationId:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000)$
                  answer:
                    type: string
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        text:
                          type: string
                      required:
                        - id
                        - text
                      additionalProperties: false
                  faqs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        question:
                          type: string
                        answer:
                          type: string
                      required:
                        - id
                        - question
                        - answer
                      additionalProperties: false
                  isLeaf:
                    type: boolean
                  options:
                    type: array
                    items:
                      type: object
                      properties:
                        action:
                          type: string
                        label:
                          type: string
                      required:
                        - action
                        - label
                      additionalProperties: false
                required:
                  - conversationId
                  - answer
                  - suggestions
                  - isLeaf
                additionalProperties: false
  /api/v1/support/send:
    post:
      responses:
        "200":
          description: Default Response
servers:
  - url: http://localhost:3000
    description: Development server
