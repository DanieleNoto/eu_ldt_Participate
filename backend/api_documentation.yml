openapi: 3.0.3
info:
  title: EU LDT Participate Chatbot API
  description: BE Project of EU LDT Participate chatbot
  version: 1.0.0
components:
  schemas: {}
paths:
  /api/v1/chat/:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                conversationId:
                  type: string
                  format: uuid
                nodeId:
                  type: string
                language:
                  type: string
                  minLength: 2
                  maxLength: 5
                  default: en
              additionalProperties: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversationId:
                    type: string
                    format: uuid
                  answer:
                    type: string
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        text:
                          type: string
                      required:
                        - id
                        - text
                      additionalProperties: false
                  faqs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        question:
                          type: string
                        answer:
                          type: string
                      required:
                        - id
                        - question
                        - answer
                      additionalProperties: false
                  isLeaf:
                    type: boolean
                  options:
                    type: array
                    items:
                      type: object
                      properties:
                        action:
                          type: string
                        label:
                          type: string
                      required:
                        - action
                        - label
                      additionalProperties: false
                required:
                  - conversationId
                  - answer
                  - suggestions
                  - isLeaf
                additionalProperties: false
  /api/v1/health/:
    get:
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  checks:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        status:
                          type: string
                        timestamp:
                          type: string
                        responseTime:
                          type: number
                        details:
                          type: string
                      required:
                        - status
                        - timestamp
                      additionalProperties: false
                  timestamp:
                    type: string
                  version:
                    type: string
                required:
                  - status
                  - checks
                  - timestamp
                additionalProperties: false
  /api/v1/health/ready:
    get:
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  checks:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        status:
                          type: string
                        timestamp:
                          type: string
                        responseTime:
                          type: number
                        details:
                          type: string
                      required:
                        - status
                        - timestamp
                      additionalProperties: false
                  timestamp:
                    type: string
                  version:
                    type: string
                required:
                  - status
                  - checks
                  - timestamp
                additionalProperties: false
  /api/v1/health/live:
    get:
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  checks:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        status:
                          type: string
                        timestamp:
                          type: string
                        responseTime:
                          type: number
                        details:
                          type: string
                      required:
                        - status
                        - timestamp
                      additionalProperties: false
                  timestamp:
                    type: string
                  version:
                    type: string
                required:
                  - status
                  - checks
                  - timestamp
                additionalProperties: false
  /api/v1/health/services:
    get:
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    status:
                      type: string
                    timestamp:
                      type: string
                    responseTime:
                      type: number
                    details:
                      type: string
                  required:
                    - status
                    - timestamp
                  additionalProperties: false
  /api/v1/health/kubernetes:
    get:
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  healthy:
                    type: boolean
                  details:
                    type: object
                    properties:
                      status:
                        type: string
                      checks:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            status:
                              type: string
                            timestamp:
                              type: string
                            responseTime:
                              type: number
                            details:
                              type: string
                          required:
                            - status
                            - timestamp
                          additionalProperties: false
                      timestamp:
                        type: string
                      version:
                        type: string
                    required:
                      - status
                      - checks
                      - timestamp
                    additionalProperties: false
                required:
                  - healthy
                  - details
                additionalProperties: false
  /api/v1/support/send:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                conversationId:
                  type: string
                  format: uuid
                message:
                  type: string
                  minLength: 20
                  maxLength: 500
              required:
                - conversationId
                - message
              additionalProperties: false
        required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                required:
                  - response
                additionalProperties: false
servers:
  - url: http://localhost:3000
    description: Development server
