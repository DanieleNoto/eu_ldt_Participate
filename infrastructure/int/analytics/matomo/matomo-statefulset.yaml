apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: matomo
  labels:
    io.kompose.service: matomo
spec:
  serviceName: matomo
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: matomo
  template:
    metadata:
      labels:
        io.kompose.service: matomo
        io.kompose.network/temp1-private: "true"
    spec:
      containers:
        - name: matomo
          image: matomo:5
          ports:
            - containerPort: 80
              protocol: TCP
          env:
            # Mantener tus variables de entorno desde ConfigMap
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: home-adminlnx-temp1-env
                  key: DATABASE_HOST
            - name: DATABASE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: home-adminlnx-temp1-env
                  key: DATABASE_USERNAME
            - name: DATABASE_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: home-adminlnx-temp1-env
                  key: DATABASE_PASSWORD
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: home-adminlnx-temp1-env
                  key: DATABASE_NAME
            - name: MATOMO_DATABASE_ADAPTER
              valueFrom:
                configMapKeyRef:
                  name: home-adminlnx-temp1-env
                  key: MATOMO_DATABASE_ADAPTER
            - name: MATOMO_DATABASE_TABLES_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: home-adminlnx-temp1-env
                  key: MATOMO_DATABASE_TABLES_PREFIX
          volumeMounts:
            - name: matomo-data
              mountPath: /var/www/html
  volumeClaimTemplates:
    - metadata:
        name: matomo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Mi


