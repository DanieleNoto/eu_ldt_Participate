apiVersion: v1
kind: ConfigMap
metadata:
    name: decidim-config
data:
    # Database (non-sensitive parts)
    DATABASE_HOST: 'decidim-postgres'
    DATABASE_USERNAME: 'postgres'
    DATABASE_NAME: 'decidim_application_development'

    # Redis
    REDIS_URL: 'redis://decidim-redis:6379/0'

    # App environment
    DECIDIM_FORCE_SSL: 'false'
    RAILS_ENV: 'production'
    NODE_ENV: 'production'
    RAILS_SERVE_STATIC_FILES: 'true'
    DECIDIM_MAILER_SENDER: 'changeme@example.org'
    QUEUE_ADAPTER: 'async'

    # Keycloak / omniauth (non-sensitive parts)
    OMNIAUTH_KEYCLOAK_CLIENT_ID: 'Tool3'
    OMNIAUTH_KEYCLOAK_SITE: 'https://im-int.ldttoolbox.app/'
    OMNIAUTH_KEYCLOAK_REALM: 'LDT'

    # Shakapacker devserver (disabled in production)
    SHAKAPACKER_DEV_SERVER_HOST: '0.0.0.0'
    SHAKAPACKER_DEV_SERVER_PORT: '3035'
    SHAKAPACKER_DEV_SERVER_ENABLED: 'false'

    # Runtime / flags
    RAILS_CSP_DEVELOPMENT: 'true'
    FORCE_DB_RESET: 'false'
    FORCE_DATA_SETUP: 'true'

    # SMTP (non-sensitive parts go here)
    SMTP_ADDRESS: 'smtp.example.com'
    SMTP_PORT: '587'
    SMTP_DOMAIN: 'example.com'
    SMTP_AUTHENTICATION: 'plain'
    SMTP_ENABLE_STARTTLS_AUTO: 'true'
    SMTP_OPENSSL_VERIFY_MODE: ''
