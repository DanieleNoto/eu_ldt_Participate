apiVersion: v1
kind: Secret
metadata:
    name: chatbot-backend-db-secret
    namespace: {{ include "eu-ldt-participate.namespace" . }}
type: Opaque
stringData:
    ## INFRA please move on KV
    POSTGRES_PASSWORD: {{ .Values.chatbot.db.password | quote }}
    POSTGRES_USER: {{ .Values.chatbot.db.username | quote }}
    POSTGRES_DB: {{ .Values.chatbot.db.name | quote }}
    ## DATABASE_URL will be constructed as: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)
    ## For now, set it manually or use an init container to construct it
    DATABASE_URL: {{ .Values.chatbot.db.url | quote }}
    DB_USERNAME: {{ .Values.chatbot.db.username | quote }}
    DB_PASSWORD: {{ .Values.chatbot.db.password | quote }}
