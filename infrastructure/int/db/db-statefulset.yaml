                  key: DATABASE_USERNAME
                  name: home-adminlnx-temp1-env
            - name: DECIDIM_FORCE_SSL
              valueFrom:
                configMapKeyRef:
                  key: DECIDIM_FORCE_SSL
                  name: home-adminlnx-temp1-env
            - name: DECIDIM_MAILER_SENDER
              valueFrom:
