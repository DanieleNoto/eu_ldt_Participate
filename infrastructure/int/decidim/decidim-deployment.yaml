apiVersion: apps/v1
kind: Deployment
metadata:
    annotations:
        kompose.cmd: /home/adminlnx/.config/Code/User/globalStorage/othy1010.kompose/kompose convert --out=/home/adminlnx/TEMP1 --file=/home/adminlnx/TEMP1/docker-compose.yml
        kompose.version: 1.21.0 (992df58d8)
    labels:
        io.kompose.service: decidim
    name: decidim
spec:
    replicas: 1
    selector:
        matchLabels:
            io.kompose.service: decidim
    strategy:
        type: Recreate
    template:
        metadata:
            annotations:
                kompose.cmd: /home/adminlnx/.config/Code/User/globalStorage/othy1010.kompose/kompose convert --out=/home/adminlnx/TEMP1 --file=/home/adminlnx/TEMP1/docker-compose.yml
                kompose.version: 1.21.0 (992df58d8)
            labels:
                io.kompose.network/temp1-private: 'true'
                io.kompose.service: decidim
        spec:
            containers:
                - args:
                      - bash
                      - /code/docker-entrypoint.sh
                  envFrom:
                      - configMapRef:
                            name: home-adminlnx-temp1-env

                  image: euldtshared.azurecr.io/eu-ldt-part-int:int-14581
                  livenessProbe:
                      exec:
                          command:
                              - test
                              - -d
                              - node_modules
                      failureThreshold: 30
                      periodSeconds: 10
                      timeoutSeconds: 5
                  name: decidim
                  ports:
                      - containerPort: 3000
                        hostPort: 3000
