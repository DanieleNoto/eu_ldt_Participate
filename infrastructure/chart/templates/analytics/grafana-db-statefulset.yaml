apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: grafana-db
    namespace: {{ include "eu-ldt-participate.namespace" . }}
    labels:
        app: grafana-db
spec:
    serviceName: 'grafana-db'
    replicas: 1
    selector:
        matchLabels:
            app: grafana-db
    template:
        metadata:
            labels:
                app: grafana-db
        spec:
            automountServiceAccountToken: false
            containers:
                - name: grafana-db
                  image: postgres:16
                  imagePullPolicy: IfNotPresent
                  resources:
                      requests:
                          memory: '512Mi'
                          cpu: '500m'
                          ephemeral-storage: '2Gi'
                      limits:
                          memory: '1Gi'
                          cpu: '1'
                          ephemeral-storage: '5Gi'
                  ports:
                      - containerPort: 5432
                  envFrom:
                      - configMapRef:
                            name: grafana-db-config
                      - secretRef:
                            name: grafana-db-secret
                  volumeMounts:
                      - name: grafana-db-data
                        mountPath: /var/lib/postgresql/data
    volumeClaimTemplates:
        - metadata:
              name: grafana-db-data
          spec:
              accessModes: ['ReadWriteOnce']
              resources:
                  requests:
                      storage: 1Gi
