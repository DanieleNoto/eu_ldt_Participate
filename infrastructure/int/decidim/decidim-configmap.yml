apiVersion: v1
kind: ConfigMap
metadata:
    labels:
        io.kompose.service: db-home-adminlnx-temp1-env
    name: decidim-configmap
data:
    CHATBOT_ENABLED: 'true'
    CHATBOT_URL: http://chatbot-frontend-svc:80
    CHATBOT_BACKEND_URL: http://chatbot-backend-svc:3002
    DATABASE_HOST: db
    DATABASE_NAME: decidim_application_development
    # DATABASE_USERNAME: postgres
    DECIDIM_AVAILABLE_LOCALES: en,es,fr,de
    DECIDIM_DEFAULT_LOCALE: en
    DECIDIM_FORCE_SSL: 'true'
    DECIDIM_FOLLOW_HTTP_X_FORWARDED_HOST: 'true'
    DECIDIM_HOST: part-int.ldttoolbox.app
    DECIDIM_JITSI_URL: https://jitsi-part-int.ldttoolbox.app/
    DECIDIM_JITSI_ROOM_PREFIX: decidim-meeting-
    DECIDIM_MAILER_SENDER: info@ldttoolbox.eu
    DECIDIM_PROTOCOL: https
    DECIDIM_ENABLE_HTML_HEADER_SNIPPETS: 'true'
    DECIDIM_SERVICE_WORKER_ENABLED: 'false'
    DECIDIM_THROTTLING_MAX_REQUESTS: '500'
    DOCKER_HOST_ADDRESS: 127.0.0.1
    ENABLE_JSON_LOGS: 'true'
    GF_SERVER_DOMAIN: part-int.ldttoolbox.app/analytics/grafana
    HELP_URL: https://interoperable-europe.ec.europa.eu/collection/ldttoolbox
    KEYCLOAK_DISABLE_SSL_VERIFY: 'false'
    MATOMO_SITE_ID: '1'
    MATOMO_SERVER_ADDRESS: https://part-int.ldttoolbox.app/analytics/matomo/
    MEETINGS_EMBEDDABLE_SERVICES: jitsi-part-int.ldttoolbox.app www.youtube.com www.twitch.tv meet.jit.si
    NODE_ENV: production
    OMNIAUTH_KEYCLOAK_CLIENT_ID: tool3
    OMNIAUTH_KEYCLOAK_REALM: LDT
    OMNIAUTH_KEYCLOAK_SITE: https://im-int.ldttoolbox.app/
    QUEUE_ADAPTER: sidekiq
    RAILS_LOG_LEVEL: info
    RAILS_LOG_TO_STDOUT: 'true'
    RAILS_ENV: production
    RAILS_ASSET_HOST: https://part-int.ldttoolbox.app
    REDIS_URL: redis://redis:6379/0
    RESTART_POLICY: unless-stopped
    SMTP_ADDRESS: smtp.gmail.com
    SMTP_AUTHENTICATION: plain
    SMTP_DOMAIN: gmail.com
    SMTP_ENABLE_STARTTLS_AUTO: 'true'
    SMTP_PORT: '587'
    SMTP_TLS: 'false'
    SMTP_USERNAME: ldt.test.smtp@gmail.com
    SMTP_OPEN_TIMEOUT: '120'
    SMTP_READ_TIMEOUT: '120'
    TOOL0_API_TOOLBAR_APPLICATIONS: /api/dashboard/applications/external-tools
    TOOL0_FULL_URL: https://ie-int.ldttoolbox.app/api/dashboard/applications/external-tools
    TOOL0_DOMAIN: https://ie-int.ldttoolbox.app
    TOOL2_EXPERIMENTS_URL: https://ucs-int.ldttoolbox.app/api/v1/experiments
    TOOL2_IFRAME_URL: https://ucs-int.ldttoolbox.app/embed/experiment-execution
    TOOL1_MAPS_URL: https://pv-int.ldttoolbox.app/api/maps
