  /api/v1/products:
    get:
      tags:
        - products
      description: Retrieve a products
      parameters:
        - schema:
            type: number
            nullable: true
            default: 0
          in: query
          name: page
          required: false
          description: "<b>Page number</b>: The <i>current</i> page number. Defaults to `0`"
        - schema:
            type: number
            nullable: true
            default: 10
          in: query
          name: size
          required: false
          description: <b>Page size</b>. Defaults to `10`
        - schema:
            anyOf:
              - type: array
                items:
                  type: string
                nullable: true
                default: []
              - type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                    query:
                      type: array
                      items:
                        type: string
                      nullable: true
                      default: []
                    not:
                      type: boolean
                      nullable: true
                      default: false
                  required:
                    - field
                  additionalProperties: false
            nullable: true
          in: query
          name: search
          required: false
          description: '<b>Search options:</b><ul>  <li>Example: <code>name::Tomas</code>,
            or [{ field: "name", query: ["Tomas"] }]</li>  <li>or
            <code>!name::Tomas</code>, or [{ field: "name", query: ["Tomas"],
            not: true }]</li></ul>'
        - schema:
            anyOf:
              - type: array
                items:
                  type: string
                nullable: true
                default: []
              - type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                    direction:
                      type: string
                      enum:
                        - ASC
                        - DESC
                  required:
                    - field
                    - direction
                  additionalProperties: false
            nullable: true
          in: query
          name: sort
          required: false
          description: '<b>Sorting options:</b><ul>  <li>Example: <code>name::ASC</code>,
            <code>age::DESC</code>, or [{ field: "id", direction: "ASC"
            }]</li></ul>'
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                      required:
                        - id
                        - name
                      additionalProperties: false
                  metadata:
                    type: object
                    properties:
                      total:
                        type: number
                      page:
                        type: number
                      size:
                        type: number
                      sort:
                        type: array
                        items:
                          type: object
                          properties:
                            field:
                              type: string
                            direction:
                              type: string
                              enum:
                                - DESC
                                - ASC
                          required:
                            - field
                            - direction
                          additionalProperties: false
                    required:
                      - total
                      - page
                      - size
                      - sort
                    additionalProperties: false
                required:
                  - content
                  - metadata
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                  error:
                    type: string
                  details:
                    type: array
                required:
                  - statusCode
                  - error
                additionalProperties: false
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                  error:
                    type: string
                  details:
                    type: array
                required:
                  - statusCode
                  - error
                additionalProperties: false
        "500":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                  error:
                    type: string
                  details:
                    type: array
                required:
