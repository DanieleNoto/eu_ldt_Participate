apiVersion: v1
kind: ConfigMap
metadata:
    name: grafana-config
data:
    # Use Postgres as Grafana storage backend
    GF_DATABASE_TYPE: '_%TOOL3_GRAFANA_GF_DATABASE_TYPE%_'
    GF_DATABASE_HOST: '_%TOOL3_GRAFANA_GF_DATABASE_HOST%_'
    GF_DATABASE_NAME: '_%TOOL3_GRAFANA_GF_DATABASE_NAME%_'
    GF_DATABASE_USER: '_%TOOL3_GRAFANA_GF_DATABASE_USER%_'
    # Password moved to Secret (grafana-secrets)
    GF_SERVER_ROOT_URL: '_%TOOL3_GRAFANA_GF_SERVER_ROOT_URL%_'
    GF_SERVER_DOMAIN: '_%TOOL3_GRAFANA_GF_SERVER_DOMAIN%_'
    GF_AUTH_GENERIC_OAUTH_ENABLED: '_%TOOL3_GRAFANA_GF_AUTH_GENERIC_OAUTH_ENABLED%_'
    GF_AUTH_GENERIC_OAUTH_NAME: '_%TOOL3_GRAFANA_GF_AUTH_GENERIC_OAUTH_NAME%_'
    GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: '_%TOOL3_GRAFANA_GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP%_'
    GF_AUTH_GENERIC_OAUTH_SCOPES: '_%TOOL3_GRAFANA_GF_AUTH_GENERIC_OAUTH_SCOPES%_'
    GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: '_%TOOL3_GRAFANA_GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH%_'
    GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: '_%TOOL3_GRAFANA_GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH%_'
    GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: '_%TOOL3_GRAFANA_GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH%_'
    GF_AUTH_GENERIC_OAUTH_AUTH_URL: '_%TOOL3_GRAFANA_GF_AUTH_GENERIC_OAUTH_AUTH_URL%_'
    GF_AUTH_GENERIC_OAUTH_TOKEN_URL: '_%TOOL3_GRAFANA_GF_AUTH_GENERIC_OAUTH_TOKEN_URL%_'
    GF_AUTH_GENERIC_OAUTH_API_URL: '_%TOOL3_GRAFANA_GF_AUTH_GENERIC_OAUTH_API_URL%_'
    GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: '_%TOOL3_GRAFANA_GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH%_'
    GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN: '_%TOOL3_GRAFANA_GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN%_'
    GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH: '_%TOOL3_GRAFANA_GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH%_'
    GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: '_%TOOL3_GRAFANA_GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN%_'
    GF_AUTH_GENERIC_OAUTH_SIGNOUT_REDIRECT_URL: '_%TOOL3_GRAFANA_GF_AUTH_GENERIC_OAUTH_SIGNOUT_REDIRECT_URL%_'
    GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: '_%TOOL3_GRAFANA_GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN%_'
