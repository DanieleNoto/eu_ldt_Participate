apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: matomo-subpath-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: "/$2"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      # Imposta gli header corretti per Matomo
      proxy_set_header X-Forwarded-Prefix /analytics/matomo;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      sub_filter 'href="/' 'href="/analytics/matomo/';
      sub_filter 'src="/' 'src="/analytics/matomo/';
      sub_filter 'action="/' 'action="/analytics/matomo/';
      sub_filter 'url":"/' 'url":"/analytics/matomo/';
      sub_filter_once off;
      sub_filter_types text/html text/css text/xml text/javascript application/javascript application/json;
spec:
  ingressClassName: nginx
  rules:
  - host: part-int.ldttoolbox.app
    http:
      paths:
      - path: /analytics/matomo(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: matomo
            port:
              number: 8081
