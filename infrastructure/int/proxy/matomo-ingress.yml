apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: matomo-subpath-ingress
    annotations:
        kubernetes.io/ingress.class: nginx
        nginx.ingress.kubernetes.io/ssl-redirect: 'false'
        nginx.ingress.kubernetes.io/proxy-connect-timeout: '300'
        nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
        nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
        nginx.ingress.kubernetes.io/use-regex: 'true'
        nginx.ingress.kubernetes.io/rewrite-target: '/$2'
        nginx.ingress.kubernetes.io/configuration-snippet: |
            # redirect /analytics/matomo to /analytics/matomo/
            if ($request_uri ~ ^/analytics/matomo$) {
              return 301 $scheme://$host$request_uri/;
            }
            proxy_set_header X-Forwarded-Prefix /analytics/matomo;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Uri /analytics/matomo;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
spec:
    ingressClassName: nginx
    rules:
        - host: _%PARTICIPATE-HOST%_
          http:
              paths:
                  - path: /analytics/matomo(/|$)(.*)
                    pathType: ImplementationSpecific
                    backend:
                        service:
                            name: matomo
                            port:
                                number: 8081
