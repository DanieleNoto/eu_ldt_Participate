name: Lot5RepoSync-Tool1
trigger:
  branches:
    include:
    - main
  tags:
    include:
    - '*'
variables:
- group: 'TOOL3 - PV - KV'
stages:
- stage: __default
  jobs:
  - job: MirrorRepoToLot5
    displayName: MirrorRepoToLot5
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      inputs:
        repository: self
        persistCredentials: true
    - task: CmdLine@2
      displayName: "Set Git Params"
    - task: swellaby.mirror-git-repository.mirror-git-repository-vsts-task.mirror-git-repository-vsts-task@1
      displayName: 'Mirror Git Repository'
      inputs:
        sourceGitRepositoryUri: 'https://EULDT-Toolbox@dev.azure.com/EULDT-Toolbox/EU%20LDT%20Participate/_git/EU%20LDT%20Participate'
        sourceGitRepositoryPersonalAccessToken: '$(PAT-LOT5-REPO-SYNC)'
        sourceGitRepositoryCloneDirectoryName: 'tmpDir'
        sourceVerifySSLCertificate: false
        destinationGitRepositoryUri: 'https://EULDT-Toolbox@dev.azure.com/EULDT-Toolbox/EU%20LDT%20Toolbox/_git/EU%20LDT%20Participate'
        destinationGitRepositoryPersonalAccessToken: '$(PAT-LOT5-REPO-SYNC)'
        destinationVerifySSLCertificate: false