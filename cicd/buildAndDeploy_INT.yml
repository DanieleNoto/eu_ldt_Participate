name: Tool3-Build&DeployINT-$(date:yyyyMMdd)$(rev:.r)

#trigger:
#- main
#pr:
#- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  tag: '$(Build.BuildId)'

jobs:
- job: buildAndPushDockerfileINT
  displayName: "Build Tool Images; Push to ACR; Deploy Tool - INTEGRATION"
  variables:
  - group: 'TOOL3 - PV - INT'
  - group: 'Tool 3 - Resources Configuration - INT'
  steps:
    - task: Docker@2
      displayName: Build and push backend
      inputs:
        command: buildAndPush
        repository: eu-ldt-pv-int
        dockerfile: backend/Dockerfile
        containerRegistry: EU-LDT-Toolbox-ACR-Shared
        tags: |
          be-$(tag)

    - task: Docker@2
      displayName: Build and push frontend
      inputs:
        command: buildAndPush
        repository: eu-ldt-pv-int
        dockerfile: frontend/Dockerfile
        containerRegistry: EU-LDT-Toolbox-ACR-Shared
        tags: |
          fe-$(tag)

- job: deploymentINT
  dependsOn: buildAndPushDockerfileINT
  displayName: "Kubectl Tool3 deployment - INTEGRATION"
  variables:
  - group: 'TOOL3 - PV - INT'
  - group: 'Tool 3 - Resources Configuration - INT'
  - group: 'Toolbox Shared Infrastructure - INTEGRATION'
  steps:
    - task: replacetokens@5
      displayName: "Replace tokens Tools"
      inputs:
        rootDirectory: infrastructure/int
        targetFiles: 'statefulSet.yml,configMap.yml,secretsMap.yml,tool1-fe-config-configmap.yaml'
        tokenPattern: custom
        tokenPrefix: _%
        tokenSuffix: '%_'
        writeBOM: false
        verbosity: detailed
        actionOnNoFiles: warn
    - task: KubectlInstaller@0
      displayName: "Kubectl Install"
      inputs:
        kubectlVersion: 'latest'
    - task: Kubernetes@1
      displayName: "Apply Namespaces (Tool3)"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared-INT'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/namespace.yml'
#    - task: Kubernetes@1
#      displayName: "Set ACR Pull Secret (Tool1)"
#      inputs:
#        connectionType: 'Azure Resource Manager'
#        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared-INT'
#        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
#        kubernetesCluster: 'eu-ldt-tool-01-participate-aks-int'
#        namespace: 'participate'
#        command: 'create'
#        arguments: secret docker-registry acr-secret --docker-server=euldtshared.azurecr.io --docker-username=$(TF-SP-CLIENT-ID) --docker-password=$(TF-SP-CLIENT-SECRET)
#        secretType: 'dockerRegistry'
#        containerRegistryType: 'Azure Container Registry'
#    - task: Kubernetes@1
#      displayName: "Set Shared Storage Secret (Tool1)"
#      inputs:
#        connectionType: 'Azure Resource Manager'
#        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared-INT'
#        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
#        kubernetesCluster: 'eu-ldt-tool-01-participate-aks-int'
#        namespace: 'participate'
#        command: 'create'
#        arguments: secret generic storage-secret --from-literal=azurestorageaccountname=euldtsharedtfstateint --from-literal=azurestorageaccountkey=$(STORAGE-ACCOUNT-KEY)
#        secretType: 'generic'
    - task: Kubernetes@1
      displayName: "Apply File Storage (Tool1)"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared-INT'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/storage/file-storage.yml'
    - task: Kubernetes@1
      displayName: "Apply ConfigMap (Tool3)"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared-INT'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/configMap.yml'
    - task: Kubernetes@1
      displayName: "Apply SecretsMap (Tool3)"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared-INT'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/secretsMap.yml'
    - task: Kubernetes@1
      displayName: "Apply Frontend ConfigMap (Tool3)"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared-INT'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/frontend.yml'
    - task: Kubernetes@1
      displayName: "Apply Deployment (Tool1)"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared-INT'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/statefulSet.yml'
    - task: Kubernetes@1
      displayName: "Apply Service (Tool3)"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared-INT'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/service.yml'
    - task: Kubernetes@1
      displayName: "Apply Ingress (Tool3)"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared-INT'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/proxy/ingress.yml'