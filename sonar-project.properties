# Root project information
sonar.projectKey=#TBD
sonar.host.url=https://sq-int.ldttoolbox.app/

# Monorepo configuration
sonar.projectBaseDir=.
sonar.sources=frontend/, backend/, decidim/
sonar.tests=tests/, backend/tests/, frontend/src/tests/
sonar.exclusions=**/node_modules/**, **/dist/**, **/public/**,  **/coverage/**, **/tests/**, **/*.config.*, backend/src/assets/**, backend/db/**

## Report configurations
#sonar.testExecutionReportPaths=reports/*.junit.xml
sonar.junit.reportPaths=test-results/backend/junit.xml,test-results/frontend/junit.xml
sonar.javascript.lcov.reportPaths=coverage/backend/lcov.info,coverage/frontend/lcov.info
