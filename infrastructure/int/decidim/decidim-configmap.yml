apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    io.kompose.service: db-home-adminlnx-temp1-env
  name: decidim-configmap
data:
    DATABASE_HOST: db
    DATABASE_NAME: decidim_application_development
    # DATABASE_USERNAME: postgres
    DECIDIM_FORCE_SSL: 'true'
    DECIDIM_FOLLOW_HTTP_X_FORWARDED_HOST: 'true'
    DECIDIM_HOST: part-int.ldttoolbox.app
    DECIDIM_MAILER_SENDER: info@ldttoolbox.eu
    DECIDIM_PROTOCOL: https
    DECIDIM_ENABLE_HTML_HEADER_SNIPPETS: 'true'
    DOCKER_HOST_ADDRESS: 127.0.0.1
    KEYCLOAK_DISABLE_SSL_VERIFY: 'false'
    NODE_ENV: production
    OMNIAUTH_KEYCLOAK_CLIENT_ID: tool3
    OMNIAUTH_KEYCLOAK_REALM: LDT
    OMNIAUTH_KEYCLOAK_SITE: https://im-int.ldttoolbox.app/
    QUEUE_ADAPTER: sidekiq
    RAILS_LOG_LEVEL: debug
    RAILS_LOG_TO_STDOUT: 'true'
    RAILS_ENV: production
    REDIS_URL: redis://redis:6379/0
    RESTART_POLICY: unless-stopped
    SMTP_ADDRESS: ssl0.ovh.net
    SMTP_AUTHENTICATION: login
    SMTP_DOMAIN: part-int.ldttoolbox.app
    SMTP_STARTTLS_AUTO: 'false'
    SMTP_PORT: '465'
    SMTP_USERNAME: info@ldttoolbox.eu
    TOOL0_API_TOOLBAR_APPLICATIONS: /api/dashboard/applications/external-tools
    TOOL0_FULL_URL: https://ie-int.ldttoolbox.app/api/dashboard/applications/external-tools
    TOOL0_DOMAIN: https://ie-int.ldttoolbox.app
    TOOL0_TENANT_ID: a6b3523b-b882-4a10-82d9-0db4dbe12f8e
