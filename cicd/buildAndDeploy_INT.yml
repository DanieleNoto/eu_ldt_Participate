name: Tool3-BuildAndDeploy-INT-$(date:yyyyMMdd)$(rev:.r)

#resources:
#  pipelines:
#    - pipeline: QualityCheck
#      source: 'EU LDT Participate - Quality Checks'
#      trigger: true

trigger: none

pool:
    vmImage: 'ubuntu-latest'

variables:
    - group: 'Tool 3 - Tool parameters - INT'
    - group: 'Tool 3 - Resources Configuration - INT'
    - group: 'Toolbox Shared Infrastructure - INTEGRATION'
    - group: 'TOOL3 - PT'
    - group: 'TOOL3 - PT - KV'

jobs:
    - job: buildAndPushDockerfile
      displayName: 'Build and Push Docker Images'
      variables:
          tag: '$(Build.BuildId)'
      steps:
          - task: replacetokens@5
            displayName: 'Replace tokens Decidim'
            inputs:
                rootDirectory: decidim
                targetFiles: Dockerfile*
                tokenPattern: custom
                tokenPrefix: _TOKEN_
                tokenSuffix: _TOKEN_
                writeBOM: false
                verbosity: detailed
                actionOnNoFiles: warn

          # Recreate ACR pull secret
          - task: Kubernetes@1
            displayName: 'Delete ACR Pull Secret if exists (Tool3)'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'delete'
                arguments: secret acr-secret --ignore-not-found=true

          - task: Kubernetes@1
            displayName: 'Set ACR Pull Secret (Tool3)'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'create'
                arguments: secret docker-registry acr-secret --docker-server=euldtshared.azurecr.io --docker-username=f703f14b-9128-4eb8-b78b-a819d3e66d32 --docker-password=y_LusONCFAN7Az6SI7lHCq4S0YwqZzV3t-
                secretType: 'dockerRegistry'
                containerRegistryType: 'Azure Container Registry'

          - task: Docker@2
            displayName: Build and push decidim
            inputs:
                command: buildAndPush
                repository: eu-ldt-part-int
                dockerfile: decidim/decidim_application/Dockerfile
                containerRegistry: EU-LDT-Toolbox-ACR-Shared-INT
                tags: |
                    $(tag)

    - job: deployment
      dependsOn: buildAndPushDockerfile
      displayName: 'Deploy to Kubernetes'
      steps:
          - task: replacetokens@5
            displayName: 'Replace tokens Tools'
            inputs:
                rootDirectory: infrastructure/int
                tokenPattern: custom
                tokenPrefix: _%
                tokenSuffix: '%_'
                writeBOM: false
                verbosity: detailed
                actionOnNoFiles: warn

          - task: KubectlInstaller@0
            displayName: 'Kubectl Install'
            inputs:
                kubectlVersion: 'latest'

          # Base Infrastructure
          - task: Kubernetes@1
            displayName: 'Apply Namespaces'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'apply'
                arguments: '-f infrastructure/int/namespace.yml'

          # ACR Pull Secret
          - task: Kubernetes@1
            displayName: 'Delete ACR Pull Secret if exists'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'delete'
                arguments: secret acr-secret --ignore-not-found=true

          - task: Kubernetes@1
            displayName: 'Set ACR Pull Secret'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'create'
                arguments: secret docker-registry acr-secret --docker-server=euldtshared.azurecr.io --docker-username=f703f14b-9128-4eb8-b78b-a819d3e66d32 --docker-password=y_LusONCFAN7Az6SI7lHCq4S0YwqZzV3t-
                secretType: 'dockerRegistry'
                containerRegistryType: 'Azure Container Registry'

          # Shared Storage Secret
          - task: Kubernetes@1
            displayName: 'Delete existing storage-secret if it exists'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'delete'
                arguments: secret storage-secret --ignore-not-found=true

          - task: Kubernetes@1
            displayName: 'Create Shared Storage Secret'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'create'
                arguments: secret generic storage-secret --from-literal=azurestorageaccountname=euldtsharedtfstateint --from-literal=azurestorageaccountkey=$(STORAGE-ACCOUNT-KEY)
                secretType: 'generic'

          # Database Setup
          - task: Kubernetes@1
            displayName: 'DB - Apply Service'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'apply'
                arguments: '-f infrastructure/int/decidim/db/postgres-service.yml'

          - task: Kubernetes@1
            displayName: 'DB - Apply StatefulSet'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'apply'
                arguments: '-f infrastructure/int/decidim/db/postgres-statefulset.yml'

          # Redis Setup
          - task: Kubernetes@1
            displayName: 'REDIS - Apply Service'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'apply'
                arguments: '-f infrastructure/int/decidim/redis/redis-service.yml'

          - task: Kubernetes@1
            displayName: 'REDIS - Apply Deployment'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'apply'
                arguments: '-f infrastructure/int/decidim/redis/redis-deployment.yml'

          # Jitsi Setup
          - task: Kubernetes@1
            displayName: 'JITSI - Apply ConfigMaps and Secrets'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'apply'
                arguments: '-f infrastructure/int/jitsi/jitsi-configmap.yml -f infrastructure/int/jitsi/jitsi-secrets.yml'

          - task: Kubernetes@1
            displayName: 'JITSI-PROSODY - Apply Deployment'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'apply'
                arguments: '-f infrastructure/int/jitsi/jitsi-prosody-deployment.yml'

          - task: Kubernetes@1
            displayName: 'JITSI-JICOFO - Apply Deployment'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'apply'
                arguments: '-f infrastructure/int/jitsi/jitsi-jicofo-deployment.yml'

          - task: Kubernetes@1
            displayName: 'JITSI-JVB - Apply Deployment'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'apply'
                arguments: '-f infrastructure/int/jitsi/jitsi-jvb-deployment.yml'

          - task: Kubernetes@1
            displayName: 'JITSI-WEB - Apply Deployment'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'apply'
                arguments: '-f infrastructure/int/jitsi/jitsi-web-deployment.yml'

          - task: Kubernetes@1
            displayName: 'JITSI - Apply Services'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'apply'
                arguments: '-f infrastructure/int/jitsi/jitsi-web-service.yml -f infrastructure/int/jitsi/jitsi-jvb-service.yml -f infrastructure/int/jitsi/jitsi-prosody-service.yml'

          # Analytics Setup
          - task: Kubernetes@1
            displayName: 'ANALYTICS - Apply ConfigMaps and Secrets'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'apply'
                arguments: '-f infrastructure/int/analytics/grafana/grafana-configmap.yml -f infrastructure/int/analytics/grafana/grafana-secret.yml -f infrastructure/int/analytics/matomo/matomo-configmap.yml -f infrastructure/int/analytics/matomo/matomo-secret.yml'

          # Matomo DB Component
          - task: Kubernetes@1
            displayName: 'MATOMO DB - Apply Deployment'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'apply'
                arguments: '-f infrastructure/int/analytics/matomo/matomo-db-deployment.yml'

          # Matomo Component
          - task: Kubernetes@1
            displayName: 'MATOMO - Apply Deployment'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'apply'
                arguments: '-f infrastructure/int/analytics/matomo/matomo-deployment.yml'

          - task: Kubernetes@1
            displayName: 'MATOMO - Apply Service'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'apply'
                arguments: '-f infrastructure/int/analytics/matomo/matomo-service.yml'

          # Grafana Component
          - task: Kubernetes@1
            displayName: 'GRAFANA - Apply Deployment'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'apply'
                arguments: '-f infrastructure/int/analytics/grafana/grafana-deployment.yml'

          - task: Kubernetes@1
            displayName: 'GRAFANA - Apply Service'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'apply'
                arguments: '-f infrastructure/int/analytics/grafana/grafana-service.yml'

          # Decidim Application Setup
          - task: Kubernetes@1
            displayName: 'Decidim - Apply ConfigMap'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'apply'
                arguments: '-f infrastructure/int/decidim/decidim-configmap.yml'

          - task: Kubernetes@1
            displayName: 'Decidim - Apply Secrets'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'apply'
                arguments: '-f infrastructure/int/decidim/decidim-secrets.yml'

          - task: Kubernetes@1
            displayName: 'Decidim - Apply Deployment'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'apply'
                arguments: '-f infrastructure/int/decidim/decidim-deployment.yml'

          - task: Kubernetes@1
            displayName: 'Decidim - Apply Service'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'apply'
                arguments: '-f infrastructure/int/decidim/decidim-service.yml'

          # Apply Ingress for routing (last step)
          - task: Kubernetes@1
            displayName: 'Apply Ingress'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'apply'
                arguments: '-f infrastructure/int/proxy/ingress.yml'
