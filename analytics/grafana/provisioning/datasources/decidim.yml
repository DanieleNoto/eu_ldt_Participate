apiVersion: 1

datasources:
  - name: Decidim PostgreSQL
    type: postgres
    access: proxy
    url: ${DATABASE_HOST}:5432
    database: ${DATABASE_NAME}
    user: ${DATABASE_USERNAME}
    secureJsonData:
      password: ${DATABASE_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    uid: decidim_postgres
    editable: true
