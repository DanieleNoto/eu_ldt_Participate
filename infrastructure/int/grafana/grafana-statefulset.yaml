apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    kompose.cmd: /home/adminlnx/.config/Code/User/globalStorage/othy1010.kompose/kompose convert --out=/home/adminlnx/TEMP1 --file=/home/adminlnx/TEMP1/docker-compose.yml
    kompose.version: 1.21.0 (992df58d8)
  labels:
    io.kompose.service: grafana
  name: grafana
spec:
  serviceName: grafana
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: grafana
  template:
    metadata:
      labels:
        io.kompose.network/temp1-private: "true"
        io.kompose.service: grafana
    spec:
      securityContext:
        runAsUser: 472   # UID del usuario Grafana
        runAsGroup: 472  # GID del usuario Grafana
        fsGroup: 472     # Grupo para los volumenes montados
      containers:
        - name: grafana
          image: grafana/grafana:11.0.0
          ports:
            - containerPort: 3000
              hostPort: 3001
              protocol: TCP
          env:
            - name: CONFIG
              valueFrom:
                configMapKeyRef:
                  key: CONFIG
                  name: home-adminlnx-temp1-env
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  key: DATABASE_HOST
                  name: home-adminlnx-temp1-env
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  key: DATABASE_NAME
                  name: home-adminlnx-temp1-env
            - name: DATABASE_PASSWORD
              valueFrom:
                configMapKeyRef:
                  key: DATABASE_PASSWORD
                  name: home-adminlnx-temp1-env
            - name: DATABASE_USERNAME
              valueFrom:
                configMapKeyRef:
                  key: DATABASE_USERNAME
                  name: home-adminlnx-temp1-env
            # ⚠️ ... Aquí mantienes todas las demás variables tal cual estaban ...
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: grafana-claim1
              mountPath: /etc/grafana/provisioning
            - name: grafana-claim2
              mountPath: /etc/grafana/provisioning/dashboards
      restartPolicy: Always
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: grafana-claim1
          persistentVolumeClaim:
            claimName: grafana-claim1
        - name: grafana-claim2
          persistentVolumeClaim:
            claimName: grafana-claim2
