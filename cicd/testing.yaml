name: Tool3-Testing-DEV-$(date:yyyyMMdd)$(rev:.r)
pool:
    vmImage: 'ubuntu-latest'

trigger:
    - main

variables:
    - group: 'TOOL3 - PT'
    - group: 'TOOL3 - PT - KV'
    - group: 'TOOL3 - PT - PERFORMANCE TESTS'
    - name: isMain
      value: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]

jobs:
    - job: PlaywrightAxeFrontend
      timeoutInMinutes: 120
      displayName: 'Install and Run Playwright / Axe (Frontend) & Publish Results'
      steps:
          - task: replacetokens@5
            displayName: 'Replace tokens Playwright'
            inputs:
                rootDirectory: tests/acceptance/e2e
                targetFiles: .env.ci
                tokenPattern: custom
                tokenPrefix: _%
                tokenSuffix: '%_'
                writeBOM: false
                verbosity: detailed
                actionOnNoFiles: warn
          - task: NodeTool@0
            inputs:
                versionSource: 'fromFile'
                versionFilePath: '.nvmrc'
          - task: Cache@2
            inputs:
                key: 'npm-pw | "$(Agent.OS)" | tests/acceptance/e2e/package-lock.json'
                restoreKeys: |
                    npm-pw | "$(Agent.OS)"
                path: tests/acceptance/e2e/node_modules
            displayName: 'Cache npm modules (Playwright)'
          - script: |
                cd tests/acceptance/e2e
                npm ci
                npx playwright install --with-deps
                npm install @axe-core/playwright axe-sarif-converter
            displayName: 'Install Playwright / Axe (Frontend)'
          - script: |
                cd tests/acceptance/e2e
                rm -rf a11y-reports
                echo "Old accessibility reports removed"
            displayName: 'Clean previous accessibility reports'

          # Setup authentication for all parallel workers
          - script: |
                cd tests/acceptance/e2e
                npm run test:parallel:setup
            env:
                CI: 'true'
            displayName: 'Setup Parallel Authentication (10 workers + reserved)'

          # Run tests in parallel with 10 workers (excludes @reserved tests)
          - script: |
                cd tests/acceptance/e2e
                PLAYWRIGHT_HTML_REPORT=playwright-report-parallel npm run test:parallel
            env:
                CI: 'true'
            continueOnError: true
            displayName: 'Run Playwright / Axe (Frontend) - Parallel (10 workers)'

          # Run @reserved tests with fixed users (sequential, after parallel tests)
          - script: |
                cd tests/acceptance/e2e
                PLAYWRIGHT_HTML_REPORT=playwright-report-reserved npm run test:reserved
            env:
                CI: 'true'
            continueOnError: true
            displayName: 'Run Playwright / Axe (Frontend) - @reserved Tests (sequential)'

          - script: |
                cd tests/acceptance/e2e
                PLAYWRIGHT_HTML_REPORT=playwright-report-keycloak npm run test:keycloak
            env:
                CI: 'true'
            continueOnError: true
            displayName: 'Run Playwright / Axe (Frontend) - Keycloak tests only'

          # Publish JUnit results (pass/fail)
          - task: PublishTestResults@2
            displayName: 'Publish Playwright / Axe Test Results (Frontend)'
            inputs:
                testResultsFormat: 'JUnit'
                testResultsFiles: '**/*junit.xml'
                testRunTitle: 'Playwright + Axe'
            condition: succeededOrFailed()

          # Publish HTML reports as artifacts
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Playwright HTML Reports'
            inputs:
                PathtoPublish: 'tests/acceptance/e2e'
                ArtifactName: 'Playwright-HTML-Reports'
                publishLocation: 'Container'
                # Include only the report folders
            condition: succeededOrFailed()
            continueOnError: true

          # Publish WCAG reports (JSON artifacts)
          - task: PublishBuildArtifacts@1
            displayName: 'Publish Accessibility Reports (WCAG Compliance)'
            inputs:
                PathtoPublish: 'tests/acceptance/e2e/a11y-reports'
                ArtifactName: 'WCAG-AccessibilityReports'
                publishLocation: 'Container'
            condition: succeededOrFailed()

          # Convert JSON to SARIF format
          - script: |
                cd tests/acceptance/e2e/a11y-reports
                for file in *__latest.json; do
                  if [ -f "$file" ]; then
                    npx axe-sarif-converter "$file" "${file%.json}.sarif"
                  fi
                done
                echo "JSON files converted to SARIF format"
            displayName: 'Convert Accessibility Reports to SARIF format'
            condition: succeededOrFailed()
            continueOnError: true

          # Publish SARIF for integrated visualization in Azure DevOps Scans tab
          - task: PublishBuildArtifacts@1
            displayName: 'Publish SARIF Accessibility Reports to Scans'
            inputs:
                PathtoPublish: 'tests/acceptance/e2e/a11y-reports'
                ArtifactName: 'CodeAnalysisLogs'
                publishLocation: 'Container'
            condition: succeededOrFailed()
            continueOnError: true

          # Generate WCAG 2.0/2.1 AA violations report
          - script: |
                cd tests/acceptance/e2e/scripts
                python3 generate_wcag_report.py
            displayName: 'Generate WCAG 2.0/2.1 AA Violations Report'
            condition: succeededOrFailed()
            continueOnError: true

          # Publish WCAG violations report as artifact
          - task: PublishBuildArtifacts@1
            displayName: 'Publish WCAG Violations Report'
            inputs:
                PathtoPublish: 'tests/acceptance/e2e/a11y-reports/WCAG_2.0_2.1_AA_VIOLATIONS_REPORT.txt'
                ArtifactName: 'WCAG-ViolationsReport'
                publishLocation: 'Container'
            condition: succeededOrFailed()
            continueOnError: true

    - job: PerformanceTests
      timeoutInMinutes: 120
      displayName: Service Load Test
      steps:
          - task: replacetokens@5
            displayName: 'Replace tokens Locust config'
            inputs:
                rootDirectory: tests/performance/
                targetFiles: locust_config.json
                tokenPattern: custom
                tokenPrefix: _%
                tokenSuffix: '%_'
                writeBOM: false
                verbosity: detailed
                actionOnNoFiles: warn
          - task: UsePythonVersion@0
            inputs:
                versionSpec: '3.12'
                addToPath: true
                architecture: 'x64'
            displayName: 'Install Python'

          - script: |
                pip install -r ./tests/requirements-dev.txt
                pip install locust==2.33.0
            displayName: 'Install locust dependencies'

          - script: |
                mkdir -p tests/performance/results
            displayName: 'Create results directory'

          - script: |
                cd tests/performance
                locust --config locust.conf
            displayName: 'Run load test'

          - task: PublishPipelineArtifact@1
            inputs:
                targetPath: 'tests/performance/results/locust_results_file.html'
                artifactName: 'LocustResults'
            condition: succeededOrFailed()
            displayName: 'Save results'
