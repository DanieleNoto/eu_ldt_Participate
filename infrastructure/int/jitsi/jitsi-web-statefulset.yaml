apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: jitsi-web
    labels:
        io.kompose.service: jitsi-web
spec:
    serviceName: jitsi-web
    replicas: 1
    selector:
        matchLabels:
            io.kompose.service: jitsi-web
    template:
        metadata:
            labels:
                io.kompose.service: jitsi-web
                io.kompose.network/temp1-private: 'true'
        spec:
            automountServiceAccountToken: false
            containers:
                - name: jitsi-web
                  image: jitsi/web:stable-8960
                  resources:
                      requests:
                          memory: '128Mi'
                          cpu: '100m'
                          ephemeral-storage: '512Mi'
                      limits:
                          memory: '256Mi'
                          cpu: '250m'
                          ephemeral-storage: '1Gi'
                  ports:
                      - containerPort: 80
                        protocol: TCP
                      - containerPort: 443
                        protocol: TCP
                  volumeMounts:
                      - mountPath: /config
                        name: jitsi-web-claim0
                      - name: nginx-config
                        mountPath: /config/nginx/meet.conf
                        subPath: meet.conf
                      - name: config-js
                        mountPath: /config/web/config.js
                        subPath: config.js
                  envFrom:
                      - configMapRef:
                            name: jitsi-config
                      - secretRef:
                            name: jitsi-secret
            volumes:
                - name: nginx-config
                  configMap:
                      name: jitsi-config
                      items:
                        - key: meet.conf
                          path: meet.conf
                - name: config-js
                  configMap:
                      name: jitsi-config
                      items:
                        - key: config.js
                          path: config.js
    volumeClaimTemplates:
        - metadata:
              name: jitsi-web-claim0
          spec:
              accessModes: ['ReadWriteOnce']
              resources:
                  requests:
                      storage: 50Mi
