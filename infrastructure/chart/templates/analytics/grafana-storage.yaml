apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: grafana-data
    namespace: {{ include "eu-ldt-participate.namespace" . }}
    labels:
        io.kompose.service: grafana-data
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 1Gi
    storageClassName: default
