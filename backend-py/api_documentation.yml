components:
  schemas:
    AuthTokenRequest:
      properties:
        client_id:
          description: The client identifier
          title: Client Id
          type: string
        client_secret:
          description: The secret associated with the client
          title: Client Secret
          type: string
        grant_type:
          description: The grant type used for authentication
          title: Grant Type
          type: string
        scope:
          description: The scope of the requested token
          title: Scope
          type: string
      required:
      - client_id
      - grant_type
      - client_secret
      - scope
      title: AuthTokenRequest
      type: object
    Body_login_for_access_token_api_v1_token_post:
      properties:
        password:
          title: Password
          type: string
        username:
          title: Username
          type: string
      required:
      - username
      - password
      title: Body_login_for_access_token_api_v1_token_post
      type: object
    DataSourceAddDTO:
      properties:
        connection_string:
          title: Connection String
          type: string
        name:
          title: Name
          type: string
        password:
          title: Password
          type: string
        type:
          title: Type
          type: string
        user:
          title: User
          type: string
      required:
      - name
      - connection_string
      - user
      - password
      - type
      title: DataSourceAddDTO
      type: object
    DataSourceDTO:
      properties:
        connection_string:
          title: Connection String
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          title: Id
          type: integer
        is_deleted:
          title: Is Deleted
          type: boolean
        is_hidden:
          title: Is Hidden
          type: boolean
        name:
          title: Name
          type: string
        password:
          title: Password
          type: string
        type:
          title: Type
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        user:
          title: User
          type: string
      required:
      - name
      - connection_string
      - user
      - password
      - id
      - type
      - created_at
      - updated_at
      - is_deleted
      - is_hidden
      title: DataSourceDTO
      type: object
    DataSourceEditDTO:
      properties:
        connection_string:
          title: Connection String
          type: string
        name:
          title: Name
          type: string
        password:
          title: Password
          type: string
        user:
          title: User
          type: string
      required:
      - name
      - connection_string
      - user
      - password
      title: DataSourceEditDTO
      type: object
    EntityDTO:
      additionalProperties: true
      properties:
        id:
          title: Id
          type: string
        name:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Name
        type:
          title: Type
          type: string
      required:
      - id
      - type
      title: EntityDTO
      type: object
    EntityTypeListResponse:
      properties:
        id:
          title: Id
          type: string
        type:
          title: Type
          type: string
        typeList:
          items:
            type: string
          title: Typelist
          type: array
      required:
      - id
      - type
      - typeList
      title: EntityTypeListResponse
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    Role:
      properties:
        role_name:
          title: Role Name
          type: string
        state:
          title: State
          type: boolean
      required:
      - role_name
      - state
      title: Role
      type: object
    TenantsResponse:
      properties:
        tenants:
          items:
            type: string
          title: Tenants
          type: array
      required:
      - tenants
      title: TenantsResponse
      type: object
    Token:
      properties:
        access_token:
          title: Access Token
          type: string
        token_type:
          title: Token Type
          type: string
      required:
      - access_token
      - token_type
      title: Token
      type: object
    UserRolesRequest:
      properties:
        roles:
          items:
            $ref: '#/components/schemas/Role'
          title: Roles
          type: array
        user_id:
          title: User Id
          type: string
      required:
      - user_id
      - roles
      title: UserRolesRequest
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
  securitySchemes:
    HTTPBearer:
      scheme: bearer
      type: http
info:
  description: The EU LDT Data Platform is a comprehensive solution designed to manage,
    integrate, and analyse contextual data across municipalities, enabling seamless
    connectivity between diverse data sources and systems. This platform serves as
    the backbone for data storage, ingestion, and processing, ensuring that information
    is accessible, standardized, and ready to be utilized in various applications
    such as decision-making, simulation, monitoring, and visualization. By leveraging
    cutting-edge technologies and adhering to NGSI-LD standards, the EU LDT Data Platform
    empowers stakeholders to efficiently handle the complexity of modern data ecosystems.
  title: EU LDT Data Platform API
  version: '1.0'
openapi: 3.0.2
