apiVersion: apps/v1
kind: Deployment
metadata:
    name: matomo-db
spec:
    replicas: 1
    selector:
        matchLabels:
            app: matomo-db
    template:
        metadata:
            labels:
                app: matomo-db
        spec:
            containers:
                - name: mariadb
                  image: mariadb:11
                  env:
                      - name: MYSQL_ROOT_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: matomo-secrets
                                key: MATOMO_DATABASE_PASSWORD
                      - name: MYSQL_DATABASE
                        valueFrom:
                            configMapKeyRef:
                                name: matomo-config
                                key: MATOMO_DATABASE_DBNAME
                      - name: MYSQL_USER
                        valueFrom:
                            secretKeyRef:
                                name: matomo-secrets
                                key: MATOMO_DATABASE_USERNAME
                      - name: MYSQL_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: matomo-secrets
                                key: MATOMO_DATABASE_PASSWORD
                  volumeMounts:
                      - name: matomo-db-data
                        mountPath: /var/lib/mysql
            volumes:
                - name: matomo-db-data
                  persistentVolumeClaim:
                      claimName: matomo-db-pvc
