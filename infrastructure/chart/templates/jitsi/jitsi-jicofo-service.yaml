{{- if .Values.jitsi.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: jitsi-jicofo
  namespace: {{ include "eu-ldt-participate.namespace" . }}
  labels:
    io.kompose.service: jitsi-jicofo
spec:
  selector:
    app: jitsi-jicofo
  ports:
    - name: xmpp
      port: 8888
      targetPort: 8888
      protocol: TCP
  type: ClusterIP
{{- end }}
