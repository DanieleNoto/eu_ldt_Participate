apiVersion: v1
kind: Service
metadata:
  name: tool3-pg
spec:
  type: NodePort
  selector:
    app: tool3
  ports:
    - name: "pgsql"
      protocol: TCP
      port: 5432
      targetPort: 5432
      nodePort: 30002
---
apiVersion: v1
kind: Service
metadata:
  name: tool3
spec:
  type: ClusterIP
  ports:
  - targetPort: 3000
    port: 3000  
  selector:
    app: tool3
---
apiVersion: v1
kind: Service
metadata:
  name: tool3-fe
spec:
  type: ClusterIP
  ports:
  - targetPort: 8081
    port: 8081   
  selector:
    app: tool3