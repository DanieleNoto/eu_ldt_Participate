                configMapKeyRef:
                  key: CONFIG
                  name: home-adminlnx-temp1-env
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  key: DATABASE_HOST
                  name: home-adminlnx-temp1-env
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  key: DATABASE_NAME
                  name: home-adminlnx-temp1-env
            - name: DATABASE_PASSWORD
              valueFrom:
                configMapKeyRef:
                  key: DATABASE_PASSWORD
                  name: home-adminlnx-temp1-env
            - name: DATABASE_USERNAME
              valueFrom:
