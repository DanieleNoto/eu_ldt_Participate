apiVersion: v1
kind: Secret
metadata:
    name: decidim-secrets
type: Opaque
stringData:
    # Database credentials (sensitive)
    DATABASE_PASSWORD: 'postgres'

    # Full database URL for production environment. Using the same DB user/password
    # and host defined in the ConfigMap (decidim-postgres service).
    DATABASE_URL: 'postgres://postgres:postgres@decidim-postgres:5432/decidim_application_development'

    # Rails secret
    SECRET_KEY_BASE: 'insecure_key_base'

    # Omniauth / Keycloak secret
    OMNIAUTH_KEYCLOAK_CLIENT_SECRET: 'zy4P2MrxfpPSQjqP2FlFqIsoPM4Ar9n1'

    # SMTP credentials
    SMTP_USER_NAME: 'your_smtp_username'
    SMTP_PASSWORD: 'your_smtp_password'
