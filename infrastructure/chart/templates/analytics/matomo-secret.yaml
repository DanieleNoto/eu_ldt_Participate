apiVersion: v1
kind: Secret
metadata:
    name: matomo-secrets
    namespace: {{ include "eu-ldt-participate.namespace" . }}
type: Opaque
stringData:
    MATOMO_DATABASE_USERNAME: {{ .Values.matomo.db.username }}
    MYSQL_USER: {{ .Values.matomo.db.username }}
    MATOMO_DATABASE_PASSWORD: {{ .Values.matomo.db.password }}
    MYSQL_ROOT_PASSWORD: {{ .Values.matomo.db.rootPassword }}
    MYSQL_PASSWORD: {{ .Values.matomo.db.password }}
