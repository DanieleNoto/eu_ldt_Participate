apiVersion: v1
kind: ConfigMap
metadata:
  name: tool3-config
data:
  postgres_user: _%TOOL3-PG-USER%_
  postgres_schema: _%TOOL3-PG-SCHEME%_
  postgres_dialect: _%TOOL3-PG-DIALECT%_
  postgres_port: ${TOOL3_PG_SERVICE_PORT}
  postgres_migrate: _%TOOL3-PG-MIGRATE%_
  postgres_host: tool3-0
  postgres_password: _%TOOL3-PG-PASSWORD%_
  vite_api_url: 'https://ie-int.ldttoolbox.app/api'
  host: 'ie-int.ldttoolbox.app'
  bootstrap_api_key: _%BOOTSTRAP_API_KEY%_
  client_secret_encryption_key : _%CLIENT_SECRET_ENCRYPTION_KEY%_