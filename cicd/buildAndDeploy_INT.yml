        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'   
        command: 'apply'
        arguments: '-f infrastructure/int/frontend/service.yml'

#-------------------------------------------------------------------------------------------------  
    - task: Kubernetes@1
      displayName: "Apply Ingress (Tool3)"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/proxy/ingress.yml'

#-------------------------------------------------------------------------------------------------
# DECIDIM APPLICATION DEPLOYMENT
#-------------------------------------------------------------------------------------------------
    - task: Kubernetes@1
      displayName: "Apply Decidim ConfigMap"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/decidim/decidim-configmap.yml'

    - task: Kubernetes@1
      displayName: "Apply Decidim Secrets"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/decidim/decidim-secrets.yml'

    - task: Kubernetes@1
      displayName: "Apply Decidim PVCs"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/decidim/bundle-cache-pvc.yml -f infrastructure/int/decidim/node-modules-pvc.yml -f infrastructure/int/decidim/vendor-bundle-pvc.yml'

    - task: Kubernetes@1
      displayName: "Apply PostgreSQL Database"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/decidim/db/postgres-service.yml -f infrastructure/int/decidim/db/postgres-statefulset.yml'

    - script: |
        echo "Waiting for PostgreSQL statefulset to be ready..."
        kubectl rollout status statefulset/decidim-postgres -n participate --timeout=10m
      displayName: "Wait for Postgres to be Ready"
      env:
        KUBECONFIG: $(KUBECONFIG)

    - task: Kubernetes@1
      displayName: "Apply Redis Cache"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/decidim/redis/redis-pvc.yml -f infrastructure/int/decidim/redis/redis-service.yml -f infrastructure/int/decidim/redis/redis-deployment.yml'

    - script: |
        echo "Waiting for Redis deployment to be ready..."
        kubectl rollout status deployment/decidim-redis -n participate --timeout=5m
      displayName: "Wait for Redis to be Ready"
      env:
        KUBECONFIG: $(KUBECONFIG)

    - task: Kubernetes@1
      displayName: "Apply Decidim Application"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/decidim/decidim-service.yml -f infrastructure/int/decidim/decidim-deployment.yml'

    - script: |
        echo "Waiting for Decidim deployment to be ready..."
        kubectl rollout status deployment/decidim -n participate --timeout=10m
      displayName: "Wait for Decidim App to be Ready"
      env:
        KUBECONFIG: $(KUBECONFIG)

#-------------------------------------------------------------------------------------------------
# JITSI MEET DEPLOYMENT
#-------------------------------------------------------------------------------------------------
    - task: Kubernetes@1
      displayName: "Apply Jitsi ConfigMap and Secrets"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/jitsi/jitsi-configmap.yml -f infrastructure/int/jitsi/jitsi-secrets.yml'

    - task: Kubernetes@1
      displayName: "Apply Jitsi PVCs"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/jitsi/jitsi-pvc.yml'

    - task: Kubernetes@1
      displayName: "Apply Jitsi Prosody (XMPP)"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/jitsi/jitsi-prosody-deployment.yml -f infrastructure/int/jitsi/jitsi-prosody-service.yml'

    - script: |
        echo "Waiting for Jitsi Prosody to be ready..."
        kubectl rollout status deployment/jitsi-prosody -n participate --timeout=5m
      displayName: "Wait for Jitsi Prosody"
      env:
        KUBECONFIG: $(KUBECONFIG)

    - task: Kubernetes@1
      displayName: "Apply Jitsi Components"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/jitsi/jitsi-jicofo-deployment.yml -f infrastructure/int/jitsi/jitsi-jvb-deployment.yml -f infrastructure/int/jitsi/jitsi-jvb-service.yml'

    - script: |
        echo "Waiting for Jitsi JVB to be ready..."
        kubectl rollout status deployment/jitsi-jvb -n participate --timeout=5m
      displayName: "Wait for Jitsi JVB"
      env:
        KUBECONFIG: $(KUBECONFIG)

    - task: Kubernetes@1
      displayName: "Apply Jitsi Web and Ingress"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/jitsi/jitsi-web-deployment.yml -f infrastructure/int/jitsi/jitsi-web-service.yml -f infrastructure/int/jitsi/jitsi-ingress.yml'

    - script: |
        echo "Waiting for Jitsi Web to be ready..."
        kubectl rollout status deployment/jitsi-web -n participate --timeout=5m || true
      displayName: "Wait for Jitsi Web"
      env:
        KUBECONFIG: $(KUBECONFIG)

#-------------------------------------------------------------------------------------------------
# ANALYTICS DEPLOYMENT (MATOMO + GRAFANA)
#-------------------------------------------------------------------------------------------------
    - task: Kubernetes@1
      displayName: "Apply Matomo ConfigMap and Secrets"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/analytics/matomo/matomo-configmap.yml -f infrastructure/int/analytics/matomo/matomo-secret.yml'

    - task: Kubernetes@1
      displayName: "Apply Matomo PVCs and Database"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/analytics/matomo/matomo-pvc.yml -f infrastructure/int/analytics/matomo/matomo-db-pvc.yml -f infrastructure/int/analytics/matomo/matomo-db-deployment.yml'

    - task: Kubernetes@1
      displayName: "Apply Matomo Application"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/analytics/matomo/matomo-service.yml -f infrastructure/int/analytics/matomo/matomo-deployment.yml'

    - script: |
        echo "Waiting for Matomo deployment to be ready..."
        kubectl rollout status deployment/matomo -n participate --timeout=5m
      displayName: "Wait for Matomo"
      env:
        KUBECONFIG: $(KUBECONFIG)

    - task: Kubernetes@1
      displayName: "Apply Grafana ConfigMap and Secrets"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/analytics/grafana/grafana-configmap.yml -f infrastructure/int/analytics/grafana/grafana-secret.yml'

    - script: |
        echo "Waiting for Grafana config applies (short sleep)"
        sleep 5
      displayName: "Pause after Grafana config"

    - task: Kubernetes@1
      displayName: "Apply Grafana Application"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/analytics/grafana/grafana-pvc.yml -f infrastructure/int/analytics/grafana/grafana-service.yml -f infrastructure/int/analytics/grafana/grafana-deployment.yml'

    - script: |
        echo "Waiting for Grafana deployment to be ready..."
        kubectl rollout status deployment/grafana -n participate --timeout=5m
      displayName: "Wait for Grafana"
      env:
        KUBECONFIG: $(KUBECONFIG)