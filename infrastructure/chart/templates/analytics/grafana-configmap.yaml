apiVersion: v1
kind: ConfigMap
metadata:
    name: grafana-configmap
    namespace: {{ include "eu-ldt-participate.namespace" . }}
data:
    # Use Postgres as Grafana storage backend
    GF_DATABASE_TYPE: {{ .Values.grafana.db.type | quote }}
    GF_DATABASE_HOST: {{ .Values.grafana.db.host | quote }}
    GF_DATABASE_NAME: {{ .Values.grafana.db.name | quote }}
    GF_DATABASE_USER: {{ .Values.grafana.db.user | quote }}
    # Password moved to Secret (grafana-secrets)
    GF_PATHS_PROVISIONING: '/etc/grafana/provisioning'
    GF_SECURITY_ALLOW_EMBEDDING: 'true'
    GF_SECURITY_ADMIN_USER: {{ .Values.grafana.admin.user | quote }}
    GF_SERVER_ROOT_URL: {{ .Values.grafana.serverRootUrl | quote }}
    GF_SERVER_DOMAIN: {{ .Values.grafana.serverDomain | quote }}
    GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: {{ .Values.grafana.oauth.allowSignUp | quote }}
    GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: {{ .Values.grafana.oauth.allowAssignGrafanaAdmin | quote }}
    GF_AUTH_GENERIC_OAUTH_API_URL: {{ .Values.grafana.oauth.apiUrl | quote }}
    GF_AUTH_GENERIC_OAUTH_AUTH_URL: {{ .Values.grafana.oauth.authUrl | quote }}
    # Do not automatically redirect to the OAuth provider so the local
    # Grafana login form remains available to users.
    GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: 'false'
    # Ensure the standard Grafana login form is enabled so users can
    # authenticate with local Grafana accounts in addition to Keycloak.
    GF_AUTH_DISABLE_LOGIN_FORM: 'false'
    # Ensure basic (username/password) auth is enabled (default is true,
    # but set explicitly to make intent clear).
    GF_AUTH_BASIC_ENABLED: 'true'
    GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: {{ .Values.grafana.oauth.emailAttributePath }}
    GF_AUTH_GENERIC_OAUTH_ENABLED: 'true'
    GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH: {{ .Values.grafana.oauth.groupsAttributePath }}
    GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: {{ .Values.grafana.oauth.loginAttributePath }}
    GF_AUTH_GENERIC_OAUTH_NAME: {{ .Values.grafana.oauth.name }}
    GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: {{ .Values.grafana.oauth.nameAttributePath }}
    GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: {{ .Values.grafana.oauth.roleAttributePath }}
    GF_AUTH_GENERIC_OAUTH_SCOPES: {{ .Values.grafana.oauth.scopes }}
    GF_AUTH_GENERIC_OAUTH_SIGNOUT_REDIRECT_URL: {{ .Values.grafana.oauth.signoutRedirectUrl | quote }}
    GF_AUTH_GENERIC_OAUTH_TOKEN_URL: {{ .Values.grafana.oauth.tokenUrl | quote }}
    GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN: 'true'
    GF_SERVER_SERVE_FROM_SUB_PATH: {{ .Values.grafana.serveFromSubPath | quote }}
    GF_USERS_DEFAULT_THEME: 'light'
    GF_SECURITY_COOKIE_SAMESITE: 'none'
    GF_SECURITY_COOKIE_SECURE: 'true'
    GF_SECURITY_X_FRAME_OPTIONS: 'SAMEORIGIN'
    GF_PANELS_DISABLE_SANITIZE_HTML: 'true'
    GF_AUTH_DISABLE_SIGNOUT_MENU: 'true'
    # User and Organization Management
    GF_USERS_AUTO_ASSIGN_ORG: 'true'
    GF_USERS_AUTO_ASSIGN_ORG_ID: '1'
    GF_USERS_AUTO_ASSIGN_ORG_ROLE: 'Editor'
    GF_USERS_ALLOW_ORG_CREATE: 'false'
    # Increase timeout for v13 (context deadline exceeded errors)
    GF_DATABASE_MAX_OPEN_CONN: '20'
    GF_DATABASE_MAX_IDLE_CONN: '10'
    GF_DATABASE_CONN_MAX_LIFETIME: '14400'
