apiVersion: v1
kind: Service
metadata:
  name: jitsi-jicofo
  labels:
    io.kompose.service: jitsi-jicofo
spec:
  selector:
    app: jitsi-jicofo
  ports:
    - name: udp
      port: 10000
      targetPort: 10000
      protocol: UDP
    - name: colibri
      port: 8080
      targetPort: 8080
      protocol: TCP
  type: LoadBalancer