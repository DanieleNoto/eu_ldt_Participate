services: 
  decidim:
    #image: decidim/decidim-dev:0.29.3
    build: .
    ports:
      - "3000:3000"
    environment:
      - DECIDIM_DATABASE_HOST=db
      - DECIDIM_DATABASE_USER=postgres
      - DECIDIM_DATABASE_PASSWORD=postgres
      - DECIDIM_DATABASE_NAME=decidim_development
      - DECIDIM_REDIS_URL=redis://redis:6379/0
      - SECRET_KEY_BASE=insecure_key_base
      - RAILS_ENV=production
      - NODE_ENV=production
      - DECIDIM_MAILER_SENDER=changeme@example.org
      - QUEUE_ADAPTER=async
    volumes:  
      - ./decidim_public:/code
    command: bash -c "decidim decidim_application"
    networks:
      - private
    depends_on:
      - redis
      - db
  db:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private
  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    networks:
      - private
 
volumes:
  decidim_public:
  redis_data:
  postgres_data:  
networks:
  private:
