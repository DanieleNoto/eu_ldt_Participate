apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: matomo
    labels:
        io.kompose.service: matomo
spec:
    serviceName: matomo
    replicas: 1
    selector:
        matchLabels:
            io.kompose.service: matomo
    template:
        metadata:
            labels:
                io.kompose.service: matomo
                io.kompose.network/temp1-private: 'true'
        spec:
            automountServiceAccountToken: false
            containers:
                - name: matomo
                  image: euldtshared.azurecr.io/matomo-custom:_%CONTAINER_IMAGE_TOOL_TAG%_
                  resources:
                      requests:
                          memory: '256Mi'
                          cpu: '250m'
                          ephemeral-storage: '1Gi'
                      limits:
                          memory: '512Mi'
                          cpu: '500m'
                          ephemeral-storage: '2Gi'
                  ports:
                      - containerPort: 8080
                        protocol: TCP
                  envFrom:
                      - secretRef:
                            name: matomo-secrets
                      - configMapRef:
                            name: matomo-configmap
                  volumeMounts:
                      - name: matomo-data
                        mountPath: /var/www/html
    volumeClaimTemplates:
        - metadata:
              name: matomo-data
          spec:
              accessModes: ['ReadWriteOnce']
              resources:
                  requests:
                      storage: 100Mi
