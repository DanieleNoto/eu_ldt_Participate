apiVersion: v1
kind: ConfigMap
metadata:
    name: grafana-config
data:
    # Use Postgres as Grafana storage backend
    GF_DATABASE_TYPE: 'postgres'
    GF_DATABASE_HOST: 'db'
    GF_DATABASE_NAME: 'decidim_application_development'
    GF_DATABASE_USER: 'postgres'
    # Password moved to Secret (grafana-secrets)
    GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    GF_SECURITY_ALLOW_EMBEDDING: 'true'
    GF_SECURITY_ADMIN_USER: 'admin'
    GF_SERVER_ROOT_URL: 'https://part-int.ldttoolbox.app/analytics/grafana'
    GF_SERVER_DOMAIN: 'part-int.ldttoolbox.app'
    GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: 'true'
    GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: 'true'
    GF_AUTH_GENERIC_OAUTH_API_URL: 'https://im-int.ldttoolbox.app/realms/LDT/protocol/openid-connect/userinfo'
    GF_AUTH_GENERIC_OAUTH_AUTH_URL: 'https://im-int.ldttoolbox.app/realms/LDT/protocol/openid-connect/auth'
    GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: 'true'
    GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: 'email'
    GF_AUTH_GENERIC_OAUTH_ENABLED: 'true'
    GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH: 'groups'
    GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: 'login'
    GF_AUTH_GENERIC_OAUTH_NAME: 'Keycloak'
    GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: 'name'
    GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: contains(roles[*], 'admin') && 'Admin' || contains(roles[*], 'editor') && 'Editor'
    GF_AUTH_GENERIC_OAUTH_SCOPES: 'openid email profile offline_access roles'
    GF_AUTH_GENERIC_OAUTH_SIGNOUT_REDIRECT_URL: 'https://im-int.ldttoolbox.app/realms/LDT/protocol/openid-connect/logout?post_logout_redirect_uri=https%3A%2F%2Fpart-int.ldttoolbox.app%2Fanalytics%2Fgrafana%2Flogin'
    GF_AUTH_GENERIC_OAUTH_TOKEN_URL: 'https://im-int.ldttoolbox.app/realms/LDT/protocol/openid-connect/token'
    GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN: 'true'
    GF_SERVER_SERVE_FROM_SUB_PATH: 'true'