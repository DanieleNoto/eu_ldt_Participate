apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: matomo
    namespace: {{ include "eu-ldt-participate.namespace" . }}
    labels:
        io.kompose.service: matomo
spec:
    serviceName: matomo
    replicas: 1
    selector:
        matchLabels:
            io.kompose.service: matomo
    template:
        metadata:
            labels:
                io.kompose.service: matomo
                io.kompose.network/temp1-private: 'true'
        spec:
            automountServiceAccountToken: false
            imagePullSecrets:
            {{- include "eu-ldt-participate.imagePullSecrets" . | nindent 12 }}
            containers:
                - name: matomo
                  image: {{ include "eu-ldt-participate.image" (dict "repo" "matomo-custom" "root" .) }}
                  imagePullPolicy: {{ include "eu-ldt-participate.imagePullPolicy" . }}
                  resources:
                      requests:
                          memory: '256Mi'
                          cpu: '250m'
                          ephemeral-storage: '1Gi'
                      limits:
                          memory: '512Mi'
                          cpu: '500m'
                          ephemeral-storage: '2Gi'
                  ports:
                      - containerPort: 8080
                        protocol: TCP
                  envFrom:
                      - secretRef:
                            name: matomo-secrets
                      - configMapRef:
                            name: matomo-configmap
                  volumeMounts:
                      - name: matomo-data
                        mountPath: /var/www/html
    volumeClaimTemplates:
        - metadata:
              name: matomo-data
          spec:
              accessModes: ['ReadWriteOnce']
              resources:
                  requests:
                      storage: 100Mi
