name: Tool3-BuildAndDeploy-INT-$(date:yyyyMMdd)$(rev:.r)

#resources:
#  pipelines:
#    - pipeline: QualityCheck
#      source: 'EU LDT Participate - Quality Checks'
#      trigger: true
#
#
trigger: none

pool:
    vmImage: 'ubuntu-latest'

variables:
    - group: 'Tool 3 - Tool parameters - INT'
    - group: 'Tool 3 - Resources Configuration - INT'
    - group: 'Toolbox Shared Infrastructure - INTEGRATION'
    - group: 'TOOL3 - PT'
    - group: 'TOOL3 - PT - KV'

parameters:
    - name: skipDeploy
      type: boolean
      default: true
      displayName: 'Skip deployment (build only)'

    - name: k8sManifests
      type: object
      default:
          - name: 'Decidim DB'
            jobId: 'deployDecidimDB'
            buildDependency: ''
            tokenReplacements:
                - { rootDirectory: 'infrastructure/int/decidim/db', targetFiles: 'db-configmap.yml,db-secret.yml' }
            manifests:
                - { display: 'DB - Apply Services', file: 'infrastructure/int/decidim/db/db-service.yaml' }
                - { display: 'DB - Apply ConfigMap', file: 'infrastructure/int/decidim/db/db-configmap.yml' }
                - { display: 'DB - Apply Secrets', file: 'infrastructure/int/decidim/db/db-secret.yml' }
                - { display: 'DB - Apply Statefulset', file: 'infrastructure/int/decidim/db/db-statefulset.yaml' }
          - name: 'Redis'
            jobId: 'deployRedis'
            buildDependency: ''
            tokenReplacements: []
            manifests:
                - { display: 'REDIS - Apply Service', file: 'infrastructure/int/decidim/redis/redis-service.yaml' }
                - {
                      display: 'REDIS - Apply Statefulset',
                      file: 'infrastructure/int/decidim/redis/redis-statefulset.yaml'
                  }
          - name: 'Jitsi'
            jobId: 'deployJitsi'
            buildDependency: ''
            tokenReplacements:
                - { rootDirectory: 'infrastructure/int/jitsi', targetFiles: 'jitsi-configmap.yml,jitsi-secret.yml' }
            manifests:
                - { display: 'Jitsi - Apply ConfigMap', file: 'infrastructure/int/jitsi/jitsi-configmap.yml' }
                - { display: 'Jitsi - Apply secrets', file: 'infrastructure/int/jitsi/jitsi-secret.yml' }
                - {
                      display: 'JITSI-WEB - Apply Statefulset',
                      file: 'infrastructure/int/jitsi/jitsi-web-statefulset.yaml'
                  }
                - { display: 'JITSI-WEB - Apply Services', file: 'infrastructure/int/jitsi/jitsi-web-service.yaml' }
                - { display: 'JITSI-JVB - Apply Services', file: 'infrastructure/int/jitsi/jitsi-jvb-service.yaml' }
                - {
                      display: 'JITSI-JICOFO - Apply Services',
                      file: 'infrastructure/int/jitsi/jitsi-jicofo-service.yaml'
                  }
                - {
                      display: 'JITSI-PROSODY - Apply Services',
                      file: 'infrastructure/int/jitsi/jitsi-prosody-service.yaml'
                  }
                - {
                      display: 'JITSI-JICOFO - Apply Statefulset',
                      file: 'infrastructure/int/jitsi/jitsi-jicofo-statefulset.yaml'
                  }
                - {
                      display: 'JITSI-JVB - Apply Statefulset',
                      file: 'infrastructure/int/jitsi/jitsi-jvb-statefulset.yaml'
                  }
                - {
                      display: 'JITSI-PROSODY - Apply Statefulset',
                      file: 'infrastructure/int/jitsi/jitsi-prosody-statefulset.yaml'
                  }
          - name: 'Matomo'
            jobId: 'deployMatomo'
            buildDependency: 'buildMatomo'
            tokenReplacements:
                - {
                      rootDirectory: 'infrastructure/int/analytics/matomo',
                      targetFiles: 'matomo-statefulset.yaml,matomo-configmap.yml,matomo-secret.yml'
                  }
            manifests:
                - {
                      display: 'Matomo - Apply ConfigMap',
                      file: 'infrastructure/int/analytics/matomo/matomo-configmap.yml'
                  }
                - { display: 'Matomo - Apply Secrets', file: 'infrastructure/int/analytics/matomo/matomo-secret.yml' }
                - {
                      display: 'MATOMO DB - Apply Statefulset',
                      file: 'infrastructure/int/analytics/matomo/matomo-db-statefulset.yaml'
                  }
                - {
                      display: 'MATOMO - Apply Statefulset',
                      file: 'infrastructure/int/analytics/matomo/matomo-statefulset.yaml'
                  }
                - {
                      display: 'MATOMO - Apply Services',
                      file: 'infrastructure/int/analytics/matomo/matomo-service.yaml'
                  }
                - {
                      display: 'MATOMO DB - Apply Services',
                      file: 'infrastructure/int/analytics/matomo/matomo-db-service.yaml'
                  }
          - name: 'Decidim'
            jobId: 'deployDecidim'
            buildDependency: 'buildDecidim'
            otherDependencies: ['deployDecidimDB', 'deployRedis']
            tokenReplacements:
                - {
                      rootDirectory: 'infrastructure/int/decidim',
                      targetFiles: 'decidim-statefulset.yaml,decidim-configmap.yml,decidim-secret.yml'
                  }
            manifests:
                - { display: 'Decidim - Apply ConfigMap', file: 'infrastructure/int/decidim/decidim-configmap.yml' }
                - { display: 'Fluent - Apply ConfigMap', file: 'infrastructure/int/decidim/fluent-configMap.yml' }
                - { display: 'Decidim - Apply Secrets', file: 'infrastructure/int/decidim/decidim-secret.yml' }
                - {
                      display: 'Decidim - Apply Statefulset',
                      file: 'infrastructure/int/decidim/decidim-statefulset.yaml'
                  }
                - { display: 'Decidim - Apply Services', file: 'infrastructure/int/decidim/decidim-service.yaml' }
          - name: 'Grafana DB'
            jobId: 'deployGrafanaDB'
            buildDependency: ''
            tokenReplacements:
                - {
                      rootDirectory: 'infrastructure/int/analytics/grafana/db',
                      targetFiles: 'grafana-db-configmap.yml,grafana-db-secrets.yml'
                  }
            manifests:
                - {
                      display: 'Grafana DB - Apply Service',
                      file: 'infrastructure/int/analytics/grafana/db/grafana-db-service.yml'
                  }
                - {
                      display: 'Grafana DB - Apply ConfigMap',
                      file: 'infrastructure/int/analytics/grafana/db/grafana-db-configmap.yml'
                  }
                - {
                      display: 'Grafana DB - Apply Secrets',
                      file: 'infrastructure/int/analytics/grafana/db/grafana-db-secrets.yml'
                  }
                - {
                      display: 'Grafana DB - Apply StatefulSet',
                      file: 'infrastructure/int/analytics/grafana/db/grafana-db-statefulset.yml'
                  }
          - name: 'Grafana'
            jobId: 'deployGrafana'
            buildDependency: ''
            otherDependencies: ['deployGrafanaDB']
            tokenReplacements:
                - {
                      rootDirectory: 'infrastructure/int/analytics/grafana',
                      targetFiles: 'grafana-statefulset.yaml,grafana-configmap.yml,grafana-secret.yml,grafana-provisioning-configmap.yml'
                  }
            manifests:
                - {
                      display: 'Grafana - Apply ConfigMap',
                      file: 'infrastructure/int/analytics/grafana/grafana-configmap.yml'
                  }
                - {
                      display: 'Grafana - Apply Secrets',
                      file: 'infrastructure/int/analytics/grafana/grafana-secret.yml'
                  }
                - {
                      display: 'Grafana - Apply Provisioning Datasources ConfigMap',
                      file: 'infrastructure/int/analytics/grafana/grafana-provisioning-configmap.yml'
                  }
                - {
                      display: 'Grafana - Apply Dashboards Provisioning ConfigMap',
                      file: 'infrastructure/int/analytics/grafana/grafana-dashboards-provisioning-configmap.yml'
                  }
                - {
                      display: 'Grafana - Apply Dashboards ConfigMap',
                      file: 'infrastructure/int/analytics/grafana/grafana-dashboards-configmap.yml'
                  }
                - {
                      display: 'GRAFANA - Apply Statefulset',
                      file: 'infrastructure/int/analytics/grafana/grafana-statefulset.yaml'
                  }
                - {
                      display: 'GRAFANA - Apply Services',
                      file: 'infrastructure/int/analytics/grafana/grafana-service.yaml'
                  }
                - {
                      display: 'GRAFANA - Apply Storage',
                      file: 'infrastructure/int/analytics/grafana/grafana-storage.yaml'
                  }
          - name: 'Chatbot'
            jobId: 'deployChatbot'
            buildDependency: 'buildChatbot'
            tokenReplacements:
                - {
                      rootDirectory: 'infrastructure/int/backend',
                      targetFiles: 'chatbot-be-configmap.yml,chatbot-be-secrets.yaml,chatbot-db-configmap.yml,chatbot-db-secrets.yaml'
                  }
                - { rootDirectory: 'infrastructure/int/frontend', targetFiles: 'chatbot-fe-configmap.yml' }
                - { rootDirectory: 'infrastructure/int/webapp', targetFiles: 'chatbot-statefulset.yml' }
            manifests:
                - {
                      display: 'Apply ConfigMap - BE (Chatbot)',
                      file: 'infrastructure/int/backend/chatbot-be-configmap.yml'
                  }
                - {
                      display: 'Apply ConfigMap - DB (Chatbot)',
                      file: 'infrastructure/int/backend/chatbot-db-configmap.yml'
                  }
                - {
                      display: 'Apply Secrets - BE (Chatbot)',
                      file: 'infrastructure/int/backend/chatbot-be-secrets.yaml'
                  }
                - {
                      display: 'Apply Secrets - DB (Chatbot)',
                      file: 'infrastructure/int/backend/chatbot-db-secrets.yaml'
                  }
                - {
                      display: 'Apply ConfigMap - FE (Chatbot)',
                      file: 'infrastructure/int/frontend/chatbot-fe-configmap.yml'
                  }
                - {
                      display: 'Apply Statefulset - WebApp (Chatbot)',
                      file: 'infrastructure/int/webapp/chatbot-statefulset.yml'
                  }
                - {
                      display: 'Apply Service - BE (Chatbot)',
                      file: 'infrastructure/int/backend/chatbot-be-service.yaml'
                  }
                - {
                      display: 'Apply Service - FE (Chatbot)',
                      file: 'infrastructure/int/frontend/chatbot-fe-service.yaml'
                  }

jobs:
    - job: buildDecidim
      displayName: 'Build and Push Decidim Image'
      variables:
          tag: '$(Build.BuildId)'
      steps:
          - task: Docker@2
            displayName: Build and Push decidim
            inputs:
                command: buildAndPush
                repository: eu-ldt-part-int
                dockerfile: decidim/decidim_application/Dockerfile
                containerRegistry: EU-LDT-Toolbox-ACR-Shared-INT
                buildContext: decidim/decidim_application
                addPipelineData: false
                addBaseImageData: false
                arguments: --build-arg RAILS_ENV=production --build-arg NODE_ENV=production
                tags: |
                    $(tag)

    - job: buildMatomo
      displayName: 'Build and Push Matomo Image'
      variables:
          tag: '$(Build.BuildId)'
      steps:
          - task: Docker@2
            displayName: Build and Push Matomo
            inputs:
                command: buildAndPush
                repository: matomo-custom
                dockerfile: analytics/matomo/Dockerfile
                containerRegistry: EU-LDT-Toolbox-ACR-Shared-INT
                buildContext: analytics/matomo
                addPipelineData: false
                addBaseImageData: false
                tags: |
                    $(tag)

    - job: buildChatbot
      displayName: 'Build and Push Chatbot Images'
      variables:
          tag: '$(Build.BuildId)'
      steps:
          - task: Docker@2
            displayName: Build and Push Chatbot Backend
            inputs:
                command: buildAndPush
                repository: eu-ldt-chatbot-be-int
                dockerfile: backend/Dockerfile
                containerRegistry: EU-LDT-Toolbox-ACR-Shared-INT
                addPipelineData: false
                addBaseImageData: false
                tags: |
                    $(tag)

          - task: Docker@2
            displayName: Build and Push Chatbot Frontend
            inputs:
                command: buildAndPush
                repository: eu-ldt-chatbot-fe-int
                dockerfile: frontend/Dockerfile
                containerRegistry: EU-LDT-Toolbox-ACR-Shared-INT
                addPipelineData: false
                addBaseImageData: false
                tags: |
                    $(tag)

    - job: prepareInfrastructure
      condition: eq(${{ parameters.skipDeploy }}, false)
      displayName: 'Prepare K8s Infrastructure'
      steps:
          - task: KubectlInstaller@0
            displayName: 'Kubectl Install'
            inputs:
                kubectlVersion: 'latest'

          - task: Kubernetes@1
            displayName: 'Apply Namespaces (Tool3)'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'apply'
                arguments: '-f infrastructure/int/namespace.yml'

          - task: Kubernetes@1
            displayName: 'Delete ACR Pull Secret if exists (Tool3)'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'delete'
                arguments: secret acr-secret --ignore-not-found=true

          - task: Kubernetes@1
            displayName: 'Set ACR Pull Secret (Tool3)'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'create'
                arguments: secret docker-registry acr-secret --docker-server=euldtshared.azurecr.io --docker-username=$(TF-SP-CLIENT-ID) --docker-password=$(TF-SP-CLIENT-SECRET)
                secretType: 'dockerRegistry'
                containerRegistryType: 'Azure Container Registry'

          - task: Kubernetes@1
            displayName: 'Delete existing storage-secret if it exists'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'delete'
                arguments: secret storage-secret --ignore-not-found=true

          - task: Kubernetes@1
            displayName: 'Create Shared Storage Secret (Tool3)'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'create'
                arguments: secret generic storage-secret --from-literal=azurestorageaccountname=euldtsharedtfstateint --from-literal=azurestorageaccountkey=$(STORAGE-ACCOUNT-KEY)
                secretType: 'generic'

          - task: replacetokens@5
            displayName: 'Replace tokens in Ingress files'
            inputs:
                rootDirectory: infrastructure/int/proxy
                targetFiles: 'ingress.yml,matomo-ingress.yml'
                tokenPattern: custom
                tokenPrefix: _%
                tokenSuffix: '%_'
                writeBOM: false
                verbosity: detailed
                actionOnNoFiles: warn

          - task: Kubernetes@1
            displayName: 'Apply Ingress'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'apply'
                arguments: '-f infrastructure/int/proxy/ingress.yml'

          - task: Kubernetes@1
            displayName: 'Apply Matomo Ingress'
            inputs:
                connectionType: 'Azure Resource Manager'
                azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                namespace: 'participate'
                command: 'apply'
                arguments: '-f infrastructure/int/proxy/matomo-ingress.yml'

    # Generate deployment jobs dynamically from k8sManifests parameter
    - ${{ each app in parameters.k8sManifests }}:
          - job: ${{ app.jobId }}
            condition: eq(${{ parameters.skipDeploy }}, false)
            dependsOn:
                - ${{ if ne(app.buildDependency, '') }}:
                      - ${{ app.buildDependency }}
                - ${{ if app.otherDependencies }}:
                      - ${{ each dep in app.otherDependencies }}:
                            - ${{ dep }}
                - prepareInfrastructure
            displayName: 'Deploy ${{ app.name }}'
            steps:
                # Replace tokens before applying manifests
                - ${{ each tokenReplacement in app.tokenReplacements }}:
                      - task: replacetokens@5
                        displayName: 'Replace tokens in ${{ tokenReplacement.rootDirectory }}'
                        inputs:
                            rootDirectory: ${{ tokenReplacement.rootDirectory }}
                            targetFiles: ${{ tokenReplacement.targetFiles }}
                            tokenPattern: custom
                            tokenPrefix: _%
                            tokenSuffix: '%_'
                            writeBOM: false
                            verbosity: detailed
                            actionOnNoFiles: warn

                # Apply manifests
                - ${{ each manifest in app.manifests }}:
                      - task: Kubernetes@1
                        displayName: ${{ manifest.display }}
                        inputs:
                            connectionType: 'Azure Resource Manager'
                            azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
                            azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
                            kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
                            namespace: 'participate'
                            command: 'apply'
                            arguments: '-f ${{ manifest.file }}'
