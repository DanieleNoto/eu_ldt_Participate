apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: part-ingress
    namespace: participate
    annotations:
        nginx.ingress.kubernetes.io/use-regex: 'false'
spec:
    ingressClassName: nginx
    rules:
        - http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: part-apigw-apisix-gateway
                            port:
                                number: 80
