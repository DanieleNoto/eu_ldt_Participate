apiVersion: apps/v1
kind: StatefulSet
metadata:
    annotations:
        kompose.cmd: /home/adminlnx/.config/Code/User/globalStorage/othy1010.kompose/kompose convert --out=/home/adminlnx/TEMP1 --file=/home/adminlnx/TEMP1/docker-compose.yml
        kompose.version: 1.21.0 (992df58d8)
    labels:
        io.kompose.service: grafana
    name: grafana
spec:
    serviceName: grafana
    replicas: 1
    selector:
        matchLabels:
            io.kompose.service: grafana
    template:
        metadata:
            labels:
                io.kompose.network/temp1-private: 'true'
                io.kompose.service: grafana
        spec:
            automountServiceAccountToken: false
            securityContext:
                runAsUser: 472 # UID del usuario Grafana
                runAsGroup: 472 # GID del usuario Grafana
                fsGroup: 472 # Grupo para los volumenes montados
            initContainers:
            - name: grafana-seed
              image: euldtshared.azurecr.io/grafana-custom:_%CONTAINER_IMAGE_TOOL_TAG%_
              command:
                    - sh
                    - -c
                    - |
                        set -e
                        [ -d /target/provisioning ] || mkdir -p /target/provisioning
                        [ -d /target/dashboards ] || mkdir -p /target/dashboards
                        [ -d /target/data/dashboards ] || mkdir -p /target/data/dashboards
                        # copy provisioning (from image) into PVC mount target
                        cp -a /etc/grafana/provisioning/. /target/provisioning/ || true
                        # ensure dashboards are available both under provisioning (for provisioning files)
                        # and under /var/lib/grafana (Grafana expects dashboards there depending on config)
                        cp -a /var/lib/grafana/dashboards/. /target/provisioning/ || true
                        cp -a /var/lib/grafana/dashboards/. /target/dashboards/ || true
                        cp -a /var/lib/grafana/dashboards/. /target/data/dashboards/ || true
              securityContext:
                    runAsUser: 0
              volumeMounts:
                    - name: grafana-claim1
                      mountPath: /target/provisioning
                    - name: grafana-claim2
                      mountPath: /target/dashboards
                    - name: grafana-data
                      mountPath: /target/data
            containers:
                - name: grafana
                  image: euldtshared.azurecr.io/grafana-custom:_%CONTAINER_IMAGE_TOOL_TAG%_
                  resources:
                      requests:
                          memory: '256Mi'
                          cpu: '250m'
                          ephemeral-storage: '1Gi'
                      limits:
                          memory: '512Mi'
                          cpu: '500m'
                          ephemeral-storage: '2Gi'
                  ports:
                      - containerPort: 3000
                        hostPort: 3001
                        protocol: TCP
                  envFrom:
                      - secretRef:
                            name: grafana-secrets
                      - configMapRef:
                            name: grafana-configmap
                  volumeMounts:
                      - name: grafana-data
                        mountPath: /var/lib/grafana
                      - name: grafana-claim1
                        mountPath: /etc/grafana/provisioning
                      - name: grafana-claim2
                        mountPath: /etc/grafana/dashboards
            restartPolicy: Always
            volumes:
                - name: grafana-data
                  persistentVolumeClaim:
                      claimName: grafana-data
                - name: grafana-claim1
                  persistentVolumeClaim:
                      claimName: grafana-claim1
                - name: grafana-claim2
                  persistentVolumeClaim:
                      claimName: grafana-claim2
