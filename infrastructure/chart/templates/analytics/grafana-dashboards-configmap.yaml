        					"format": "table",
        					"rawQuery": true,
        					"rawSql": "SELECT \n  CASE \n    WHEN DATE_PART('year', AGE(CURRENT_DATE, NULLIF(u.extended_data->>'date_of_birth', '')::date)) < 25 THEN '< 25'\n    WHEN DATE_PART('year', AGE(CURRENT_DATE, NULLIF(u.extended_data->>'date_of_birth', '')::date)) BETWEEN 25 AND 34 THEN '25-34'\n    WHEN DATE_PART('year', AGE(CURRENT_DATE, NULLIF(u.extended_data->>'date_of_birth', '')::date)) BETWEEN 35 AND 44 THEN '35-44'\n    WHEN DATE_PART('year', AGE(CURRENT_DATE, NULLIF(u.extended_data->>'date_of_birth', '')::date)) BETWEEN 45 AND 54 THEN '45-54'\n    WHEN DATE_PART('year', AGE(CURRENT_DATE, NULLIF(u.extended_data->>'date_of_birth', '')::date)) BETWEEN 55 AND 64 THEN '55-64'\n    WHEN DATE_PART('year', AGE(CURRENT_DATE, NULLIF(u.extended_data->>'date_of_birth', '')::date)) >= 65 THEN '65+'\n    ELSE 'Unknown'\n  END as age_group,\n  COUNT(DISTINCT u.id) as total_users,\n  COUNT(DISTINCT cp.coauthorable_id) as proposals_created,\n  COUNT(DISTINCT c.id) as comments_made,\n  ROUND(AVG(EXTRACT(days FROM NOW() - u.last_sign_in_at)), 1) as avg_days_since_login\nFROM decidim_users u\nLEFT JOIN decidim_coauthorships cp ON u.id = cp.decidim_author_id AND cp.decidim_author_type IN ('Decidim::User', 'Decidim::UserBaseEntity') AND cp.coauthorable_type = 'Decidim::Proposals::Proposal'\nLEFT JOIN decidim_comments_comments c ON u.id = c.decidim_author_id AND c.decidim_author_type IN ('Decidim::User', 'Decidim::UserBaseEntity') AND c.deleted_at IS NULL\nWHERE u.deleted_at IS NULL AND u.type = 'Decidim::User'\nGROUP BY age_group\nORDER BY total_users DESC;",
