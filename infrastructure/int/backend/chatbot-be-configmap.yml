apiVersion: v1
kind: ConfigMap
metadata:
    name: chatbot-backend-config
    namespace: participate
data:
    PORT: '3002'
    NODE_ENV: 'production'
    CONTEXT_URL: '/api/v1'
    # CORS
    CORS_ORIGINS: _%CORS-ORIGINS%_
    SWAGGER_GEN_DOC_FILE: 'false'
    # Security
    DISABLE_HELMET: 'false'
    JWT_ENABLE_CHECK: 'false'
    DATABASE_SYNC: 'false'
    LOGGER_LEVEL: 'info'
    RATE_LIMIT_TIME_WINDOW: '_%RATE-LIMIT-TIME-WINDOW%_'
    RATE_LIMIT_MAX: '_%RATE-LIMIT-MAX%_'
    EVENT_LOOP_DELAY: '900000'
    MAX_HEAP_USED_BYTES: '90000000000'
    MAX_RSS_BYTES: '90000000000'
    MAX_EVENT_LOOP_USE: '_%MAX-EVENT-LOOP-USE%_'
    # Chatbot Configuration
    CHATBOT_SUPPORT_EMAIL: _%CHATBOT-SUPPORT-EMAIL%_
    CHATBOT_FROM_EMAIL: _%CHATBOT-FROM-EMAIL%_
    # Database
    DB_NAME: _%DB-NAME%_
    DB_HOST: 127.0.0.1
    DB_PORT: '5432'
    DB_DIALECT: postgres
    DB_MAX_POOL: '100'
    DB_MIN_POOL: '2'
    DB_IDLE_POOL: '1000'
    DB_SCHEMA: public
    #Sequelize
    SEQUELIZE_SEEDER_STORAGE: sequelize
    SEQUELIZE_SEEDER_STORAGE_TABLE_NAME: SequelizeData
    SEQUELIZE_MIGRATION_STORAGE: sequelize
    SEQUELIZE_MIGRATION_STORAGE_TABLE_NAME: SequelizeData
    # SMTP/Email Configuration
    SMTP_ADDRESS: _%SMTP-ADDRESS%_
    SMTP_PORT: '_%SMTP-PORT%_'
    SMTP_DOMAIN: _%SMTP-DOMAIN%_
    SMTP_AUTHENTICATION: _%SMTP-AUTHENTICATION%_
    SMTP_ENABLE_STARTTLS_AUTO: '_%SMTP-ENABLE-STARTTLS-AUTO%_'
    SMTP_USER_NAME: _%SMTP-USER-NAME%_
    # Service URLs
    GRAFANA_URL: https://grafana
    DECIDIM_URL: https://decidim
    MATOMO_URL: https://matomo
    JITSI_WEB_URL: https://jitsi-web
    DECIDIM_PRIMARY_COLOR: _%DECIDIM-PRIMARY-COLOR%_
    DECIDIM_ORGANIZATION_NAME: _%DECIDIM-ORGANIZATION-NAME%_
    DECIDIM_LOGO_URL: _%DECIDIM-LOGO-URL%_
    # Email Footer Links
    PRIVACY_POLICY_URL: _%PRIVACY-POLICY-URL%_
    NOTIFICATION_PREFERENCES_URL: _%NOTIFICATION-PREFERENCES-URL%_
