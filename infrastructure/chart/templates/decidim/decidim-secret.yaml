apiVersion: v1
kind: Secret
metadata:
    name: decidim-secret
    namespace: {{ include "eu-ldt-participate.namespace" . }}
type: Opaque
stringData:
    SECRET_KEY_BASE: {{ .Values.decidim.secretKeyBase | quote }}
    OMNIAUTH_KEYCLOAK_CLIENT_SECRET: {{ .Values.decidim.keycloak.clientSecret | quote }}
    SMTP_PASSWORD: {{ .Values.smtp.password | quote }}
    DATABASE_USERNAME: {{ .Values.decidim.db.username | quote }}
    DATABASE_PASSWORD: {{ .Values.decidim.db.password | quote }}
    DATABASE_URL: {{ .Values.decidim.db.url | quote }}
    MATOMO_TOKEN_AUTH: {{ .Values.matomo.tokenAuth | quote }}
