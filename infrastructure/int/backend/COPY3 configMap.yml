apiVersion: v1
kind: ConfigMap
metadata:
    name: part-backend-config
data:
    PORT: '3000'
    NODE_ENV: 'production'
    CONTEXT_URL: '/api/v1'
    SWAGGER_GEN_DOC_FILE: 'false'
    JWT_ENABLE_CHECK: 'true'
    DATABASE_SYNC: 'true'
    SEQUELIZE_SEEDER_STORAGE: 'sequelize'
    SEQUELIZE_SEEDER_STORAGE_TABLE_NAME: 'SequelizeData'
    LOGGER_TARGET: '' # empty string
    LOGGER_LEVEL: 'info'
    EXPORT_ASYNC: 'false'
    EXPORT_TEMPLATE_FOLDER_PATH: '../../assets/template/export'
    RATE_LIMIT_TIME_WINDOW: '30000'
    RATE_LIMIT_MAX: '9999999'
    CSRF_ENABLED: 'true'
    CSRF_SAME_SITE: lax
    CSRF_SECURE: 'false'
    CSRF_URL: /csrf-token
    CSRF_EXCLUDED_URLS: /documentation,/api/v1/oauth,/api/v1/health
    # Data Platform Integration
    MOCK_DATA_PLATFORM: 'true'
    DATA_PLATFORM_BASE_URL: http://localhost:8080
    DATA_PLATFORM_TIMEOUT: '5000'
    DATA_PLATFORM_BROKER_BASE_URL: http://localhost:9090
    DATA_PLATFORM_BROKER_TIMEOUT: '5000'
    # AI Notebook integration
    MOCK_AI_NOTEBOOK: 'true'
    AI_NOTEBOOK_BASE_URL: http://localhost:8081
    AI_NOTEBOOK_TIMEOUT: '5000'
