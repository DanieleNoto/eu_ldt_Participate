# Files in the config/locales directory are used for internationalization
# and are automatically loaded by Rails. If you want to use locales other
# than English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# The following keys must be escaped otherwise they will not be retrieved by
# the default I18n backend:
#
# true, false, on, off, yes, no
#
# Instead, surround them with single quotes.
#
# en:
#   "true": "foo"
#
# To learn more, please read the Rails Internationalization guide
# available at https://guides.rubyonrails.org/i18n.html.

en:
    hello: 'Hello world'
    activemodel:
        attributes:
            organization:
                admin_terms_of_service_body: Body for the admin privacy policy
                tos_version: Privacy policy version
            user:
                tos_agreement: Privacy policy agreement

    decidim:
        admin:
            admin_terms_of_service:
                accept:
                    error: There was a problem while accepting the admin privacy policy.
                    success: Great! You have accepted the admin privacy policy.
                actions:
                    accept: I agree with the privacy policy
                    are_you_sure: Are you sure you want to refuse the admin privacy policy?
                    refuse: Refuse the admin privacy policy
                    title: Agree to the privacy policy
                required_review:
                    alert: 'Required: Review our admin privacy policy'
                    callout: Please take a moment to review the admin privacy policy. Otherwise you will not be able to manage the platform.
                title: Admin privacy policy
            organization:
                form:
                    admin_terms_of_service: Admin privacy policy

            static_pages:
                edit:
                    changed_notably_help: If checked, participants will be notified to accept the privacy policy.

        account:
            blocked: This account has been blocked due to privacy policy violation
        admin_terms_of_service:
            default_body: '<h2>ADMIN PRIVACY POLICY</h2><p>We trust you have received the usual lecture from the local System Administrator. It usually boils down to these three things:</p><ol><li>Respect the privacy of others.</li><li>Think before you click.</li><li>With great power comes great responsibility.</li></ol>'

        templates:
            admin:
                questionnaire_templates:
                    preview:
                        tos_agreement: By participating you accept its Privacy Policy

        forms:
            admin:
                models:
                    components:
                        tos: Privacy Policy
                questionnaires:
                    responses:
                        tos_agreement: By participating you accept its Privacy Policy

        demographics:
            demographics:
                questionnaire:
                    terms_of_service: Privacy Policy
        devise:
            registrations:
                new:
                    terms: the privacy policy
                    tos_agreement: By signing up you agree to %{link}.
                    tos_title: Privacy Policy
        download_your_data:
            help:
                users:
                    accepted_tos_version: The date when the Privacy Policy of this platform was accepted by the user
        pages:
            privacy_policy:
                accept:
                    error: There was a problem accepting the privacy policy.
                    success: Great! You have accepted the privacy policy.
                form:
                    agreement: I agree with this privacy policy
                    legend: Agree to the privacy policy
                refuse:
                    modal_body: If you refuse, you will not be able to use the platform, you can <a href="%{download_your_data_path}">download your data</a> and/or <a href="%{delete_path}">delete your account</a>.
                    modal_btn_continue: Accept privacy policy and continue
                    modal_btn_exit: I will review it later
                    modal_button: Refuse the privacy policy
                    modal_title: Do you really refuse the updated privacy policy?
                required_review:
                    alert: We have updated our Privacy Policy, please review it.
                    body: Please take a moment to review updates to our Privacy Policy. Otherwise you will not be able to use the platform.
                    title: 'Required: Review updates to our privacy policy'
        profile:
            inaccessible_message: This profile is inaccessible due to privacy policy violation!
    components:
        meetings:
            settings:
                global:
                    terms_and_conditions_url_for_meeting_creators: Privacy policy URL for meeting creators
    devise:
        omniauth_callbacks:
            add_tos_errors: Privacy policy must be accepted in order to create an account.
    layouts:
        decidim:
            footer:
                terms_of_service: Privacy Policy
