        					"rawSql": "WITH active_users AS (\n  SELECT decidim_author_id as user_id FROM decidim_comments_comments\n  WHERE deleted_at IS NULL AND created_at >= NOW() - INTERVAL '7 days'\n    AND decidim_author_type IN ('Decidim::User', 'Decidim::UserBaseEntity')\n  UNION\n  SELECT ca.decidim_author_id as user_id FROM decidim_coauthorships ca\n  JOIN decidim_proposals_proposals p ON ca.coauthorable_id = p.id\n    AND ca.coauthorable_type = 'Decidim::Proposals::Proposal'\n    AND ca.decidim_author_type IN ('Decidim::User', 'Decidim::UserBaseEntity')\n  WHERE p.deleted_at IS NULL AND p.created_at >= NOW() - INTERVAL '7 days'\n  UNION\n  SELECT decidim_author_id as user_id FROM decidim_likes\n  WHERE created_at >= NOW() - INTERVAL '7 days'\n    AND decidim_author_type IN ('Decidim::User', 'Decidim::UserBaseEntity')\n)\nSELECT\n  ROUND(\n    (COUNT(DISTINCT au.user_id) * 100.0) /\n    NULLIF(COUNT(DISTINCT u.id), 0), 2\n  ) as value\nFROM decidim_users u\nLEFT JOIN active_users au ON u.id = au.user_id\nWHERE u.deleted_at IS NULL AND u.type = 'Decidim::User';",
