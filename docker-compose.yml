services:
    decidim:
        build:
            context: ./decidim/decidim_application/
            args:
                RAILS_ENV: development
                NODE_ENV: development
        ports:
            - "3000:3000"
        env_file:
            - .env
        environment:
            - RAILS_CSP_DEVELOPMENT=true
            - FORCE_DATA_SETUP=${FORCE_DATA_SETUP:-false}
            - RAILS_LOG_TO_STDOUT=true
        volumes:
            - ./decidim/decidim_application:/code
            - bundle_cache:/usr/local/bundle
            - vendor_bundle:/app/vendor/bundle
        command: bin/dev
        networks:
            - private
        depends_on:
            redis:
                condition: service_started
            db:
                condition: service_started
        healthcheck:
            test: ["CMD", "test", "-d", "node_modules"]
            interval: 10s
            timeout: 5s
            retries: 30
    db:
        image: postgres:16
        env_file:
            - .env
        environment:
            - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
            - POSTGRES_USER=${DATABASE_USERNAME}
            - POSTGRES_DATABASE=${DATABASE_NAME}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - private
        ports:
            - "5432:5432"
    redis:
        image: redis:7
        volumes:
            - redis_data:/data
        networks:
            - private
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5

    backend:
        build: ./backend/
        ports:
            - "3002:3002"
        env_file:
            - .env
        environment:
            # Service URLs
            - GRAFANA_URL=http://grafana:3000
            - DECIDIM_URL=http://decidim:3000
            - MATOMO_URL=http://matomo:80
            - JITSI_WEB_URL=http://jitsi-web:80
        volumes:
            - ./backend:/app
            - /app/node_modules
        networks:
            - private
        depends_on:
            - db
            - redis
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:3002/api/v1/health"]
            interval: 30s
            timeout: 10s
            start_period: 40s
            retries: 3

    chatbot-frontend:
        build:
            context: ./frontend/
        ports:
            - "${FRONTEND_PORT}:${FRONTEND_PORT}"
        env_file:
            - .env
        volumes:
            - /app/node_modules
        networks:
            - private
        depends_on:
            - backend
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--no-verbose",
                    "--tries=1",
                    "--spider",
                    "http://localhost:5001/",
                ]
            interval: 30s
            timeout: 10s
            start_period: 40s
            retries: 3
    grafana:
        image: grafana/grafana:12.2.0
        ports:
            - "3001:3000"
        env_file:
            - .env
        environment:
            - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
            - GF_SECURITY_ALLOW_EMBEDDING=true
            - GF_DATABASE_HOST=${DATABASE_HOST}
            - GF_DATABASE_NAME=${DATABASE_NAME}
            - GF_DATABASE_USER=${DATABASE_USERNAME}
            - GF_DATABASE_PASSWORD=${DATABASE_PASSWORD}
        volumes:
            - grafana_data:/var/lib/grafana
        networks:
            - private
        depends_on:
            - db

    matomo:
        build:
            context: ./analytics/matomo
            dockerfile: Dockerfile
        ports:
            - "8081:80"
        env_file:
            - .env
        volumes:
            - matomo_data:/var/www/html
        depends_on:
            - matomo-db
        networks:
            - private

    matomo-db:
        image: mariadb:11
        env_file:
            - .env
        environment:
            - MYSQL_ROOT_PASSWORD=${MATOMO_DATABASE_PASSWORD}
            - MYSQL_DATABASE=${MATOMO_DATABASE_DBNAME}
            - MYSQL_USER=${MATOMO_DATABASE_USERNAME}
            - MYSQL_PASSWORD=${MATOMO_DATABASE_PASSWORD}
        volumes:
            - matomo_db_data:/var/lib/mysql
        networks:
            - private

    jitsi-web:
        image: jitsi/web:stable-8960
        restart: ${RESTART_POLICY:-unless-stopped}
        ports:
            - "${JITSI_HTTP_PORT:-8000}:80"
            - "${JITSI_HTTPS_PORT:-8443}:443"
        volumes:
            - ${CONFIG:-./jitsi-meet-cfg}/web:/config:Z
            - ./jitsi-meet-cfg/web/nginx/prosody-websocket.conf:/config/nginx/prosody-websocket.conf:Z
        environment:
            - ENABLE_AUTH
            - ENABLE_GUESTS
            - PUBLIC_URL
            - XMPP_DOMAIN
            - XMPP_AUTH_DOMAIN
            - XMPP_BOSH_URL_BASE
            - XMPP_GUEST_DOMAIN
            - XMPP_MUC_DOMAIN
            - XMPP_RECORDER_DOMAIN
            - TZ
            - ENABLE_XMPP_WEBSOCKET
        networks:
            - private
        depends_on:
            - jitsi-prosody

    jitsi-prosody:
        image: jitsi/prosody:stable-8960
        restart: ${RESTART_POLICY:-unless-stopped}
        expose:
            - "5222"
            - "5347"
            - "5280"
        volumes:
            - ${CONFIG:-./jitsi-meet-cfg}/prosody/config:/config:Z
            - ${CONFIG:-./jitsi-meet-cfg}/prosody/prosody-plugins-custom:/prosody-plugins-custom:Z
        environment:
            - AUTH_TYPE
            - ENABLE_AUTH
            - ENABLE_GUESTS
            - XMPP_DOMAIN
            - XMPP_AUTH_DOMAIN
            - XMPP_GUEST_DOMAIN
            - XMPP_MUC_DOMAIN
            - XMPP_INTERNAL_MUC_DOMAIN
            - XMPP_MODULES
            - XMPP_RECORDER_DOMAIN
            - JICOFO_AUTH_USER
            - JICOFO_AUTH_PASSWORD
            - JVB_AUTH_USER
            - JVB_AUTH_PASSWORD
            - TZ
            # JWT Keycloak settings
            - JWT_APP_ID
            - JWT_APP_SECRET
            - ENABLE_XMPP_WEBSOCKET
        networks:
            - private

    jitsi-jicofo:
        image: jitsi/jicofo:stable-8960
        restart: ${RESTART_POLICY:-unless-stopped}
        volumes:
            - ${CONFIG:-./jitsi-meet-cfg}/jicofo:/config:Z
        environment:
            - ENABLE_AUTH
            - XMPP_DOMAIN
            - XMPP_AUTH_DOMAIN
            - XMPP_SERVER
            - XMPP_INTERNAL_MUC_DOMAIN
            - JICOFO_AUTH_USER
            - JICOFO_AUTH_PASSWORD
            - JVB_BREWERY_MUC
            - TZ
            # JWT Keycloak settings
            - JWT_APP_ID
            - JWT_APP_SECRET
        depends_on:
            - jitsi-prosody
        networks:
            - private

    jitsi-jvb:
        image: jitsi/jvb:stable-8960
        restart: ${RESTART_POLICY:-unless-stopped}
        ports:
            - "${JVB_PORT:-10000}:${JVB_PORT:-10000}/udp"
        volumes:
            - ${CONFIG:-./jitsi-meet-cfg}/jvb:/config:Z
        environment:
            - DOCKER_HOST_ADDRESS
            - XMPP_AUTH_DOMAIN
            - XMPP_INTERNAL_MUC_DOMAIN
            - XMPP_SERVER
            - JVB_AUTH_USER
            - JVB_AUTH_PASSWORD
            - JVB_BREWERY_MUC
            - JVB_PORT
            - JVB_STUN_SERVERS
            - JVB_ENABLE_APIS
            - TZ
            # JWT Keycloak settings
            - JWT_APP_ID
            - JWT_APP_SECRET
            - JVB_ADVERTISE_IPS
        networks:
            - private
        depends_on:
            - jitsi-prosody

volumes:
    decidim_public:
    redis_data:
    postgres_data:
    bundle_cache:
    vendor_bundle:
    grafana_data:
    matomo_data:
    matomo_db_data:
    jitsi_web:
    jitsi_prosody:
    jitsi_jicofo:
    jitsi_jvb:
networks:
    private:
