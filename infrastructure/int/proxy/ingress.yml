apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/compute-full-forwarded-for: "true"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # Allow using regular expressions in the path definitions so the
    # analytics and jitsi regex paths are evaluated correctly.
    nginx.ingress.kubernetes.io/use-regex: "true"

  # No global rewrite-target for analytics routes: use Prefix paths to avoid
  # accidental duplicated prefixes when upstream or local proxies also add paths.
spec:
  ingressClassName: nginx
  rules:
  - host: part-int.ldttoolbox.app
    http:
      paths:
      # More-specific regex paths first so they are matched before the
      # fallback root path.
      # Jitsi is handled by a dedicated ingress (jitsi-ingress.yml)
      - path: /analytics/grafana
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
      # Matomo is handled by a dedicated ingress (matomo-ingress.yml)
      # Fallback root path kept last so it doesn't capture analytics paths.
      - path: /
        pathType: Prefix
        backend:
          service:
            name: decidim
            port:
              number: 80
    # Jitsi is handled by a dedicated host
  - host: jitsi-part-int.ldttoolbox.app
  http:
    paths:
    - backend:
        service:
          name: jitsi-web
          port:
            number: 8443
      path: /jitsi
      pathType: Prefix