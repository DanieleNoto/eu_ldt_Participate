apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: matomo-db
    labels:
        io.kompose.service: matomo-db
spec:
    serviceName: matomo-db-svc
    replicas: 1
    selector:
        matchLabels:
            io.kompose.service: matomo-db
    template:
        metadata:
            labels:
                io.kompose.service: matomo-db
                io.kompose.network/temp1-private: 'true'
        spec:
            automountServiceAccountToken: false
            containers:
                - name: matomo-db
                  image: mariadb:11
                  resources:
                      requests:
                          memory: '256Mi'
                          cpu: '250m'
                          ephemeral-storage: '1Gi'
                      limits:
                          memory: '512Mi'
                          cpu: '500m'
                          ephemeral-storage: '2Gi'
                  ports:
                      - containerPort: 3306
                        protocol: TCP
                  envFrom:
                      - configMapRef:
                            name: matomo-configmap
                      - secretRef:
                            name: matomo-secrets
                  volumeMounts:
                      - name: matomo-db-data
                        mountPath: /var/lib/mysql
    volumeClaimTemplates:
        - metadata:
              name: matomo-db-data
          spec:
              accessModes: ['ReadWriteOnce']
              resources:
                  requests:
                      storage: 100Mi
