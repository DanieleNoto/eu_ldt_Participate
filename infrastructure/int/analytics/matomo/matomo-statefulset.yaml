apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: matomo
    labels:
        io.kompose.service: matomo
spec:
    serviceName: matomo
    replicas: 1
    selector:
        matchLabels:
            io.kompose.service: matomo
    template:
        metadata:
            labels:
                io.kompose.service: matomo
                io.kompose.network/temp1-private: 'true'
        spec:
            automountServiceAccountToken: false
            containers:
                - name: matomo
                  image: matomo:5
                  resources:
                      requests:
                          memory: '256Mi'
                          cpu: '250m'
                          ephemeral-storage: '1Gi'
                      limits:
                          memory: '512Mi'
                          cpu: '500m'
                          ephemeral-storage: '2Gi'
                  ports:
                      - containerPort: 80
                        protocol: TCP
                  env:
                    - name: DATABASE_HOST
                      valueFrom:
                        configMapKeyRef:
                          name: matomo-configmap
                          key: MATOMO_DATABASE_HOST
                    - name: DATABASE_USERNAME
                      valueFrom:
                        secretKeyRef:
                          name: matomo-secrets
                          key: MATOMO_DATABASE_USERNAME
                    - name: DATABASE_PASSWORD
                      valueFrom:
                        secretKeyRef:
                          name: matomo-secrets
                          key: MATOMO_DATABASE_PASSWORD
                    - name: DATABASE_NAME
                      valueFrom:
                        configMapKeyRef:
                          name: matomo-configmap
                          key:  MATOMO_DATABASE_DBNAME
                    - name: MATOMO_DATABASE_ADAPTER
                      valueFrom:
                        configMapKeyRef:
                          name: matomo-configmap
                          key: MATOMO_DATABASE_ADAPTER
                    - name: MATOMO_DATABASE_TABLES_PREFIX
                      valueFrom:
                        configMapKeyRef:
                          name: matomo-configmap
                          key: MATOMO_DATABASE_TABLES_PREFIX
                  volumeMounts:
                      - name: matomo-data
                        mountPath: /var/www/html
    volumeClaimTemplates:
        - metadata:
              name: matomo-data
          spec:
              accessModes: ['ReadWriteOnce']
              resources:
                  requests:
                      storage: 100Mi
