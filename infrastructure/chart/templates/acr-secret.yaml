{{- if .Values.acr.enabled }}
apiVersion: v1
kind: Secret
metadata:
    name: acr-secret
    namespace: {{ include "eu-ldt-participate.namespace" . }}
type: kubernetes.io/dockerconfigjson
data:
    .dockerconfigjson: {{ .Values.acr.dockerconfigjson | required "acr.dockerconfigjson is required when acr.enabled=true" }}
{{- end }}
