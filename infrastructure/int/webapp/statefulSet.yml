apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tool3
spec:
  selector:
    matchLabels:
      app: tool3 # has to match .spec.template.metadata.labels
  serviceName: tool3
  replicas: 1 # by default is 1
  minReadySeconds: 10 # by default is 0
  template:
    metadata:
      labels:
        app: tool3 # has to match .spec.selector.matchLabels
    spec:
      automountServiceAccountToken: false
#      updateStrategy:
#        type: RollingUpdate
#        rollingUpdate:
#          # The default value is 25%.
#          # maxUnavailable is an optional field that specifies the maximum number of Pods that can be unavailable during the update process.
#          maxUnavailable: 0 # The value can be an absolute number (for example, 5) or a percentage of desired Pods (for example, 10%). 
#          # maxSurge is an optional field that specifies the maximum number of Pods that can be created over the desired number of Pods.
#          maxSurge: 1 # The value can be an absolute number (for example, 5) or a percentage of desired Pods (for example, 10%). 
      terminationGracePeriodSeconds: 10
      hostname: tool3
      imagePullSecrets:
        - name: acr-secret
      containers:
            - name: tool3-front
              image: euldtshared.azurecr.io/eu-ldt-pv-int:_%CONTAINER_IMAGE_TOOL_TAG%_
              args: ["--port", "8080"]
              #  image: euldtshared.azurecr.io/eu-ldt-ie-int-fe:_%CONTAINER_IMAGE_TOOL_TAG%_
              imagePullPolicy: IfNotPresent
              resources:
                limits:
                  cpu: "400m"
                  memory: "1536M"
                requests:
                  cpu: "200m"
                  memory: "1536M"
             
              #    env:
              #    - name: VITE_API_URL
    #      valueFrom:
    #        configMapKeyRef:
    #          name: tool3-config        
    #          key: vite_api_url
              ports:
              - containerPort: 8080
                name: http

            - name: tool3-back
                #                image: mcr.microsoft.com/k8se/quickstart:latest
              image: euldtshared.azurecr.io/eu-ldt-pv-int:_%CONTAINER_IMAGE_TOOL_TAG%_
            
              imagePullPolicy: IfNotPresent
              resources:
                limits:
                  cpu: "400m"
                  memory: "1536M"
                requests:
                  cpu: "200m"
                  memory: "1536M"
              env:
              - name: PORT
                value: "8080"
              ports:
              - containerPort: 3000
                name: http-web
