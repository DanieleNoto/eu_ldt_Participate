    - task: Kubernetes@1
      displayName: "Apply File Storage (Tool3)"
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscriptionEndpoint: 'EU-LDT-Toolbox-TF-Shared'
        azureResourceGroup: 'EU-LDT-Toolbox-Shared-int'
        kubernetesCluster: 'eu-ldt-tool-03-participate-aks-int'
        namespace: 'participate'
        command: 'apply'
        arguments: '-f infrastructure/int/storage/file-storage.yml'

