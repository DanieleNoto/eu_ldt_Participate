services:
    decidim:
        build:
            context: ./decidim/decidim_application/
            args:
                RAILS_ENV: development
                NODE_ENV: development
        ports:
            - "3000:3000"
        env_file:
            - .env
        environment:
            - DATABASE_HOST=${DATABASE_HOST}
            - DATABASE_USERNAME=${DATABASE_USERNAME}
            - DATABASE_PASSWORD=${DATABASE_PASSWORD}
            - DATABASE_NAME=${DATABASE_NAME}
            - REDIS_URL=${REDIS_URL}
            - SECRET_KEY_BASE=${SECRET_KEY_BASE}
            - DECIDIM_FORCE_SSL=${DECIDIM_FORCE_SSL}
            - RAILS_ENV=${RAILS_ENV}
            - NODE_ENV=${NODE_ENV}
            - DECIDIM_MAILER_SENDER=${DECIDIM_MAILER_SENDER}
            - QUEUE_ADAPTER=${QUEUE_ADAPTER}
            - OMNIAUTH_KEYCLOAK_CLIENT_ID=${OMNIAUTH_KEYCLOAK_CLIENT_ID}
            - OMNIAUTH_KEYCLOAK_CLIENT_SECRET=${OMNIAUTH_KEYCLOAK_CLIENT_SECRET}
            - OMNIAUTH_KEYCLOAK_SITE=${OMNIAUTH_KEYCLOAK_SITE}
            - OMNIAUTH_KEYCLOAK_REALM=${OMNIAUTH_KEYCLOAK_REALM}
            - SHAKAPACKER_DEV_SERVER_HOST=0.0.0.0
            - SHAKAPACKER_DEV_SERVER_PORT=3035
            - SHAKAPACKER_DEV_SERVER_ENABLED=true
            # CSP Configuration for development
            - RAILS_CSP_DEVELOPMENT=true
            # Database reset and setup flags (controlled by make commands)
            - FORCE_DB_RESET=${FORCE_DB_RESET:-false}
            - FORCE_DATA_SETUP=${FORCE_DATA_SETUP:-false}
            # SMTP configuration
            - SMTP_ADDRESS=${SMTP_ADDRESS}
            - SMTP_PORT=${SMTP_PORT}
            - SMTP_USER_NAME=${SMTP_USER_NAME}
            - SMTP_PASSWORD=${SMTP_PASSWORD}
            - SMTP_DOMAIN=${SMTP_DOMAIN}
            - SMTP_AUTHENTICATION=${SMTP_AUTHENTICATION}
            - SMTP_ENABLE_STARTTLS_AUTO=${SMTP_ENABLE_STARTTLS_AUTO}
            - SMTP_OPENSSL_VERIFY_MODE=${SMTP_OPENSSL_VERIFY_MODE}
            # Matomo Analytics Configuration
            - MATOMO_SITE_ID=${MATOMO_SITE_ID}
            - MATOMO_SERVER_ADDRESS=${MATOMO_SERVER_ADDRESS}
            - MATOMO_TOKEN_AUTH=${MATOMO_TOKEN_AUTH}
            # Tool0 Keycloak Configuration
            - TOOL0_FULL_URL=${TOOL0_FULL_URL}
            # JSON Logging for ELK Stack
            - ENABLE_JSON_LOGS=${ENABLE_JSON_LOGS:-false}
            - RAILS_LOG_TO_STDOUT=true
            # Chatbot configuration
            - CHATBOT_ENABLED=${CHATBOT_ENABLED}
            - CHATBOT_URL=${CHATBOT_URL}
            - CHATBOT_ASSET_VERSION=${CHATBOT_ASSET_VERSION}
        volumes:
            - ./decidim/decidim_application:/code
            - bundle_cache:/usr/local/bundle
            - vendor_bundle:/app/vendor/bundle
            - node_modules:/code/node_modules
        command: bash /code/docker-entrypoint.sh
        networks:
            - private
        depends_on:
            redis:
                condition: service_started
            db:
                condition: service_started
            shakapacker:
                condition: service_started
        healthcheck:
            test: ["CMD", "test", "-d", "node_modules"]
            interval: 10s
            timeout: 5s
            retries: 30
    db:
        image: postgres:16
        env_file:
            - .env
        environment:
            - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
            - POSTGRES_USER=${DATABASE_USERNAME}
            - POSTGRES_DATABASE=${DATABASE_NAME}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - private
        ports:
            - "5432:5432"
    redis:
        image: redis:7
        volumes:
            - redis_data:/data
        networks:
            - private
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5
    shakapacker:
        build:
            context: ./decidim/decidim_application/
            args:
                RAILS_ENV: development
                NODE_ENV: development
        entrypoint: ["bin/shakapacker-dev-server"]
        volumes:
            - ./decidim/decidim_application:/code
            - bundle_cache:/usr/local/bundle
            - vendor_bundle:/app/vendor/bundle
            - node_modules:/code/node_modules
        depends_on:
            - db
            - redis
        networks:
            - private
        ports:
            - "3035:3035"
        env_file:
            - .env
        environment:
            - RAILS_ENV=development
            - NODE_ENV=development
            - SHAKAPACKER_DEV_SERVER_HOST=0.0.0.0
            - SHAKAPACKER_DEV_SERVER_PORT=3035
            - SHAKAPACKER_DEV_SERVER_PUBLIC=0.0.0.0:3035
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:3035"]
            interval: 15s
            timeout: 10s
            retries: 20
            start_period: 30s

    backend:
        build: ./backend/
        ports:
            - "3002:3002"
        env_file:
            - .env
        environment:
            - NODE_ENV=${NODE_ENV}
            - PORT=${PORT}
            - CONTEXT_URL=${CONTEXT_URL}
            # CORS
            - CORS_ORIGINS=${CORS_ORIGINS}
            # Swagger
            - SWAGGER_GEN_DOC_FILE=${SWAGGER_GEN_DOC_FILE}
            # Security
            - DISABLE_HELMET=${DISABLE_HELMET}
            # JWT
            - JWT_ISSUER_PUBKEY=${JWT_ISSUER_PUBKEY}
            - JWT_ENABLE_CHECK=${JWT_ENABLE_CHECK}
            - JWT_TOKEN_URL=${JWT_TOKEN_URL}
            # Database
            - DATABASE_SYNC=${DATABASE_SYNC}
            - DB_USERNAME=${DB_USERNAME}
            - DB_PASSWORD=${DB_PASSWORD}
            - DB_NAME=${DB_NAME}
            - DB_HOST=${DB_HOST}
            - DB_PORT=${DB_PORT}
            - DB_DIALECT=${DB_DIALECT}
            - SEQUELIZE_SEEDER_STORAGE=${SEQUELIZE_SEEDER_STORAGE}
            - SEQUELIZE_SEEDER_STORAGE_TABLE_NAME=${SEQUELIZE_SEEDER_STORAGE_TABLE_NAME}
            - SEQUELIZE_MIGRATION_STORAGE=${SEQUELIZE_MIGRATION_STORAGE}
            - SEQUELIZE_MIGRATION_STORAGE_TABLE_NAME=${SEQUELIZE_MIGRATION_STORAGE_TABLE_NAME}
            - DATABASE_URL=${DATABASE_URL}
            - DB_MAX_POOL=${DB_MAX_POOL}
            - DB_MIN_POOL=${DB_MIN_POOL}
            - DB_IDLE_POOL=${DB_IDLE_POOL}
            - DB_SCHEMA=${DB_SCHEMA}
            # Logger
            - LOGGER_TARGET=${LOGGER_TARGET}
            - LOGGER_LEVEL=${LOGGER_LEVEL}
            # Cypher
            - CYPHER_SECRET=${CYPHER_SECRET}
            - CYPHER_SALT=${CYPHER_SALT}
            # SMTP/Email Configuration
            - SMTP_ADDRESS=${SMTP_ADDRESS}
            - SMTP_PORT=${SMTP_PORT}
            - SMTP_USER_NAME=${SMTP_USER_NAME}
            - SMTP_PASSWORD=${SMTP_PASSWORD}
            - SMTP_DOMAIN=${SMTP_DOMAIN}
            - SMTP_AUTHENTICATION=${SMTP_AUTHENTICATION}
            - SMTP_ENABLE_STARTTLS_AUTO=${SMTP_ENABLE_STARTTLS_AUTO}
            - SMTP_OPENSSL_VERIFY_MODE=${SMTP_OPENSSL_VERIFY_MODE}
            - CHATBOT_SUPPORT_EMAIL=${CHATBOT_SUPPORT_EMAIL}
            - CHATBOT_FROM_EMAIL=${CHATBOT_FROM_EMAIL}
            # Redis
            - REDIS_URL=${REDIS_URL}
            # Service URLs
            - GRAFANA_URL=http://grafana:3000
            - DECIDIM_URL=http://decidim:3000
            - MATOMO_URL=http://matomo:80
            - JITSI_WEB_URL=http://jitsi-web:80
            - SHAKAPACKER_URL=http://shakapacker:3035
        volumes:
            - ./backend:/app
            - /app/node_modules
        networks:
            - private
        depends_on:
            - db
            - redis
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:3002/api/v1/health"]
            interval: 30s
            timeout: 10s
            start_period: 40s
            retries: 3

    chatbot-frontend:
        build:
            context: ./frontend/
        ports:
            - "${FRONTEND_PORT}:${FRONTEND_PORT}"
        env_file:
            - .env
        environment:
            - NODE_ENV=${NODE_ENV}
            - VITE_API_URL=${VITE_API_URL}
        volumes:
            - /app/node_modules
        networks:
            - private
        depends_on:
            - backend
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--no-verbose",
                    "--tries=1",
                    "--spider",
                    "http://localhost:5001/",
                ]
            interval: 30s
            timeout: 10s
            start_period: 40s
            retries: 3
    grafana:
        build:
            context: ./analytics/grafana
        ports:
            - "3001:3000"
        env_file:
            - .env
        environment:
            - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
            - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
            - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
            - GF_SECURITY_ALLOW_EMBEDDING=true
            - GF_DATABASE_HOST=${DATABASE_HOST}
            - GF_DATABASE_NAME=${DATABASE_NAME}
            - GF_DATABASE_USER=${DATABASE_USERNAME}
            - GF_DATABASE_PASSWORD=${DATABASE_PASSWORD}
            # OAuth/Keycloak configuration
            - GF_AUTH_GENERIC_OAUTH_ENABLED=${GF_AUTH_GENERIC_OAUTH_ENABLED}
            - GF_AUTH_GENERIC_OAUTH_NAME=${GF_AUTH_GENERIC_OAUTH_NAME}
            - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=${GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP}
            - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=${GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
            - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
            - GF_AUTH_GENERIC_OAUTH_SCOPES=${GF_AUTH_GENERIC_OAUTH_SCOPES}
            - GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH=${GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH}
            - GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH=${GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH}
            - GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH=${GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH}
            - GF_AUTH_GENERIC_OAUTH_AUTH_URL=${GF_AUTH_GENERIC_OAUTH_AUTH_URL}
            - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=${GF_AUTH_GENERIC_OAUTH_TOKEN_URL}
            - GF_AUTH_GENERIC_OAUTH_API_URL=${GF_AUTH_GENERIC_OAUTH_API_URL}
            - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=${GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH}
            - GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN=${GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN}
            - GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH=${GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH}
            - GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN=${GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN}
            - GF_AUTH_GENERIC_OAUTH_SIGNOUT_REDIRECT_URL=${GF_AUTH_GENERIC_OAUTH_SIGNOUT_REDIRECT_URL}
            - GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN=${GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN}
            - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL}
            - GF_SERVER_DOMAIN=${GF_SERVER_DOMAIN}
        volumes:
            - grafana_data:/var/lib/grafana
        networks:
            - private
        depends_on:
            - db

    matomo:
        build:
            context: ./analytics/matomo
            dockerfile: Dockerfile
        ports:
            - "8081:80"
        env_file:
            - .env
        environment:
            - MATOMO_DATABASE_HOST=${MATOMO_DATABASE_HOST}
            - MATOMO_DATABASE_ADAPTER=${MATOMO_DATABASE_ADAPTER}
            - MATOMO_DATABASE_TABLES_PREFIX=${MATOMO_DATABASE_TABLES_PREFIX}
            - MATOMO_DATABASE_USERNAME=${MATOMO_DATABASE_USERNAME}
            - MATOMO_DATABASE_PASSWORD=${MATOMO_DATABASE_PASSWORD}
            - MATOMO_DATABASE_DBNAME=${MATOMO_DATABASE_DBNAME}
        volumes:
            - matomo_data:/var/www/html
        depends_on:
            - matomo-db
        networks:
            - private

    matomo-db:
        image: mariadb:11
        env_file:
            - .env
        environment:
            - MYSQL_ROOT_PASSWORD=${MATOMO_DATABASE_PASSWORD}
            - MYSQL_DATABASE=${MATOMO_DATABASE_DBNAME}
            - MYSQL_USER=${MATOMO_DATABASE_USERNAME}
            - MYSQL_PASSWORD=${MATOMO_DATABASE_PASSWORD}
        volumes:
            - matomo_db_data:/var/lib/mysql
        networks:
            - private

    jitsi-web:
        image: jitsi/web:stable-8960
        restart: ${RESTART_POLICY:-unless-stopped}
        ports:
            - "${JITSI_HTTP_PORT:-8000}:80"
            - "${JITSI_HTTPS_PORT:-8443}:443"
        volumes:
            - ${CONFIG:-./jitsi-meet-cfg}/web:/config:Z
            - ./jitsi-meet-cfg/web/nginx/prosody-websocket.conf:/config/nginx/prosody-websocket.conf:Z
        environment:
            - ENABLE_AUTH
            - ENABLE_GUESTS
            - PUBLIC_URL
            - XMPP_DOMAIN
            - XMPP_AUTH_DOMAIN
            - XMPP_BOSH_URL_BASE
            - XMPP_GUEST_DOMAIN
            - XMPP_MUC_DOMAIN
            - XMPP_RECORDER_DOMAIN
            - TZ
            - ENABLE_XMPP_WEBSOCKET
        networks:
            - private
        depends_on:
            - jitsi-prosody

    jitsi-prosody:
        image: jitsi/prosody:stable-8960
        restart: ${RESTART_POLICY:-unless-stopped}
        expose:
            - "5222"
            - "5347"
            - "5280"
        volumes:
            - ${CONFIG:-./jitsi-meet-cfg}/prosody/config:/config:Z
            - ${CONFIG:-./jitsi-meet-cfg}/prosody/prosody-plugins-custom:/prosody-plugins-custom:Z
        environment:
            - AUTH_TYPE
            - ENABLE_AUTH
            - ENABLE_GUESTS
            - XMPP_DOMAIN
            - XMPP_AUTH_DOMAIN
            - XMPP_GUEST_DOMAIN
            - XMPP_MUC_DOMAIN
            - XMPP_INTERNAL_MUC_DOMAIN
            - XMPP_MODULES
            - XMPP_RECORDER_DOMAIN
            - JICOFO_AUTH_USER
            - JICOFO_AUTH_PASSWORD
            - JVB_AUTH_USER
            - JVB_AUTH_PASSWORD
            - TZ
            # JWT Keycloak settings
            - JWT_APP_ID
            - JWT_APP_SECRET
            - ENABLE_XMPP_WEBSOCKET
        networks:
            - private

    jitsi-jicofo:
        image: jitsi/jicofo:stable-8960
        restart: ${RESTART_POLICY:-unless-stopped}
        volumes:
            - ${CONFIG:-./jitsi-meet-cfg}/jicofo:/config:Z
        environment:
            - ENABLE_AUTH
            - XMPP_DOMAIN
            - XMPP_AUTH_DOMAIN
            - XMPP_SERVER
            - XMPP_INTERNAL_MUC_DOMAIN
            - JICOFO_AUTH_USER
            - JICOFO_AUTH_PASSWORD
            - JVB_BREWERY_MUC
            - TZ
            # JWT Keycloak settings
            - JWT_APP_ID
            - JWT_APP_SECRET
        depends_on:
            - jitsi-prosody
        networks:
            - private

    jitsi-jvb:
        image: jitsi/jvb:stable-8960
        restart: ${RESTART_POLICY:-unless-stopped}
        ports:
            - "${JVB_PORT:-10000}:${JVB_PORT:-10000}/udp"
        volumes:
            - ${CONFIG:-./jitsi-meet-cfg}/jvb:/config:Z
        environment:
            - DOCKER_HOST_ADDRESS
            - XMPP_AUTH_DOMAIN
            - XMPP_INTERNAL_MUC_DOMAIN
            - XMPP_SERVER
            - JVB_AUTH_USER
            - JVB_AUTH_PASSWORD
            - JVB_BREWERY_MUC
            - JVB_PORT
            - JVB_STUN_SERVERS
            - JVB_ENABLE_APIS
            - TZ
            # JWT Keycloak settings
            - JWT_APP_ID
            - JWT_APP_SECRET
            - JVB_ADVERTISE_IPS
        networks:
            - private
        depends_on:
            - jitsi-prosody

volumes:
    decidim_public:
    redis_data:
    postgres_data:
    bundle_cache:
    vendor_bundle:
    node_modules:
    grafana_data:
    matomo_data:
    matomo_db_data:
    jitsi_web:
    jitsi_prosody:
    jitsi_jicofo:
    jitsi_jvb:
networks:
    private:
