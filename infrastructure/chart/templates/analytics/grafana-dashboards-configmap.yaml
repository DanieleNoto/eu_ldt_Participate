        					"rawQuery": true,
        					"rawSql": "SELECT \n  DATE_TRUNC('week', action_time) as time,\n  COUNT(DISTINCT user_id) as \"Active Users\"\nFROM (\n  SELECT decidim_author_id as user_id, created_at as action_time\n  FROM decidim_comments_comments\n  WHERE deleted_at IS NULL AND decidim_author_type IN ('Decidim::User', 'Decidim::UserBaseEntity')\n    AND created_at >= NOW() - INTERVAL '12 weeks'\n  UNION ALL\n  SELECT ca.decidim_author_id as user_id, p.created_at as action_time\n  FROM decidim_coauthorships ca\n  JOIN decidim_proposals_proposals p ON ca.coauthorable_id = p.id AND ca.coauthorable_type = 'Decidim::Proposals::Proposal'\n  WHERE p.deleted_at IS NULL AND ca.decidim_author_type IN ('Decidim::User', 'Decidim::UserBaseEntity')\n    AND p.created_at >= NOW() - INTERVAL '12 weeks'\n  UNION ALL\n  SELECT decidim_author_id as user_id, created_at as action_time\n  FROM decidim_likes\n  WHERE decidim_author_type IN ('Decidim::User', 'Decidim::UserBaseEntity')\n    AND created_at >= NOW() - INTERVAL '12 weeks'\n) activities\nGROUP BY DATE_TRUNC('week', action_time)\nORDER BY time;",
