apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: matomo-subpath-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Rewrite target: strip the external /analytics/matomo prefix when
    # forwarding to the backend, but set X-Forwarded-Prefix so Matomo
    # can generate correct asset URLs pointing to /analytics/matomo/...
    nginx.ingress.kubernetes.io/rewrite-target: '/$2'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Forwarded-Prefix /analytics/matomo;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
  - host: part-int.ldttoolbox.app
    http:
      paths:
      - path: /analytics/matomo(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: matomo
            port:
              number: 8081
