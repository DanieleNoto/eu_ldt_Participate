apiVersion: v1
kind: ConfigMap
metadata:
    name: grafana-db-config
    namespace: {{ include "eu-ldt-participate.namespace" . }}
data:
    # POSTGRES_DB is required by the official postgres image to create the DB on first init
    POSTGRES_DB: {{ .Values.grafana.db.name }}
    POSTGRES_DATABASE: {{ .Values.grafana.db.name }}
    PGDATA: {{ .Values.grafana.db.pgdataPath }}
